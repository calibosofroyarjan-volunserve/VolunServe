name: Validate Assistance Requests Simple Review (No Deployment)
on:
  pull_request:
    branches: [live-protected]
    paths:
      - 'app/(admin)/assistance-requests.tsx'
      - 'scripts/test-assistance-defense-simple-flow-20261119.cjs'
      - '.github/workflows/validate-assistance-defense-simple-flow.yml'
permissions:
  contents: read
jobs:
  verify-review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Validate simplified protected-review flow
        run: node scripts/test-assistance-defense-simple-flow-20261119.cjs
      - name: Preserve existing LGU UI and donation guard contracts
        run: |
          node scripts/test-lgu-internal-review-ux.cjs
          node scripts/test-donation-lgu-role-isolation.cjs
