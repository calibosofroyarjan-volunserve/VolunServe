name: QA Community Signed-In Counts and One-Click Public Profile (NO DEPLOY)
on:
  push:
    branches: [qa/private-active-count-ui-20261121]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact single component scope and privacy semantics
        run: |
          git diff --name-status 85bf4026d0c54c98c3432a3102279bb446ae3235 df63157a1933453fd9055b552fa6a18889ade98a
          node - <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const ui=fs.readFileSync('components/home/CommunityOnline.tsx','utf8');
          const home=fs.readFileSync('components/home/Home.web.tsx','utf8');
          for(const x of ['activeCounts.total','Public Profiles','Show My Public Profile',
            'directoryListed','updatePreference("directoryListed")','Allow Private Messages','memberLastSeen'])
            a(ui.includes(x),'Missing aggregate count/consent '+x);
          a(home.includes('Emergency Contacts'));
          a(home.includes('title="Announcements"'));
          a(home.includes('CommunityCalendar'));
          a(!ui.includes('getDocs(')&&!ui.includes('collection(db,'),
            'Frontend must not enumerate users directly');
          NODE
      - name: Install pinned site dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and login, profile, role and maps regressions
        run: |
          npx tsc --noEmit --incremental false
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-profile-certificates-account-menu.cjs
      - name: Production web build (NO DEPLOY)
        run: |
          npx expo export --platform web --clear
          test -f dist/index.html
          test -f dist/community-member-profile.html || test -f dist/community-member-profile/index.html
          test -f dist/community-chat.html || test -f dist/community-chat/index.html
