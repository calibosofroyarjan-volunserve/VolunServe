name: Inspect Live VolunServe Release Before Community Event Deploy (Read Only)
on:
  push:
    branches: [fix/community-events-sjdm-inapp-route-20261106]
    paths:
      - '.github/workflows/check-live-community-events-release-base.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract source without legacy gitlink
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" -o "$RUNNER_TEMP/src.tar.gz"
          tar -xzf "$RUNNER_TEMP/src.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect current live release fingerprint and public routes (no writes)
        run: node scripts/check-live-hosting.cjs
      - name: Check current backend public health without authentication
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 25 \
            -H 'Accept: application/json' 'https://volunserve.onrender.com/health' \
            | node -e 'let raw="";process.stdin.on("data",c=>raw+=c);process.stdin.on("end",()=>{const j=JSON.parse(raw);if(!j||typeof j!=="object"||j.ok===false)process.exit(1);console.log("Backend public health HTTP 200 and JSON object confirmed; auth/data not exercised")})'
