name: Validate focused Admin Emergency Map UI (no deploy)
on:
  push:
    branches:
      - fix/admin-emergency-focused-response-map-20261115
permissions:
  contents: read
jobs:
  focused-admin-map-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Focused case-map, Admin navigation and privacy checks
        run: |
          node scripts/test-admin-focused-response-map-20261115.cjs
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-emergency-announcement-advisory-link.cjs
          node scripts/test-module-announcements-publishing-20261115.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Expo web export (build only)
        run: npx expo export --platform web --clear
