name: Publish Super Admin Contextual View All (Hosting Only)
on:
  push:
    branches:
      - release/superadmin-contextual-viewall-20261105
    paths:
      - .github/workflows/release-superadmin-contextual-viewall-20261105.yml

permissions:
  contents: read

concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false

jobs:
  verify-and-deploy-audit-ui:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDITED_LIVE_SHA: 825f66ae30bd44ac37cabc213c5ff5dbfb66fef6
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check out exact audited release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fail closed if source diff contains anything beyond Audit Logs and this release guard
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$AUDITED_LIVE_SHA^{commit}"
          git diff --name-only "$AUDITED_LIVE_SHA" HEAD > /tmp/audit-ui-changed-files
          echo "Reviewing isolated Audit Logs Hosting change:"
          cat /tmp/audit-ui-changed-files
          test "$(wc -l < /tmp/audit-ui-changed-files)" -eq 4
          grep -Fxq 'app/(superadmin)/admin-logs.tsx' /tmp/audit-ui-changed-files
          grep -Fxq 'app/(superadmin)/index.tsx' /tmp/audit-ui-changed-files
          grep -Fxq 'lib/superAdminAuditCategories.ts' /tmp/audit-ui-changed-files
          grep -Fxq '.github/workflows/release-superadmin-contextual-viewall-20261105.yml' /tmp/audit-ui-changed-files
          echo "PASS: only the Super Admin overview navigation, audit filters, shared classifier and this release guard changed."

      - name: Verify public production revision matches exact previously deployed base
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch("https://volunserve.com/volunserve-release.json", {
              signal: AbortSignal.timeout(15000),
              headers: { accept: "application/json", "cache-control": "no-cache" },
            });
            if (!response.ok) throw Error("Cannot verify live Hosting revision; no deploy");
            const release = await response.json();
            console.log("Observed live Hosting revision:", release.revision || "(missing)");
            if (release.app !== "VolunServe" ||
                release.firebaseProject !== "volunserve-3aa5b" ||
                release.revision !== process.env.AUDITED_LIVE_SHA) {
              throw Error("Live revision differs from audited production base; STOP without deploying.");
            }
            console.log("PASS: current live Hosting matches audited production source.");
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check View All target categories, audit continuity and TypeScript
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const overview = fs.readFileSync("app/(superadmin)/index.tsx","utf8");
          const audit = fs.readFileSync("app/(superadmin)/admin-logs.tsx","utf8");
          const categories = fs.readFileSync("lib/superAdminAuditCategories.ts","utf8");
          for (const value of [
            'params: { view: "lgu" }',
            'params: { view: "system" }',
            "isSystemAccessChangeAction(item.actionType)",
            "adminUids.includes(item.actorUid)",
            "const PAGE_SIZE = 5"
          ]) assert(overview.includes(value), "Overview routing contract missing: " + value);
          for (const value of [
            "useLocalSearchParams", "setKind(auditViewFromParam(view))",
            'adminUids.includes(item.adminUid)',
            "isSystemAccessChangeAction(item.actionType)",
            "collection(db, \"users\")",
            "collection(db, source)",
            "const PAGE_SIZE = 5",
            "profile?.role === \"superadmin\"",
            "<ListPagination",
            "<SuperAdminFilterSort"
          ]) assert(audit.includes(value), "Audit history contract missing: " + value);
          assert(categories.includes("export const isSystemAccessChangeAction"), "Shared classifier missing");
          console.log("PASS: 2 distinct View All categories align with the full history and use current read permissions.");
          NODE
          npx tsc --noEmit

      - name: Export Expo web without modifying Firestore, Functions, Storage or Auth
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs

      - name: Recheck live revision immediately before publishing
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch("https://volunserve.com/volunserve-release.json", {
              signal: AbortSignal.timeout(15000),
              headers: { accept: "application/json", "cache-control": "no-cache" },
            });
            if (!response.ok) throw Error("Cannot verify current live revision; refusing deploy");
            const release = await response.json();
            if (release.revision !== process.env.AUDITED_LIVE_SHA) throw Error("Live Hosting changed during build; refuse deployment.");
            console.log("PASS: production baseline still matches.");
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - name: Require configured Firebase Hosting service account
        shell: bash
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Firebase Hosting credentials missing. NO DEPLOY attempted."
            exit 1
          fi

      - name: Publish ONLY web assets to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          projectId: volunserve-3aa5b
          channelId: live

      - name: Confirm new release fingerprint and essential routes on custom domain
        env:
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then
              echo "SUCCESS: Super Admin contextual View All release confirmed on volunserve.com."
              exit 0
            fi
            echo "Release propagation not verified yet, attempt $attempt"
            sleep 10
          done
          echo "::error::Hosting publish was attempted but custom-domain revision not verified."
          exit 1
