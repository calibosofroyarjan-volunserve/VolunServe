name: Read-only Verify Current Live VolunServe Hosting Revision
on:
  push:
    branches: [audit/verify-current-live-ui-20261107]
permissions: {}
jobs:
  inspect-live:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect public Hosting release markers and static route responses (no checkout, no secrets, no writes)
        run: |
          node <<'NODE'
          const targets=["https://volunserve.com","https://volunserve-3aa5b.web.app"];
          async function check(base){
            const marker=await fetch(base+"/volunserve-release.json",{
              signal:AbortSignal.timeout(15000),
              headers:{"cache-control":"no-cache"}
            });
            const type=marker.headers.get("content-type")||"";
            const data=await marker.json();
            if(!marker.ok||!type.includes("json")||
              data.app!=="VolunServe"||data.firebaseProject!=="volunserve-3aa5b"||
              !/^[0-9a-f]{40}$/.test(data.revision||""))throw Error("Invalid release metadata: "+base);
            console.log("VERIFIED LIVE REVISION "+new URL(base).hostname+" "+data.revision+" BUILT "+data.builtAt);
            for(const route of ["/","/login","/community-events"]){
              const response=await fetch(base+route,{signal:AbortSignal.timeout(12000)});
              const html=await response.text();
              if(!response.ok||!html.includes("<html"))throw Error("Route unavailable: "+base+route);
              console.log("PASS HTTP "+response.status+" "+base+route);
            }
          }
          (async()=>{for(const base of targets)await check(base)})().catch(error=>{
            console.error("READ-ONLY LIVE CHECK FAILED "+error.message);
            process.exitCode=1;
          });
          NODE
