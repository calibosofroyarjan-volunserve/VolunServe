name: Publish Compact LGU Admin UX and Pagination (Hosting Only)
on:
  push:
    branches:
      - release/admin-compact-ux-pagination-20261030
    paths:
      - .github/workflows/release-admin-compact-ux-pagination-20261030.yml
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require approved main and workflow-only release delta
        shell: bash
        run: |
          git merge-base --is-ancestor 27a7a488da9b99141a5a851abc826c59c671019d HEAD
          test "$(git diff --name-only 27a7a488da9b99141a5a851abc826c59c671019d HEAD)" = ".github/workflows/release-admin-compact-ux-pagination-20261030.yml"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Guard compact UI, paging, approvals, emergency and navigation
        run: |
          node scripts/test-admin-compact-workspace-ux.cjs
          node scripts/test-unified-admin-dashboard-and-emergency-pagination.cjs
          node scripts/test-admin-overview-ui.cjs
          node scripts/test-dashboard-overviews.cjs
          node scripts/test-lgu-dashboard-inline-approvals-and-paging.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-pavia-admin-pagination-announcements.cjs
          node scripts/test-admin-response-workspace-ux.cjs
          node scripts/test-final-admin-scope.cjs
          node scripts/test-remove-admin-evacuation-centers.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          npx tsc --noEmit --pretty false
      - name: Compile and stamp verified Expo Hosting artifact
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Refuse deploy when Hosting credentials unavailable
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Firebase Hosting credentials; production unchanged."
            exit 1
          fi
      - name: Deploy Firebase Hosting only (not Firestore, Functions or backend)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact live revision on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Expected production revision not verified."
          exit 1
