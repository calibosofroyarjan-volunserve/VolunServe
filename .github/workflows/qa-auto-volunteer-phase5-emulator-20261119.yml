name: Auto Volunteer Phase 5 manual-vs-auto winner guard - EMULATOR ONLY
on:
  pull_request:
    branches:
      - qa/auto-volunteer-phase4-firestore-emulator-20261119
    paths:
      - "lib/emergencyVolunteerWinnerGuard.js"
      - "lib/emergencyVolunteerWinnerGuard.d.ts"
      - "app/(admin)/admin-cases.tsx"
      - "app/(tabs)/volunteer.tsx"
      - "app/(tabs)/volunteer.web.tsx"
      - "firestore.rules"
      - "backend/test-emergencyVolunteerWinnerGuard.cjs"
      - "backend/test-autoVolunteerPhase5CompatEmulator.cjs"
      - "backend/test-autoVolunteerPhase5RulesEmulator.cjs"
      - "docs/emergency-volunteer/PHASE5_MANUAL_AUTOMATIC_WINNER_GUARD_20261119.md"
      - ".github/workflows/qa-auto-volunteer-phase5-emulator-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protect-manual-and-automatic-case-winner-no-deploy:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-volunserve-auto-phase4
      GOOGLE_CLOUD_PROJECT: demo-volunserve-auto-phase4
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict Phase 5 diff allowlist; production modules only in review branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin qa/auto-volunteer-phase4-firestore-emulator-20261119
          git diff --name-only origin/qa/auto-volunteer-phase4-firestore-emulator-20261119 HEAD > /tmp/auto-phase5-changes.txt
          while IFS= read -r filename; do
            case "$filename" in
              "lib/emergencyVolunteerWinnerGuard.js"|"lib/emergencyVolunteerWinnerGuard.d.ts"|"app/(admin)/admin-cases.tsx"|"app/(tabs)/volunteer.tsx"|"app/(tabs)/volunteer.web.tsx"|"firestore.rules"|"backend/test-emergencyVolunteerWinnerGuard.cjs"|"backend/test-autoVolunteerPhase5CompatEmulator.cjs"|"backend/test-autoVolunteerPhase5RulesEmulator.cjs"|"docs/emergency-volunteer/PHASE5_MANUAL_AUTOMATIC_WINNER_GUARD_20261119.md"|".github/workflows/qa-auto-volunteer-phase5-emulator-20261119.yml")
                ;;
              *)
                echo "BLOCKED: unrelated file changed: $filename"
                exit 1
                ;;
            esac
          done < /tmp/auto-phase5-changes.txt
          echo "PASS: only explicitly reviewed draft Phase 5 files."
      - name: Install locked dependencies without package lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Shared winner guard and both Volunteer UI syntax and source protections
        run: |
          node --check lib/emergencyVolunteerWinnerGuard.js
          node --check backend/test-emergencyVolunteerWinnerGuard.cjs
          node --test backend/test-emergencyVolunteerWinnerGuard.cjs
          node - <<'NODE'
          const ts=require("typescript"),fs=require("node:fs");
          const files=["app/(admin)/admin-cases.tsx","app/(tabs)/volunteer.tsx","app/(tabs)/volunteer.web.tsx"];
          for(const file of files){
            const data=fs.readFileSync(file,"utf8");
            const result=ts.transpileModule(data,{
              fileName:file,reportDiagnostics:true,
              compilerOptions:{module:ts.ModuleKind.CommonJS,jsx:ts.JsxEmit.ReactJSX}
            });
            const errors=(result.diagnostics||[]).filter(x=>x.category===ts.DiagnosticCategory.Error);
            if(errors.length)throw Error(file+" TypeScript syntax errors: "+errors.map(x=>ts.flattenDiagnosticMessageText(x.messageText," ")).join("; "));
            console.log("PASS: TSX syntax ",file);
          }
          NODE
      - name: REAL local Firestore emulator transaction races and CLIENT SECURITY RULES
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo "BLOCKED: real credentials must not be present"; exit 1; }
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only firestore "node --test --test-concurrency=1 backend/test-autoVolunteerFirestoreEmulator.cjs backend/test-autoVolunteerPhase5CompatEmulator.cjs backend/test-autoVolunteerPhase5RulesEmulator.cjs"
      - name: Preserve Phase 1-3 offline tests and existing backend checks
        run: |
          node --test backend/test-emergencyAutoVolunteerReadOnlyPlanner.cjs
          node --test backend/test-autoVolunteerAdminReadOnlyPreview.cjs
          node --test backend/test-autoVolunteerAtomicDecisionPolicy.cjs
          npm run check --prefix backend
      - name: No production live server integration or deployment
        run: |
          if grep -Fq 'autoVolunteerAtomicDecisionPolicy' backend/server.js; then
            echo "BLOCKED: no automatic dispatch server integration authorized"
            exit 1
          fi
          echo "FIRESTORE RULES ARE DRAFT ONLY; NOT DEPLOYED."
          echo "NO PROD FIREBASE / RENDER / HOSTING DEPLOY. NO REAL EMERGENCY ASSIGNMENTS."
