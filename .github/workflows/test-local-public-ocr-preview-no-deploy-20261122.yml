name: Local account-free National ID OCR demo - STAGING NO DEPLOY
on:
  push:
    branches:
      - feat/staging-public-local-ocr-demo-20261122
    paths:
      - 'app/public/local-national-id-demo.web.tsx'
      - 'app/public/local-national-id-demo.tsx'
      - 'components/identity/StagingNationalIdLocalLab.web.tsx'
      - 'components/identity/StagingNationalIdLocalLab.d.ts'
      - 'identity-ai/test_local_public_ocr_preview_20261122.py'
      - '.github/workflows/test-local-public-ocr-preview-no-deploy-20261122.yml'
permissions:
  contents: read
jobs:
  local-preview-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local demo non-auth regression checks
        run: python -m unittest discover -s identity-ai -p test_local_public_ocr_preview_20261122.py -v
  web-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile web app without producing or deploying files
        run: ./node_modules/.bin/tsc --noEmit --pretty false
