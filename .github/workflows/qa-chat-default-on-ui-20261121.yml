name: QA Automatic Member Chat UI (NO DEPLOY)
on:
  push:
    branches: [fix/chat-default-on-ui-20261121]
    paths:
      - 'components/home/CommunityOnline.tsx'
      - 'app/(tabs)/community-chat.tsx'
      - 'app/(tabs)/community-inbox.tsx'
      - 'app/(tabs)/community-member-profile.tsx'
      - 'app/signup.web.tsx'
      - 'app/signup.tsx'
      - 'components/auth/EmailFirstSignup.tsx'
      - '.github/workflows/qa-chat-default-on-ui-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify no unrelated changes and accurate member chat UI
        run: |
          git fetch origin fix/community-chat-test-ux-20261121 --depth=1
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',
            'origin/fix/community-chat-test-ux-20261121','HEAD'],text=True).splitlines())
          allowed={'components/home/CommunityOnline.tsx','app/(tabs)/community-chat.tsx',
            'app/(tabs)/community-inbox.tsx','app/(tabs)/community-member-profile.tsx',
            'app/signup.web.tsx','app/signup.tsx','components/auth/EmailFirstSignup.tsx',
            '.github/workflows/qa-chat-default-on-ui-20261121.yml'}
          assert changed and changed.issubset(allowed),repr(changed)
          print('PASS only community chat presentation and privacy notice files changed')
          PY
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const ui=fs.readFileSync('components/home/CommunityOnline.tsx','utf8');
          const chat=fs.readFileSync('app/(tabs)/community-chat.tsx','utf8');
          const inbox=fs.readFileSync('app/(tabs)/community-inbox.tsx','utf8');
          a(!ui.includes('Enable My Chats'));
          a(!ui.includes('Chat Off'));
          a(ui.includes('Pause Private Messages'));
          a(ui.includes('useState(true)'));
          a(ui.includes('member.isSelf?<Text style={styles.youLabel}> (You)</Text>'));
          a(ui.includes('showsVerticalScrollIndicator'));
          a(chat.includes('available by default'));
          a(inbox.includes('Members can receive messages even while offline'));
          for(const path of ['app/signup.web.tsx','app/signup.tsx','components/auth/EmailFirstSignup.tsx']){
            const s=fs.readFileSync(path,'utf8');
            a(s.includes('by default')||s.includes('can message me by default'),path);
          }
          console.log('PASS automatic messages UX, optional pause and unchanged roster/Last Seen');
          NODE
      - name: Confirm live Hosting source unmodified (READ ONLY)
        run: VOLUNSERVE_EXPECTED_SHA=3f991b0900a11b5d381bb9bf33179aac32ed845f node scripts/check-live-hosting.cjs
      - name: TypeScript and login/role/map/profile regression checks
        run: |
          npx tsc --noEmit --incremental false
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-profile-certificates-account-menu.cjs
      - name: Export production web bundle without deployment
        run: npx expo export --platform web --output-dir /tmp/volunserve-chat-default-qa