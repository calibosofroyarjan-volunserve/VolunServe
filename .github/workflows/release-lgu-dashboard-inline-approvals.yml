name: Publish Inline LGU Volunteer Approvals & 5-Row Lists (Hosting Only)
on:
  push:
    branches:
      - release/lgu-dashboard-inline-approvals-paging-20261029
    paths:
      - .github/workflows/release-lgu-dashboard-inline-approvals.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression checks for inline Admin approvals and previously approved modules
        run: |
          node scripts/test-lgu-dashboard-inline-approvals-and-paging.cjs
          node scripts/test-lgu-internal-review-ux.cjs
          node scripts/test-lgu-admin-navigation-groups.cjs
          node scripts/test-admin-overview-ui.cjs
          node scripts/test-superadmin-grouped-records.cjs
          node scripts/test-superadmin-settings-records-retention.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-password-reset-popup.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-clean-emergency-report-header.cjs
          node scripts/test-final-admin-scope.cjs
          npx tsc --noEmit --pretty false
      - name: Build production Expo web
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require Firebase credentials
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Firebase Hosting credentials missing; no deployment attempted"
            exit 1
          fi
      - name: Deploy Hosting ONLY - leave data, Rules, Functions and Storage unchanged
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Confirm exact revision on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Waiting for deployed revision attempt $attempt"
            sleep 10
          done
          echo "::error::Custom domain does not serve the approved LGU dashboard revision"
          exit 1
