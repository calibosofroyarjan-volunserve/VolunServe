name: Publish Restored Premium Super Admin (Hosting Only)
on:
  push:
    branches:
      - release/premium-superadmin-restore-20261029
    paths:
      - .github/workflows/release-premium-superadmin-restore.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify premium Super Admin UI, pagination and current role scope
        run: |
          node scripts/test-superadmin-premium-restoration.cjs
          node scripts/test-dashboard-overviews.cjs
          node scripts/test-final-admin-scope.cjs
          node --test scripts/test-superadmin-accounts-directory.cjs
          npx tsc --noEmit --pretty false
      - name: Export approved web application
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require Firebase Hosting credentials
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Firebase service account; deployment not attempted."
            exit 1
          fi
      - name: Publish Firebase Hosting ONLY
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact premium dashboard revision on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Waiting for live custom domain revision attempt $attempt"
            sleep 10
          done
          echo "::error::Live website does not serve the expected restored Super Admin release"
          exit 1
