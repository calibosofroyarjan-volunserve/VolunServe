# Isolated read-only Signup security review. Never publishes Firebase or Hosting.
name: Review Gmail Google Ownership Signup (NO DEPLOY)
on:
  push:
    branches: [fix/signup-google-ownership-emailnator-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require exact LIVE Hosting source ancestry and only approved Signup changes
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const cp=require('node:child_process');
          const base='6b30cbd7fe72abb247b6b32233411048d6e42b84';
          cp.execFileSync('git',['merge-base','--is-ancestor',base,'HEAD']);
          const changes=cp.execFileSync('git',['diff','--name-status','--no-renames',base,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=[
            '.github/workflows/review-gmail-google-ownership-signup-no-deploy-20261119.yml',
            'components/auth/EmailFirstSignup.tsx',
            'lib/registrationEmailPolicy.ts',
            'lib/signupRegistration.ts',
            'lib/firebaseAuth.ts',
            'scripts/test-signup-prod.cjs',
          ].sort();
          assert.deepEqual(changes.map(v=>v.split('\t')[1]).sort(),allowed);
          assert(changes.every(v=>/^[AM]\t/.test(v)),'No deletes or renames');
          console.log('PASS: exact live-derived Signup-only candidate; no unrelated code or infra');
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript + full Auth/Signup/cross-role regression tests
        run: |
          npx tsc --noEmit --incremental false
          node scripts/test-signup-prod.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-login-field-validation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-route-entrypoints.cjs
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-profile-certificates-account-menu.cjs
          node scripts/test-unified-login-routing.cjs
      - name: Verify Expo web build without publishing
        run: |
          npx expo export --platform web --clear
          node scripts/verify-hosting-release.cjs
      - name: Guarantee no live Rules, Functions, Render or dependency edits
        run: |
          git diff --exit-code 6b30cbd7fe72abb247b6b32233411048d6e42b84 HEAD -- firebase.json .firebaserc firestore.rules storage.rules firestore.indexes.json functions backend identity-ai package.json package-lock.json
