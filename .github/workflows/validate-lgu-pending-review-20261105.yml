name: Verify Red Required Fields and Pending LGU Approve Reject (No Live Deploy)
on:
  push:
    branches: [release/lgu-pending-approve-reject-ui-20261105]
    paths:
      - .github/workflows/validate-lgu-pending-review-20261105.yml
      - app/admin-request.tsx
      - app/(superadmin)/admin-accounts.tsx
      - firestore.rules
      - scripts/test-superadmin-lgu-approval-rejection.cjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_EMAIL_FIRST_SIGNUP: "true"
      LIVE_BASE: "4520b201c9f6e86f810d2b7c3c1377c158ac424e"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: No unrelated changes against last deployed Super Admin and Signup
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$LIVE_BASE" HEAD
          git diff --exit-code "$LIVE_BASE" HEAD -- 'app/login.tsx' 'app/login.web.tsx' 'app/signup.tsx' 'app/signup.web.tsx' 'app/(admin)' 'app/(tabs)' 'storage.rules' 'lib/firebaseAuth.ts' 'functions' 'backend' '.firebaserc' 'firebase.json'
          echo "PASS unchanged Login, Signup, LGU Admin, Residents, Volunteers, Storage, Functions and Firebase targets."
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Compile and validate Login Signup and Super Admin forms
        run: |
          npx tsc --noEmit --incremental false
          node scripts/test-unified-login-routing.cjs
          node scripts/test-login-field-validation.cjs
          node scripts/test-signup-prod.cjs
          node scripts/test-admin-staff-login.cjs
          node scripts/test-superadmin-lgu-review-ui.cjs
      - name: Emulator test LGU applicant rejected and approved roles
        run: npx firebase emulators:exec --only firestore --project demo-volunserve --non-interactive "node scripts/test-superadmin-lgu-approval-rejection.cjs && node scripts/test-lgu-admin-rules.cjs"
      - name: Build full web including preserved premium Signup
        run: |
          npx expo export --platform web --clear
          node scripts/verify-hosting-release.cjs
      - name: Final safety statement
        run: |
          echo "PASS: scoped red asterisks and audited LGU pending Approve/Reject, no production touched."
          echo "Sensitive LGU document upload remains disabled until Storage authorization is resolved."
