name: Gmail Alias Resident Signup Review (NO DEPLOY)
on:
  push:
    branches: [fix/gmail-alias-claim-signup-review-20261110]
  pull_request:
    branches: [fix/actual-live-site-login-signup-20261109]
permissions:
  contents: read
jobs:
  web-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Offline canonical alias tests and signup regression
        run: |
          node --check scripts/test-gmail-alias-claims.cjs
          node scripts/test-gmail-alias-claims.cjs
          node scripts/test-signup-prod.cjs
          node scripts/test-site-derived-signup-candidate.cjs
      - name: Compile site-derived web candidate (no publish)
        run: |
          npx tsc --noEmit --incremental false
          npx expo export --platform web --clear
      - name: No live deployment
        run: echo 'PASS — no Firebase Hosting, Auth, Rules, Firestore or Render deploy'
