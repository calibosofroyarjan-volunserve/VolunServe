name: Validate privacy-safe Emergency public advisory draft
on:
  push:
    branches:
      - fix/admin-emergency-verified-public-advisory-announcements-20261115

permissions:
  contents: read

jobs:
  advisory-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source security/privacy and Announcements integration
        run: |
          node scripts/test-emergency-announcement-advisory-link.cjs
          node scripts/test-admin-response-workspace-ux.cjs
          node scripts/test-admin-navigation-contract.cjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript compilation
        run: npx tsc --noEmit --incremental false
      - name: Expo web export - no production deploy
        run: npx expo export --platform web --clear
