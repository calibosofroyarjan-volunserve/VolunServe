name: Original AI Real Node-to-Python MediaPipe Resident E2E (NO DEPLOY)
on:
  push:
    branches:
      - qa/original-ai-live-parity-20261125
    paths:
      - scripts/qa-original-ai-admin-firestore-emulator-20261125.cjs
      - .github/workflows/qa-original-ai-resident-python-integration-20261125.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: 'true'
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      GOOGLE_APPLICATION_CREDENTIALS: ''
      CLOUDINARY_API_SECRET: ''
      PAYMONGO_SECRET_KEY: ''
      IDENTITY_AI_INTERNAL_KEY: ''
      GCLOUD_PROJECT: demo-volunserve-original-ai-admin-qa
      GOOGLE_CLOUD_PROJECT: demo-volunserve-original-ai-admin-qa
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch only test harness and exact deployed Node route source (NO CHECKOUT)
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path=require('path');
            const {owner,repo}=context.repo;
            const live='d06aeb1e0a572bf8581a99d7064da0a8d2430ed4';
            const pinned=[
              ['backend/server.js',live],
              ['backend/selectedIdPolicy.js',live],
              ['backend/identityIssuerReviewPolicy.js',live],
              ['backend/identityPrivateEvidence.js',live],
              ['backend/identityAiReadiness.js',live],
              ['backend/identityHybridPrecheckDecision.js',live],
              ['backend/identityAutoApprovalGateway.js',live],
              ['backend/automaticIdentityApprovalPolicy.js',live],
              ['backend/adminAccess.js',live],
              ['backend/verifiedFirebaseToken.js',live],
              ['scripts/qa-original-ai-admin-firestore-emulator-20261125.cjs',context.sha],
            ];
            for(const [filename,ref] of pinned) {
              const {data}=await github.rest.repos.getContent({owner,repo,path:filename,ref});
              if(Array.isArray(data)||data.encoding!=='base64')throw new Error('Expected pinned source missing: '+filename);
              const dest=path.join(process.env.GITHUB_WORKSPACE,'.qa-work',
                filename.startsWith('scripts/')?'test-admin.js':filename);
              fs.mkdirSync(path.dirname(dest),{recursive:true});
              fs.writeFileSync(dest,Buffer.from(data.content,'base64'));
              core.info('Read-only source: '+filename+' ('+ref.slice(0,9)+')');
            }
            const pythonRef='319152e6a1cad5e54653c20e87bd1551a82b219e';
            for(const py of [
              'main.py','document_screening.py','profile_consistency.py',
              'face_boxes.py','requirements.txt','test_synthetic_document_pipeline.py'
            ]){
              const {data}=await github.rest.repos.getContent({
                owner,repo,path:'identity-ai/'+py,ref:pythonRef
              });
              if(Array.isArray(data)||data.encoding!=='base64')
                throw Error('Pinned original MediaPipe source missing: '+py);
              const dest=path.join(process.env.GITHUB_WORKSPACE,'.qa-work','identity-ai',py);
              fs.mkdirSync(path.dirname(dest),{recursive:true});
              fs.writeFileSync(dest,Buffer.from(data.content,'base64'));
              core.info('Read-only deployed Python '+py);
            }
            core.info('No application source has been checked out or modified');
      - name: Install local-only test runtime
        run: |
          npm install --prefix .qa-work --no-save --no-audit --no-fund --ignore-scripts \
            express@5.1.0 firebase-admin@14.3.0 firebase-tools@14
          node --check .qa-work/test-admin.js
          node - <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('.qa-work/emulators.json',JSON.stringify({
            emulators:{
              auth:{host:'127.0.0.1',port:9099},
              firestore:{host:'127.0.0.1',port:8080},
              ui:{enabled:false}
            },
            firestore:{rules:'firestore.rules'}
          },null,2));
          fs.writeFileSync('.qa-work/firestore.rules',
            'rules_version = "2";\nservice cloud.firestore { match /databases/{database}/documents { match /{document=**} { allow read, write: if false; } } }\n');
          console.log('PASS: explicit demo Auth + Firestore emulator config written, client rules deny all');
          NODE
      - name: Install ORIGINAL Python OCR/MediaPipe dependencies, emulator only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr libgl1 libglib2.0-0 libgomp1
          python -m pip install --disable-pip-version-check -r .qa-work/identity-ai/requirements.txt
          python -m py_compile .qa-work/identity-ai/main.py
      - name: Execute real Node-to-Python synthetic verification with Firebase emulators
        timeout-minutes: 12
        run: |
          test "$GCLOUD_PROJECT" = demo-volunserve-original-ai-admin-qa
          test -z "$GOOGLE_APPLICATION_CREDENTIALS"
          test -z "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -z "$CLOUDINARY_API_SECRET"
          test -z "$PAYMONGO_SECRET_KEY"
          test -z "$IDENTITY_AI_INTERNAL_KEY"
          set -euo pipefail
          test -z "$IDENTITY_AI_INTERNAL_KEY"
          mkdir -p .qa-work/fake-images
          (
            cd .qa-work/identity-ai
            python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          from test_synthetic_document_pipeline import (
              synthetic_photo,NATIONAL_SAMPLE,BACK_SIDE_SAMPLE,SCHOOL_SAMPLE)
          p=Path('../fake-images')
          p.mkdir(parents=True,exist_ok=True)
          for name,lines in [
              ('front',NATIONAL_SAMPLE),('back',BACK_SIDE_SAMPLE),
              ('school',SCHOOL_SAMPLE)]:
              payload,_=synthetic_photo(lines)
              (p/(name+'.png')).write_bytes(payload)
          output=BytesIO()
          Image.new('RGB',(320,320),(240,241,242)).save(output,format='PNG')
          (p/'selfie.png').write_bytes(output.getvalue())
          print('PASS: generated only fake DEMO text cards and a blank selfie on runner')
          PY
          )
          (
            cd .qa-work/identity-ai
            IDENTITY_AI_INTERNAL_KEY=local-qa-only-nonsecret \
            python -m uvicorn main:app --host 127.0.0.1 --port 18766 --no-access-log \
              > ../original-python-qa.log 2>&1
          ) &
          PY_PID=$!
          trap 'kill "$PY_PID" 2>/dev/null || true; pkill -f "^python -m uvicorn main:app --host 127.0.0.1 --port 18766" || true' EXIT
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          for i in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18766/health',timeout=3) as r:
                      body=json.loads(r.read())
                  if r.status==200 and body.get('verificationEngineReady') and body.get('documentOcrReady'):
                      print('PASS: real original Python FaceMesh+Tesseract ready on localhost')
                      break
              except Exception:pass
              time.sleep(.5)
          else:raise SystemExit('FAIL: original AI localhost engine not ready')
          try:
              urllib.request.urlopen('http://127.0.0.1:18766/api/internal/auth-check',timeout=3)
              raise SystemExit('FAIL: private Python AI allowed anonymous call')
          except urllib.error.HTTPError as e:
              assert e.code==401,e.code
          print('PASS: private Python API refused anonymous test')
          PY
          export QA_REAL_ORIGINAL_AI=true
          export QA_REAL_ORIGINAL_AI_URL=http://127.0.0.1:18766
          export QA_REAL_ORIGINAL_AI_ASSETS_DIR="$GITHUB_WORKSPACE/.qa-work/fake-images"
          .qa-work/node_modules/.bin/firebase \
            emulators:exec \
            --project demo-volunserve-original-ai-admin-qa \
            --only auth,firestore \
            --config .qa-work/emulators.json \
            "node .qa-work/test-admin.js"
      - name: Confirm test was isolated
        run: |
          echo "PASS NO DEPLOY: 100% local Python OCR/MediaPipe + Firebase demo emulators + memory Cloudinary mock"
# No checkout of malformed legacy gitlink; no production deploy or secrets.
# Firebase emulator executes in temporary CI runner and is destroyed on exit.

# New dedicated integration job reuses pinned Node/Admin suite only; its
# Python subprocess and synthetic photos stay entirely on the ephemeral runner.
# Success does NOT imply genuine face-match accuracy or hosted staging readiness.
