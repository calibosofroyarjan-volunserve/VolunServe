name: Build Isolated VolunServe Web Review (NO DEPLOY)
on:
  push:
    branches: [preview/isolated-staging-readiness-20261107]
  pull_request:
    branches: [fix/live-module-controls-consistency-20261107]
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      # Dummy non-existent project: compiled preview cannot write to live Firebase.
      # Full interactive staging requires a separately provisioned real project.
      EXPO_PUBLIC_VOLUNSERVE_STAGING_MODE: "1"
      EXPO_PUBLIC_STAGING_FIREBASE_API_KEY: "AIzaDevelopmentPlaceholderNotARealFirebaseProjectKey"
      EXPO_PUBLIC_STAGING_FIREBASE_AUTH_DOMAIN: "volunserve-staging-review.firebaseapp.com"
      EXPO_PUBLIC_STAGING_FIREBASE_PROJECT_ID: "volunserve-staging-review"
      EXPO_PUBLIC_STAGING_FIREBASE_STORAGE_BUCKET: "volunserve-staging-review.firebasestorage.app"
      EXPO_PUBLIC_STAGING_FIREBASE_SENDER_ID: "999999999999"
      EXPO_PUBLIC_STAGING_FIREBASE_APP_ID: "1:999999999999:web:0000000000000000000000"
    steps:
      - name: Fetch head without checkout submodule or Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          git -C source init
          git -C source remote add origin https://github.com/calibosofroyarjan-volunserve/VolunServe.git
          git -C source fetch --no-recurse-submodules --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked build dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Verify staging Firebase and backend isolation
        working-directory: source
        run: |
          node scripts/test-isolated-staging-config-20261107.cjs
          node scripts/test-staging-backend-isolation-20261107.cjs
          node scripts/audit-staging-external-endpoints-20261107.cjs
      - name: Package the staging endpoint audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volunserve-staging-external-endpoint-audit
          path: source/reports/staging-external-endpoints.*
          if-no-files-found: warn
      - name: Verify live-based controls and preserve roles
        working-directory: source
        run: |
          node scripts/test-live-controls-consistency-20261107.cjs
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
          node scripts/test-guest-readonly-preview.cjs
      - name: Compile all web and mobile application code
        working-directory: source
        run: npx tsc --noEmit --pretty false
      - name: Export actual Expo web code against dummy isolated Firebase
        working-directory: source
        run: npx expo export --platform web
      - name: Package a downloadable web build (not hosted and NOT working login)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: volunserve-isolated-web-review-not-live
          path: source/dist/
          retention-days: 7
          if-no-files-found: error
