name: Original AI Staging Hosted Health Observation (READ ONLY, NO DEPLOY)
on:
  push:
    branches:
      - qa/original-ai-hosted-health-observation-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-health-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm audit workflow changed no application file
        uses: actions/github-script@v7
        with:
          script: |
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const compare=await github.rest.repos.compareCommits({
              owner,repo,base:'353879c0ce8c566e71c1a3263ccce77e82459013',
              head:context.sha
            });
            assert.equal(compare.data.behind_by,0);
            assert.deepEqual(
              (compare.data.files||[]).map(f=>f.filename),
              ['.github/workflows/qa-original-ai-hosted-health-observation-20261125.yml'],
              'NO application code, Firebase rules or deployments may be changed'
            );
            core.info('PASS: audit workflow only; production and staging app revisions unchanged');
      - name: Probe allowlisted STAGING health and anonymous auth boundaries via GET only
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import urllib.error
          import urllib.request
          import time

          # Exact, immutable staging-only URLs. No production host, authenticated
          # token, ID scan, photo, resident data, write method, or environment
          # secret is used. Redirects are explicitly prohibited.
          CHECKS={
            'backend_public_health': 'https://volunserve-backend-staging.onrender.com/health',
            'python_public_health': 'https://volunserve-identity-ai-staging.onrender.com/health',
            'python_missing_key_auth_check': 'https://volunserve-identity-ai-staging.onrender.com/api/internal/auth-check',
            'backend_anonymous_engine_health': 'https://volunserve-backend-staging.onrender.com/api/identity/engine-health',
          }
          class BlockRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise urllib.error.HTTPError(req.full_url,code,'Redirect blocked',headers,fp)
          opener=urllib.request.build_opener(BlockRedirects)
          def check(entry):
              name,url=entry
              req=urllib.request.Request(url,method='GET',
                  headers={'Accept':'application/json','User-Agent':'VolunServe-Original-AI-QA-ReadOnly-Health'})
              try:
                  with opener.open(req,timeout=65) as res:
                      status=res.status
                      raw=res.read(4096)
              except urllib.error.HTTPError as e:
                  status=e.code
                  raw=e.read(4096)
              except Exception as e:
                  return name,{'status':'UNREACHABLE','error':type(e).__name__}
              try:
                  payload=json.loads(raw)
              except Exception:
                  payload={}
              # Never print response bodies, signed URLs, secrets or unknown
              # response fields. Only select bounded scalar health indicators.
              safe={}
              if name=='backend_public_health':
                  safe={k:payload.get(k) for k in
                    ('ok','service','identityEngine','assistanceEvidenceStorage')
                    if isinstance(payload.get(k),(str,bool))}
              if name=='python_public_health':
                  safe={k:payload.get(k) for k in
                    ('ok','service','internalAuthConfigured','verificationEngineReady',
                     'documentOcrReady','documentPrecheckReady','profileComparisonReady',
                     'livenessImplemented','idDocumentAuthenticityVerified')
                    if isinstance(payload.get(k),(str,bool))}
              return name,{'status':status,'safe':safe}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              observations=dict(pool.map(check,CHECKS.items()))
          def is_http(n):return isinstance(observations[n]['status'],int)
          for k,v in observations.items():
              print('OBSERVATION',k,':',json.dumps(v,sort_keys=True))
          issues=[]
          node=observations['backend_public_health']
          ai=observations['python_public_health']
          auth=observations['python_missing_key_auth_check']
          protected=observations['backend_anonymous_engine_health']
          if node['status']!=200 or node.get('safe',{}).get('ok') is not True:
              issues.append('Staging Node public health unavailable or not healthy')
          if ai['status']!=200 or ai.get('safe',{}).get('ok') is not True:
              issues.append('Staging Python public health unavailable or not healthy')
          if node.get('safe',{}).get('identityEngine')!='volunserve_ai_configured':
              issues.append('Staging Node has no configured Python AI endpoint')
          if ai.get('safe',{}).get('internalAuthConfigured') is not True:
              issues.append('Staging Python private internal API key not configured')
          if ai.get('safe',{}).get('verificationEngineReady') is not True:
              issues.append('Staging Python FaceMesh engine not ready')
          if auth['status'] not in (401,403):
              issues.append('Missing-key Python auth-check did not deny access with 401/403')
          if protected['status'] not in (401,403):
              issues.append('Anonymous Node engine-health did not deny access with 401/403')
          if auth['status']==200 or protected['status']==200:
              raise SystemExit('SECURITY FAIL: anonymous private endpoint returned HTTP 200')
          for item in issues:print('BLOCKER:',item)
          if issues:print('AUDIT OUTCOME: BLOCKED (hosted staging not ready for private ID media)')
          else:print('AUDIT OUTCOME: basic GET-only staging reachability/auth-denial checks passed; provider credential isolation STILL UNVERIFIED')
          print('NO DEPLOY. NO POST. NO FILE UPLOAD. NO FIREBASE OR CLOUDINARY ACCESS.')
          PY
# This is only an observation, not an approval to submit real resident media.
# Any HTTP 200 on anonymous private routes is a security failure.
