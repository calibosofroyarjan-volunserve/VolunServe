name: QA Mobile Home Stacking Overlap Fix (NO DEPLOY)
on:
  push:
    branches: [fix/mobile-home-column-sizing-overlap-20261122]
    paths:
      - 'components/home/Home.web.tsx'
      - 'components/home/CommunityOnline.tsx'
      - '.github/workflows/qa-mobile-home-stacking-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-home-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Require exact current-live derived 2-component patch
        run: |
          set -euo pipefail
          BASE=0278ccd37a0406b5080bedbcb10eeb00755300ca
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from subprocess import check_output
          expected={
            "components/home/Home.web.tsx",
            "components/home/CommunityOnline.tsx",
            ".github/workflows/qa-mobile-home-stacking-20261122.yml",
          }
          changed=set(check_output(["git","diff","--name-only","0278ccd37a0406b5080bedbcb10eeb00755300ca","HEAD"],text=True).splitlines())
          assert changed==expected,(changed,expected)
          print("PASS only Home layout, member preview, and isolated no-deploy QA")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Catch original collapsed flex basis bug and avatar-only mobile cards
        run: |
          node - <<'NODE'
          const a=require("node:assert/strict"),fs=require("node:fs");
          const h=fs.readFileSync("components/home/Home.web.tsx","utf8");
          const m=fs.readFileSync("components/home/CommunityOnline.tsx","utf8");
          const c=fs.readFileSync("components/home/CommunityCalendar.tsx","utf8");
          a(h.includes('communityColumnsStacked ? styles.communityColumnStacked : styles.communityMembersColumn'));
          a(h.includes('communityColumnsStacked ? styles.communityColumnStacked : styles.communityCalendarColumn'));
          a(!h.includes('styles.communityMembersColumn,communityColumnsStacked&&styles.communityColumnStacked'));
          a(!h.includes('styles.communityCalendarColumn,communityColumnsStacked&&styles.communityColumnStacked'));
          a(/communityColumnStacked:\{[^}]*flexBasis:"auto"/.test(h),"stacked columns need content-based height");
          a(/communityExtrasStacked:\{[^}]*flexDirection:"column"/.test(h));
          a(m.includes('dashboardGridMobile:{flexDirection:"column",flexWrap:"nowrap"'),"mobile members must be single-column rows");
          a(m.includes('dashboardMemberMobile:{width:"100%",maxWidth:"100%",flexBasis:"auto"'));
          a(m.includes('dashboardIdentityMobile:{flexDirection:"row"'));
          a(m.includes('member.isSelf?<Text style={styles.youLabel}> (You)</Text>'),"keep (You)");
          a(m.includes('nestedScrollEnabled showsVerticalScrollIndicator'),"keep scroll");
          a(m.includes('const displayed=filtered;'),"no pagination; real roster");
          a(m.includes('member.online?"Online now":member.presencePrivate?"Status private":"Offline"'));
          a(m.includes('member.isSelf?router.push("/profile")'),"preserve profile routes");
          a(c.includes('eventDates.has(date)'),"retain real community calendar event markers");
          a(c.includes('dashboardMobileDayCell'),"retain mobile calendar compactness");
          a(h.includes('<ContactCard kind="local" />')&&h.includes('<ContactCard kind="national" />'));
          console.log("PASS mobile stacked panels have natural heights; readable rows; member/profile/calendar/contacts preserved");
          NODE
      - name: Verify unchanged published Hosting source, no writes
        run: VOLUNSERVE_EXPECTED_SHA=0278ccd37a0406b5080bedbcb10eeb00755300ca node scripts/check-live-hosting.cjs
      - name: TypeScript, login, profile, role and map regression tests
        run: |
          set -euo pipefail
          npx tsc --noEmit --incremental false
          node scripts/test-login-ui-release.cjs
          node scripts/test-profile-certificates-account-menu.cjs
          node scripts/test-guest-readonly-preview.cjs
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
      - name: Build actual production web bundle (without publishing)
        run: npx expo export --platform web --clear
      - run: echo "NO DEPLOY / NO Firebase data or Auth / NO Backend or AI modification"
