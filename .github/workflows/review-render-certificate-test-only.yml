name: Review Render Community Certificate 1-Minute Test Override (NO DEPLOY)
on:
  pull_request:
    branches: [backend-live-protected]
    paths:
      - "backend/communityCertificates.js"
      - "backend/communityCertificateEligibility.js"
      - "backend/test-communityCertificateEligibility.js"
      - "backend/test-communityCertificateIssuance.js"
      - "backend/package.json"
      - ".github/workflows/review-render-certificate-test-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-backend-checks:
    name: Render certificate policy + existing backend regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate backend code and existing production regressions
        run: npm run check
