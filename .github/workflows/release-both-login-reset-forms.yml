name: Restore Forgot Password Forms for Community and Admin Logins
on:
  push:
    branches:
      - release/both-login-forgot-password-forms-20261029
    paths:
      - .github/workflows/release-both-login-reset-forms.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Resident and Admin popups, login guards and premium Super Admin
        run: |
          node scripts/test-password-reset-popup.cjs
          node --test scripts/test-login-ui-release.cjs
          node scripts/test-superadmin-premium-restoration.cjs
          node scripts/test-dashboard-overviews.cjs
          npx tsc --noEmit --pretty false
      - name: Export Expo web for production
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require Firebase credentials
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Firebase service account. No Hosting deploy attempted."
            exit 1
          fi
      - name: Deploy Firebase Hosting ONLY
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact release on custom domain
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Waiting for live reset popup release verification attempt $attempt"
            sleep 10
          done
          echo "::error::volunserve.com not serving expected popup release revision"
          exit 1
