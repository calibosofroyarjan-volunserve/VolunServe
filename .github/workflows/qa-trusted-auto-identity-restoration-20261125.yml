name: Restore Trusted Automatic Identity - Synthetic Only (NO DEPLOY)
on:
  push:
    branches: [qa/restore-trusted-automatic-identity-20261125]
    paths:
      - backend/server.js
      - backend/identityTrustedAutomaticCompletion.js
      - backend/test-identityTrustedAutomaticCompletion.js
      - backend/identityTrustedSignedProof.js
      - backend/TRUSTED-AUTO-VERIFICATION-INTEGRATION.md
      - backend/test-identityTrustedSignedProof.js
      - backend/test-identityAutomaticTransactionIntegration.js
      - backend/test-identityRealFirestoreEmulator.js
      - backend/test-identityRealFirebaseAuthEmulator.js
      - backend/qa-identity-firestore-emulator.json
      - backend/qa-identity-firestore-emulator.rules
      - .github/workflows/qa-trusted-auto-firestore-emulator-20261125.yml
      - backend/test-identityAutoApprovalGateway.js
      - backend/test-identity-final-admin-only.js
      - .github/workflows/qa-trusted-auto-identity-restoration-20261125.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-synthetic-automatic-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Scope guard - do not touch live, Python, Firestore rules or certificates
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const cp=require('node:child_process');
          const baseline='c4d133c6aa7ab1a8a60810ade8e460302a61818f';
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          cp.execFileSync('git',['merge-base','--is-ancestor',baseline,'HEAD']);
          cp.execFileSync('git',['diff','--check',baseline,'HEAD']);
          const actual=git('diff','--name-only',baseline,'HEAD').split('\n').sort();
          const allowed=[
            '.github/workflows/qa-trusted-auto-identity-restoration-20261125.yml',
            'backend/identityTrustedAutomaticCompletion.js',
            'backend/server.js',
            'backend/test-identityTrustedAutomaticCompletion.js',
            'backend/identityTrustedSignedProof.js',
            'backend/TRUSTED-AUTO-VERIFICATION-INTEGRATION.md',
            'backend/test-identityTrustedSignedProof.js',
            'backend/test-identityAutomaticTransactionIntegration.js',
            'backend/test-identityRealFirestoreEmulator.js',
            'backend/test-identityRealFirebaseAuthEmulator.js',
            'backend/qa-identity-firestore-emulator.json',
            'backend/qa-identity-firestore-emulator.rules',
            '.github/workflows/qa-trusted-auto-firestore-emulator-20261125.yml',
            'backend/test-identityAutoApprovalGateway.js',
            'backend/test-identity-final-admin-only.js',
          ].sort();
          assert.deepEqual(actual,allowed,'No unrelated/production changes allowed');
          console.log('PASS: exact deployed backend baseline, limited QA-only scope');
          JS
      - name: Node syntax and trusted auto-gate synthetic tests
        run: |
          set -eu
          node --check backend/server.js
          node --check backend/identityTrustedAutomaticCompletion.js
          node --check backend/test-identityTrustedAutomaticCompletion.js
          node --test backend/test-identityTrustedAutomaticCompletion.js
          node --check backend/identityTrustedSignedProof.js
          node --test backend/test-identityTrustedSignedProof.js
          node --check backend/test-identityAutomaticTransactionIntegration.js
          node --test backend/test-identityAutomaticTransactionIntegration.js
          node --test backend/test-automaticIdentityApprovalPolicy.js
          node --test backend/test-identityAutoApprovalGateway.js
          node --test backend/test-identityIssuerReviewPolicy.js
          node --test backend/test-identityPrivateEvidence.js
          node --test backend/test-identity-final-admin-only.js
          node --test backend/test-identity-review-reject.js
      - name: Existing signup, event attendance and certificates regression
        run: |
          set -eu
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          (cd backend && node test-communityCertificateAutoSync.js)
          node --test backend/test-communityAttendanceAutoVerify.js
          node --test backend/test-communityCertificateEligibility.js
          node --test backend/test-communityCertificateIssuance.js
          node --test backend/tests/verifiedFirebaseToken.test.js
      - name: Confirm default-off production and no provider adapter
        run: |
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const server=fs.readFileSync('backend/server.js','utf8');
          const gateway=fs.readFileSync('backend/identityAutoApprovalGateway.js','utf8');
          assert(server.includes('process.env.VOLUNSERVE_TRUSTED_AUTO_VERIFY_ENABLED === "true"'));
          assert(server.includes('result: "not_validated"'));
          assert(server.includes('calibrationValidated: false'));
          assert(server.includes('freshCapture: false'));
          assert(!server.includes('issuerValidator: aiResult'));
          assert(!server.includes('padValidator: aiResult'));
          assert(gateway.includes('if (typeof issuerValidator !== "function" || typeof padValidator !== "function")'));
          console.log('PASS: original MediaPipe face-only cannot silently promote Residents');
          console.log('RELEASE BLOCKED until independently validated issuer and PAD integrations exist and staged authenticated E2E passes');
          JS
# This only validates synthetic code on a private QA branch.
# No Render/Firebase/Cloudinary deployments or real Resident writes.
