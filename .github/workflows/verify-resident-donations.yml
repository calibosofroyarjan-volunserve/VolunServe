name: Validate updated Resident Donations UI
on:
  push:
    branches:
      - fix/final-resident-donations-desktop
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Expo web export
        run: npx expo export --platform web --clear --max-workers 1
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Check HTML
        run: test -f dist/index.html
