name: Volunteer Donation Sidebar Scope Check (No Deploy)
on:
  push:
    branches:
      - fix/hide-volunteer-donations-menu-20261029
  pull_request:
    paths:
      - "app/(tabs)/_layout.tsx"
      - "scripts/test-volunteer-donations-sidebar-removal.cjs"
      - "scripts/test-resident-volunteer-sidebar.cjs"
      - "scripts/test-profile-certificates-account-menu.cjs"
      - ".github/workflows/volunteer-donation-sidebar-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Confirm Volunteer-only removal and Resident donation remains
        run: |
          node --test scripts/test-volunteer-donations-sidebar-removal.cjs
          node --test scripts/test-resident-volunteer-sidebar.cjs
          node --test scripts/test-profile-certificates-account-menu.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Export web without deployment
        run: npx expo export --platform web
