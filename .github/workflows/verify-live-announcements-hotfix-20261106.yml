name: Verify Actual Live Announcements Hotfix (No Deploy)
on:
  push:
    branches:
      - hotfix/live-announcement-feed-inbox-20261106
    paths:
      - 'components/home/Home.web.tsx'
      - 'components/notifications/NotificationDropdown.tsx'
      - 'app/(tabs)/notifications.tsx'
      - 'lib/useAnnouncementAlerts.ts'
      - 'app/(tabs)/announcements.tsx'
      - 'functions/announcementAudience.js'
      - 'functions/announcementNotifications.js'
      - 'functions/index.js'
      - 'scripts/test-live-announcement-flow.cjs'
      - 'scripts/test-live-announcements-firestore.cjs'
      - '.github/workflows/verify-live-announcements-hotfix-20261106.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Guard exact deployed baseline and protected modules
        shell: bash
        run: |
          node <<'NODE'
          const cp=require('node:child_process');
          const assert=require('node:assert/strict');
          const baseline='b7f1c0a0e8f12468ab7fbe6ae99407a6ed4aae5b';
          const changed=cp.execFileSync('git',['diff','--name-only',baseline,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set([
            'components/home/Home.web.tsx',
            'components/notifications/NotificationDropdown.tsx',
            'app/(tabs)/notifications.tsx',
            'lib/useAnnouncementAlerts.ts',
            'app/(tabs)/announcements.tsx',
            'functions/announcementAudience.js',
            'functions/announcementNotifications.js',
            'functions/index.js',
            'scripts/test-live-announcement-flow.cjs',
            'scripts/test-live-announcements-firestore.cjs',
            '.github/workflows/verify-live-announcements-hotfix-20261106.yml',
          ]);
          for (const file of changed) assert.ok(allowed.has(file),'Protected live file unexpectedly changed: '+file);
          assert.ok(changed.length>0,'Expected scoped hotfix files');
          console.log('PASS exact live source baseline; only allowed announcement files changed');
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Verify trigger and audience unit tests
        run: |
          node --check functions/announcementNotifications.js
          node --check functions/announcementAudience.js
          node --check functions/index.js
          node scripts/test-live-announcement-flow.cjs
      - name: Lint only new Firebase modules
        run: |
          npm ci --prefix functions --no-audit --no-fund
          cd functions
          ESLINT_USE_FLAT_CONFIG=false npx eslint --config .eslintrc.js --parser-options '{"ecmaVersion":2022}' announcementNotifications.js announcementAudience.js
      - name: Firestore permissions for published announcements (emulator only)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-live-announcements-firestore.cjs"
      - name: Verify complete live TypeScript project
        run: npx tsc --noEmit --pretty false
      - name: Export complete live-based website (NO DEPLOY)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npx expo export --platform web --clear --max-workers 1
          node scripts/verify-hosting-release.cjs
