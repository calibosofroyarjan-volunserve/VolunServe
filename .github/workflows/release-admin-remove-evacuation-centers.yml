name: Publish LGU Admin Without Evacuation Centers (Hosting Only)
on:
  push:
    branches:
      - release/admin-remove-evacuation-centers-20261029
    paths:
      - .github/workflows/release-admin-remove-evacuation-centers.yml
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm approved main commit and workflow-only release delta
        shell: bash
        run: |
          git merge-base --is-ancestor d3099ade136bd605b78c920f5351ce5b2ef00434 HEAD
          test "$(git diff --name-only d3099ade136bd605b78c920f5351ce5b2ef00434 HEAD)" = ".github/workflows/release-admin-remove-evacuation-centers.yml"
      - run: npm ci --no-audit --no-fund
      - name: Verify removal and critical Admin workflows
        run: |
          node scripts/test-remove-admin-evacuation-centers.cjs
          node scripts/test-admin-overview-ui.cjs
          node scripts/test-dashboard-overviews.cjs
          node scripts/test-lgu-dashboard-inline-approvals-and-paging.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-pavia-admin-pagination-announcements.cjs
          node scripts/test-final-admin-scope.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          npx tsc --noEmit --pretty false
      - name: Compile static web and stamp expected release revision
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require configured Firebase Hosting deploy credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Firebase Hosting credentials; production unchanged."
            exit 1
          fi
      - name: Publish Firebase Hosting ONLY (not Firestore rules or Functions)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Check exact revision on custom domain
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Expected revision not confirmed at volunserve.com."
          exit 1
