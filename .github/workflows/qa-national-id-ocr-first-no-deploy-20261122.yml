name: QA National ID OCR-first (ISOLATED NO DEPLOY)

on:
  push:
    branches:
      - review/identity-national-id-ocr-on-hosting-3f9-20261122
    paths:
      - 'identity-ai/main.py'
      - 'identity-ai/document_screening.py'
      - 'identity-ai/test_national_id_ocr_first.py'
      - 'identity-ai/test_document_screening.py'
      - 'identity-ai/requirements.txt'
      - '.github/workflows/qa-national-id-ocr-first-no-deploy-20261122.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: national-id-ocr-first-branch-qa
  cancel-in-progress: true

jobs:
  synthetic-ocr-regressions:
    name: Python 3.11 offline unit tests (NO DEPLOY)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'identity-ai/requirements.txt'
      - name: Install AI runtime dependencies
        run: python -m pip install -r identity-ai/requirements.txt
      - name: Compile Python files
        run: python -m compileall -q identity-ai/main.py identity-ai/document_screening.py identity-ai/test_national_id_ocr_first.py identity-ai/test_document_screening.py
      - name: Check OCR screening and route tests on fabricated data only
        working-directory: identity-ai
        run: python -m unittest -v test_document_screening.py test_national_id_ocr_first.py
      - name: Confirm no production deployments
        run: echo "NO DEPLOY. No Firebase or Render commands. Tests do not send identity media or write data."
