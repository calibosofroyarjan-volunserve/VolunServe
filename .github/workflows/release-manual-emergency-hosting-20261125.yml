name: Guarded LIVE Manual Emergency Response (HOSTING ONLY)
on:
  push:
    branches: [release/manual-emergency-hosting-20261125]
    paths: [.github/workflows/release-manual-emergency-hosting-20261125.yml]
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  guarded-hosting:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_VOLUNSERVE_ORIGINAL_FACE_ONLY: 'true'
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
      VOLUNSERVE_HOSTING_URL: https://volunserve.com
      PINNED_HOSTING_SHA: 4014b18329f3eb2cd366fcb21b1f93e0ab4b842e
      QA_COMMIT_SHA: fbedfc3906886b2f5da2d1036f8696a1c63e0b5b
      SITE: volunserve-3aa5b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove manual Emergency source equals QA commit and latest LIVE AI is unchanged
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          "use strict";
          const cp=require("node:child_process"),fs=require("node:fs"),a=require("node:assert/strict");
          const base=process.env.PINNED_HOSTING_SHA,qa=process.env.QA_COMMIT_SHA;
          const git=(...p)=>cp.execFileSync("git",p,{encoding:"utf8"}).trim();
          a.equal(git("rev-parse","HEAD"),process.env.GITHUB_SHA);
          a.equal(git("rev-list","--parents","-n","1","HEAD").split(" ")[1],qa,
            "BLOCKED release is not direct child of QA-green commit");
          cp.execFileSync("git",["merge-base","--is-ancestor",base,qa]);
          cp.execFileSync("git",["diff","--check",base,"HEAD"]);
          const approved=[
            ".github/workflows/qa-emergency-live-4014b-20261125.yml",
            ".github/workflows/release-manual-emergency-hosting-20261125.yml",
            "app/(admin)/admin-cases.tsx",
            "app/(tabs)/disaster-response.tsx",
            "app/(tabs)/my-cases.tsx",
            "app/(tabs)/volunteer.tsx",
            "app/(tabs)/volunteer.web.tsx",
            "components/admin/EmergencyFiveTabDesign.tsx",
            "components/admin/VolunteerEligibilityValidation.tsx",
            "components/tabs/MapTracking.native.tsx",
            "components/tabs/ResponseFlow.web.tsx",
            "lib/emergencyArrival.ts",
            "scripts/manual-emergency-hosting-rollback-20261125.cjs",
            "scripts/test-emergency-live-reconciled-20261125.cjs",
            "scripts/test-emergency-manual-flow-emulator-20261125.cjs"
          ].sort();
          const diff=git("diff","--name-only","--no-renames",base,"HEAD")
            .split("\n").filter(Boolean).sort();
          a.deepEqual(diff,approved,"BLOCKED: unrelated or stale production files");
          const qaPaths=approved.filter(p=>
            p!==".github/workflows/release-manual-emergency-hosting-20261125.yml" &&
            p!=="scripts/manual-emergency-hosting-rollback-20261125.cjs");
          for(const p of qaPaths)
            a.equal(git("rev-parse","HEAD:"+p),git("rev-parse",qa+":"+p),
              "BLOCKED: file differs from independently QA-green candidate "+p);
          for(const p of [
            "app/(admin)/identity-reviews.tsx",
            "app/identity-verification.tsx",
            "app/identity-verification.web.tsx",
            "lib/identityVerification.ts",
            "lib/firebase.ts","firebase.json","app.json","firestore.rules",
            "storage.rules","functions/index.js","backend/server.js",
            "package.json","package-lock.json"
          ])a.equal(git("rev-parse","HEAD:"+p),git("rev-parse",base+":"+p),
            "BLOCKED: current live AI, auth, backend or security source changed "+p);
          const admin=fs.readFileSync("app/(admin)/admin-cases.tsx","utf8");
          a(admin.includes('automaticStatus="off"')&&admin.includes("manualOnly")&&
            admin.includes("assignVolunteerToCase"),"BLOCKED manual Admin offer missing");
          for(const p of ["components/DisasterResponse.web.tsx",
            "components/DisasterResponse.native.tsx",
            "app/(tabs)/volunteer.web.tsx","app/(tabs)/volunteer.tsx"]){
            const s=fs.readFileSync(p,"utf8");
            a(!/requestRenderEmergencyAuto|respondRenderEmergencyAuto|emergency-auto\/report-submitted|emergency-auto\/respond/.test(s),
              "BLOCKED automatic fanout entrypoint "+p);
          }
          a(!fs.readFileSync("functions/index.js","utf8")
            .includes("autoInviteApprovedEmergencyVolunteers"),
            "BLOCKED cloud-triggered automatic invitations present in Hosting source");
          console.log("PASS: exact 13 QA files, newest identity/face match untouched, NO automatic frontend dispatch");
          JS
      - name: Confirm actual LIVE public marker is exact published base
        run: VOLUNSERVE_EXPECTED_SHA="$PINNED_HOSTING_SHA" node scripts/check-live-hosting.cjs
      - name: Check existing original AI endpoints and secure evidence backend (read-only)
        run: |
          node <<'JS'
          const checks=[
            ['Python health','https://volunserve-identity-ai.onrender.com/health','GET',200],
            ['Node health','https://volunserve.onrender.com/health','GET',200],
            ['Private Python face match','https://volunserve-identity-ai.onrender.com/verify-face-only','POST',401],
            ['Firebase-authenticated face match','https://volunserve.onrender.com/api/identity/verify-face-only','POST',401]
          ];
          (async()=>{
            for(const [name,url,method,status] of checks){
              let r;
              for(let i=0;i<3;i++){
                try{r=await fetch(url,{method,redirect:'error',signal:AbortSignal.timeout(45000)});break;}
                catch(e){if(i===2)throw e;await new Promise(done=>setTimeout(done,5000));}
              }
              if(r.status!==status)throw Error('BLOCKED '+name+' HTTP '+r.status+' not '+status);
              if(name==='Node health'){
                const b=await r.json();
                if(b.ok!==true||b.assistanceEvidenceStorage!=='secure_cloudinary_configured')
                  throw Error('BLOCKED: original secure Cloudinary not ready');
              }
              if(name==='Python health'){
                const b=await r.json();
                if(b.ok!==true||b.verificationEngineReady!==true||b.internalAuthConfigured!==true)
                  throw Error('BLOCKED: original face matcher is not ready');
              }
              console.log('PASS',name,status);
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - name: Exact production TypeScript regression and web export
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/test-emergency-live-reconciled-20261125.cjs
          npx tsc --noEmit --pretty false
          npx expo export --platform web --clear
          node scripts/verify-hosting-release.cjs
          node <<'JS'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('dist/volunserve-release.json','utf8'));
          a.equal(m.firebaseProject,'volunserve-3aa5b');
          a.equal(m.revision,process.env.GITHUB_SHA);
          console.log('PASS exact new Hosting SHA',m.revision);
          JS
      - name: Verify existing production Hosting credential without disclosure
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SA" || { echo "::error::Missing scoped production Hosting credential"; exit 1; }
          node <<'JS'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const c=JSON.parse(process.env.FIREBASE_SA);
          a.equal(c.type,'service_account');a.equal(c.project_id,'volunserve-3aa5b');
          a(c.private_key&&c.client_email,'BLOCKED: invalid production Hosting key');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/manual-emergency-prod.json',
            process.env.FIREBASE_SA,{mode:0o600});
          console.log('PASS: correct scoped Firebase Hosting service account');
          JS
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/manual-emergency-prod.json" >> "$GITHUB_ENV"
      - name: Pin immutable old LIVE version, deploy Hosting only and rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          export VOLUNSERVE_EXPECTED_SHA="$PINNED_HOSTING_SHA"
          node scripts/check-live-hosting.cjs
          PIN="$RUNNER_TEMP/manual-emergency-old-hosting.json"
          SCRIPT=scripts/manual-emergency-hosting-rollback-20261125.cjs
          node "$SCRIPT" selftest
          node "$SCRIPT" capture "$PIN"
          node "$SCRIPT" check "$PIN"
          DEPLOY_STARTED=0
          rollback_on_failure() {
            STATUS=$?
            trap - EXIT
            if [ "$STATUS" -ne 0 ] && [ "$DEPLOY_STARTED" = 1 ]; then
              echo "::error::Hosting verification failed; restoring exact old Firebase Hosting version"
              if node "$SCRIPT" rollback "$PIN"; then
                export VOLUNSERVE_EXPECTED_SHA="$PINNED_HOSTING_SHA"
                node scripts/check-live-hosting.cjs || echo "::error::Rollback accepted but old public marker not confirmed"
              else
                echo "::error::Automatic rollback failed; manual Firebase Hosting restore required"
              fi
            fi
            exit "$STATUS"
          }
          trap rollback_on_failure EXIT
          node "$SCRIPT" check "$PIN"
          DEPLOY_STARTED=1
          npx firebase-tools deploy --only hosting --project "$SITE" --non-interactive
          export VOLUNSERVE_EXPECTED_SHA="$GITHUB_SHA"
          VERIFIED=0
          for i in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then VERIFIED=1;break;fi
            sleep 12
          done
          test "$VERIFIED" = 1 || { echo "::error::New live revision verification failed"; exit 1; }
          trap - EXIT
          echo 'LIVE_RELEASE_SUCCESS: Manual Admin Emergency assignment, Volunteer Accept/Decline, GPS response and Resident confirmation; newest Face Match preserved'
