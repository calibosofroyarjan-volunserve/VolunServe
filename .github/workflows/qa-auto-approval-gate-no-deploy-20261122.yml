name: QA automatic Verified security gate (NO DEPLOY)
on:
  push:
    branches: [feature/identity-auto-approval-secure-gate-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-approval-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch backend without legacy submodules
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${REPO}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none --no-recurse-submodules origin "$SHA"
          git sparse-checkout init --cone
          git sparse-checkout set backend
          git checkout --force FETCH_HEAD
      - name: Confirm exact live backend untouched, only new isolated gate
        run: |
          set -euo pipefail
          BASE=c96fb43ffa57e9054e72da9436407621ed2ea2c1
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none --no-recurse-submodules origin "$BASE"
          git diff --name-status "$BASE" HEAD >/tmp/changes
          python - <<'PY'
          from pathlib import Path
          actual=sorted(Path('/tmp/changes').read_text().strip().splitlines())
          expected=sorted([
            'A\tbackend/identityAutoApprovalPolicy.js',
            'A\tbackend/test-identityAutoApprovalPolicy.js',
            'A\t.github/workflows/qa-auto-approval-gate-no-deploy-20261122.yml',
          ])
          assert actual==expected,(actual,expected)
          print('PASS current production backend unchanged, isolated policy only')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auto verification gate and existing identity regressions
        run: |
          set -euo pipefail
          node --check backend/identityAutoApprovalPolicy.js
          node --test backend/test-identityAutoApprovalPolicy.js
          node --test backend/test-selectedIdPolicy.js
          node --test backend/test-identity-final-admin-only.js
          node --test backend/test-identityHybridPrecheckDecision.js
      - run: echo 'NO DEPLOY; no automatic Verified status writes, Auth/Firestore changes or ID data used.'
