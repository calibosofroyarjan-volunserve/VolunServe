# Fail closed when the protected GitHub source and deployed website have drifted.
# The former one-time 847afced reconciliation check is now a repeatable PR gate.
name: Verify Protected PR vs Current Hosting (NO DEPLOY)
on:
  pull_request:
    branches: [live-protected]
permissions:
  contents: read
jobs:
  current-live-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Validate live release marker and strictly scoped source changes
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const assert=require("node:assert/strict");
          const cp=require("node:child_process");
          const git=(...args)=>cp.execFileSync("git",args,{encoding:"utf8"}).trim();
          const liveBase=git("rev-parse","origin/live-protected");
          const commit=git("rev-parse","HEAD");
          const current=git("merge-base",liveBase,commit);
          assert.equal(current,liveBase,"BLOCKED: PR is not descended from protected HEAD");
          function blob(ref,path){return git("rev-parse",ref+":"+path);}
          (async()=>{
            const response=await fetch("https://volunserve.com/volunserve-release.json",{
              headers:{"Cache-Control":"no-cache"},
              signal:AbortSignal.timeout(15000)
            });
            assert.equal(response.status,200,"BLOCKED: Hosting release marker unavailable");
            const marker=await response.json();
            assert.equal(marker.app,"VolunServe");
            assert.equal(marker.firebaseProject,"volunserve-3aa5b");
            assert.equal(marker.revision,liveBase,
              "BLOCKED: protected base and production differ; reconcile FIRST");
            const text=git("diff","--name-status","--no-renames",liveBase,commit);
            const entries=text.split("\n").filter(Boolean).map(row=>row.split("\t"));
            assert(entries.length>0,"BLOCKED: empty PR");
            for(const [status,path] of entries){
              assert(["A","M"].includes(status),"BLOCKED: destructive source change "+path);
              const web=/^(app|components|assets|constants|hooks|lib|services|utils)\//.test(path);
              const test=/^scripts\/test-[\w-]+\.cjs$/.test(path);
              // Opt-in only; never allow Functions index, exports or deployment config.
              const stagedIdentity=path==="functions/registrationEmailScreening.js";
              // This workflow may only change under reviewed PR, not via auto deploy.
              const self=path===".github/workflows/verify-reconciled-hosting-source-no-deploy-20261111.yml";
              assert(web||test||stagedIdentity||self,
                "BLOCKED: backend, Firebase policy, Hosting config, workflow or unknown path "+path);
            }
            for(const path of [
              "package.json","package-lock.json","app.json","firebase.json",
              ".firebaserc","tsconfig.json","firestore.rules","storage.rules",
              "functions/index.js","functions/package.json",
              "scripts/guard-live-protected-release.cjs",
              ".github/workflows/auto-publish-protected-live-hosting.yml",
              ".github/workflows/release-live-protected-hosting.yml"
            ]) {
              assert.equal(blob(commit,path),blob(liveBase,path),
                "BLOCKED: protected release or security configuration drift: "+path);
            }
            assert.equal(blob(commit,"lib/firebase.ts"),blob(liveBase,"lib/firebase.ts"),
              "BLOCKED: production/staging Firebase Auth isolation changed");
            console.log("PASS production Hosting marker matches protected branch "+liveBase);
            console.log("PASS "+entries.length+" approved web/test/staged-screening-only paths");
            console.log("NO DEPLOY: Hosting, Firestore, Functions and Render remain unchanged");
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
