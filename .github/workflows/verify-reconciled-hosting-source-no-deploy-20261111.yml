# Fail closed when the protected GitHub source and deployed website have drifted.
# The former one-time 847afced reconciliation check is now a repeatable PR gate.
name: Verify Protected PR vs Current Hosting (NO DEPLOY)
on:
  pull_request:
    branches: [live-protected]
permissions:
  contents: read
jobs:
  current-live-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Validate live release marker and strictly scoped source changes
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const assert=require("node:assert/strict");
          const cp=require("node:child_process");
          const git=(...args)=>cp.execFileSync("git",args,{encoding:"utf8"}).trim();
          const liveBase=git("rev-parse","origin/live-protected");
          const commit=git("rev-parse","HEAD");
          const current=git("merge-base",liveBase,commit);
          assert.equal(current,liveBase,"BLOCKED: PR is not descended from protected HEAD");
          function blob(ref,path){return git("rev-parse",ref+":"+path);}
          (async()=>{
            const response=await fetch("https://volunserve.com/volunserve-release.json",{
              headers:{"Cache-Control":"no-cache"},
              signal:AbortSignal.timeout(15000)
            });
            assert.equal(response.status,200,"BLOCKED: Hosting release marker unavailable");
            const marker=await response.json();
            assert.equal(marker.app,"VolunServe");
            assert.equal(marker.firebaseProject,"volunserve-3aa5b");
            // A one-time, content-pinned Hosting-only release controller is not
            // itself the source deployed on Firebase Hosting. Keep the existing
            // strict marker==protected-head gate for every other kind of PR.
            const controllerPath=".github/workflows/one-time-assistance-campaign-layout-20261120.yml";
            const verifierPath=".github/workflows/verify-reconciled-hosting-source-no-deploy-20261111.yml";
            const changes=git("diff","--name-status","--no-renames",liveBase,commit)
              .split("\n").filter(Boolean);
            const thisRelease=changes.length===2
              && changes[0]==="A\t"+controllerPath
              && changes[1]==="M\t"+verifierPath;
            if(thisRelease){
              const deployedSource="4ccf5515a95ec7b71a4a518ace51bcd7e802b7f6";
              const candidateSource="8fbb8ba9eaa5ad127add03f1772509af2aa12c5b";
              assert.equal(liveBase,"60a6f46a9c6613ea1ea2d4c8e4ef6c18c62d52a7",
                "BLOCKED: protected branch controller moved");
              assert.equal(marker.revision,deployedSource,
                "BLOCKED: production Hosting source changed");
              assert.equal(blob(liveBase,verifierPath),"db389689266c35e1314101f51eca2754a9dfa66e",
                "BLOCKED: previously approved verifier changed");
              assert.equal(blob(commit,controllerPath),"9c2672076ff3f773bfc0423308f48808ce4a1aa8",
                "BLOCKED: guarded release controller content differs");
              assert.equal(git("rev-parse","origin/ui/assistance-campaign-layout-only-20261120"),
                candidateSource,"BLOCKED: UI candidate branch drift");
              const ancestry=git("rev-list","--parents","-n","1",candidateSource).split(" ");
              assert.deepEqual(ancestry,[candidateSource,deployedSource],
                "BLOCKED: candidate not derived from current live source");
              assert.equal(git("diff","--name-status","--no-renames",deployedSource,candidateSource),
                "M\tapp/(admin)/assistance-requests.tsx",
                "BLOCKED: candidate includes unrelated, deleted or outdated files");
              for(const protectedPath of [
                "package.json","package-lock.json","app.json","firebase.json",
                ".firebaserc","tsconfig.json","firestore.rules","storage.rules",
                "functions/index.js","functions/package.json",
                "scripts/guard-live-protected-release.cjs",
                ".github/workflows/auto-publish-protected-live-hosting.yml",
                ".github/workflows/release-live-protected-hosting.yml","lib/firebase.ts"
              ]) {
                assert.equal(blob(commit,protectedPath),blob(liveBase,protectedPath),
                  "BLOCKED: existing production/config code changed: "+protectedPath);
              }
              console.log("PASS: content-pinned, current-live-derived, UI-only release controller");
              console.log("NO DEPLOY: PR validation; production remains unchanged");
              return;
            }

            // Exact one-time Donation Management Hosting-only controller PR:
            // live-protected contains release controllers while deployed Hosting
            // retains the immutable application source SHA. No other PR is exempt.
            const donationControllerPath=".github/workflows/one-time-donation-management-ui-20261120.yml";
            const donationChanges=git("diff","--name-status","--no-renames",liveBase,commit)
              .split("\n").filter(Boolean);
            const donationRelease=donationChanges.length===2
              && donationChanges[0]==="A\t"+donationControllerPath
              && donationChanges[1]==="M\t"+verifierPath;
            if(donationRelease){
              const deployedSource="8fbb8ba9eaa5ad127add03f1772509af2aa12c5b";
              const candidateSource="df20f9b73abcc071cda5b72861d2f154b36ea398";
              assert.equal(liveBase,"340d0172a7b832e3db2c1e73248453e523e26eb7",
                "BLOCKED: protected release controller moved");
              assert.equal(marker.revision,deployedSource,
                "BLOCKED: live Hosting changed, do not deploy stale source");
              assert.equal(blob(liveBase,verifierPath),"f00c20c40a43fae45ba63732b73bc819fe07bc58",
                "BLOCKED: previously approved PR verifier changed");
              assert.equal(blob(commit,donationControllerPath),"7dd650d51d40c0d205b4554f2dca1f8be1f9d7cc",
                "BLOCKED: Donation release controller not the exact reviewed file");
              assert.equal(git("rev-parse","origin/ui/donation-management-clean-layout-20261120"),
                candidateSource,"BLOCKED: reviewed Donation UI branch moved");
              const ancestry=git("rev-list","--parents","-n","1",candidateSource).split(" ");
              assert.deepEqual(ancestry,[candidateSource,deployedSource],
                "BLOCKED: candidate not derived exclusively from live");
              assert.equal(git("diff","--name-status","--no-renames",deployedSource,candidateSource),
                "M\tapp/(admin)/donation-list.tsx",
                "BLOCKED: candidate includes other code or old modules");
              for(const protectedPath of [
                "package.json","package-lock.json","app.json","firebase.json",
                ".firebaserc","tsconfig.json","firestore.rules","storage.rules",
                "functions/index.js","functions/package.json",
                "scripts/guard-live-protected-release.cjs",
                ".github/workflows/auto-publish-protected-live-hosting.yml",
                ".github/workflows/release-live-protected-hosting.yml","lib/firebase.ts"
              ]) {
                assert.equal(blob(commit,protectedPath),blob(liveBase,protectedPath),
                  "BLOCKED: security, backend or protected config changed: "+protectedPath);
              }
              console.log("PASS exact pinned Donation-only UI release controller and live-derived source");
              console.log("NO DEPLOY: PR validation only");
              return;
            }

            // Exact one-time Donation Records layout release, not a blanket bypass:
            // compare the unchanged production source to an immutable one-file candidate.
            const archiveControllerPath=".github/workflows/one-time-donation-records-grid-archive-20261120.yml";
            const archiveChanges=git("diff","--name-status","--no-renames",liveBase,commit)
              .split("\n").filter(Boolean);
            const archiveRelease=archiveChanges.length===2
              && archiveChanges[0]==="A\t"+archiveControllerPath
              && archiveChanges[1]==="M\t"+verifierPath;
            if(archiveRelease) {
              const liveSource="df20f9b73abcc071cda5b72861d2f154b36ea398";
              const uiSource="5b3f189dab76e9407596a69cd61e0c69cc994594";
              assert.equal(liveBase,"e30ada82b3345e0f41a482ecef083457de44d3c1",
                "BLOCKED protected controller branch changed");
              assert.equal(marker.revision,liveSource,"BLOCKED deployed Hosting changed");
              assert.equal(blob(liveBase,verifierPath),"2831ef1b9e59f8df5ee860f7fcd39ff3f06a64fb",
                "BLOCKED verifier previous version changed");
              assert.equal(blob(commit,archiveControllerPath),"4cf9713f01a154e954b954eebec19bef9292bcf0",
                "BLOCKED release controller content not pinned");
              assert.equal(git("rev-parse","origin/ui/donation-records-grid-archive-20261120"),
                uiSource,"BLOCKED reviewed UI branch moved");
              const ancestry=git("rev-list","--parents","-n","1",uiSource).split(" ");
              assert(ancestry.length>=2 && ancestry[0]===uiSource,"BLOCKED candidate has invalid ancestry");
              const sourceChanges=git("diff","--name-status","--no-renames",liveSource,uiSource);
              assert.equal(sourceChanges,"M\tapp/(admin)/donation-list.tsx",
                "BLOCKED candidate includes unrelated changes, removed files or outdated modules");
              for(const protectedPath of [
                "package.json","package-lock.json","app.json","firebase.json",
                ".firebaserc","tsconfig.json","firestore.rules","storage.rules",
                "functions/index.js","functions/package.json",
                "scripts/guard-live-protected-release.cjs",
                ".github/workflows/auto-publish-protected-live-hosting.yml",
                ".github/workflows/release-live-protected-hosting.yml","lib/firebase.ts"
              ]) {
                assert.equal(blob(commit,protectedPath),blob(liveBase,protectedPath),
                  "BLOCKED backend/security/release configuration changed: "+protectedPath);
              }
              console.log("PASS: exact live-derived Donation Records UI candidate");
              console.log("NO DEPLOY: PR verification only, preserved old Firestore campaigns");
              return;
            }

            // Content-pinned one-time typography-only controller, never a general bypass.
            const typographyControllerPath=".github/workflows/one-time-donation-minimal-typography-20261120.yml";
            const typographyDiff=git("diff","--name-status","--no-renames",liveBase,commit)
              .split("\n").filter(Boolean);
            const isTypographyRelease=typographyDiff.length===2
              && typographyDiff[0]==="A\t"+typographyControllerPath
              && typographyDiff[1]==="M\t"+verifierPath;
            if(isTypographyRelease){
              const currentHostingSource="5b3f189dab76e9407596a69cd61e0c69cc994594";
              const typographySource="f39c3f3684dff1116c70e2f972db821374b8d57c";
              assert.equal(liveBase,"c35b7ff7ebe517689b6b04cf4703a92f5dd647ee",
                "BLOCKED: protected branch moved since this review");
              assert.equal(marker.revision,currentHostingSource,
                "BLOCKED: production Hosting marker changed");
              assert.equal(blob(liveBase,verifierPath),"9ebeaabdec9091a91d5804038f4fde62b095736b",
                "BLOCKED: previously approved PR verifier was changed");
              assert.equal(blob(commit,typographyControllerPath),"de0c83186e3cb9efda9e44bcdb6aca4746dc2d2e",
                "BLOCKED: reviewed release controller content changed");
              assert.equal(git("rev-parse","origin/ui/donation-management-typography-minimal-20261120"),
                typographySource,"BLOCKED: reviewed candidate branch drift");
              git("merge-base","--is-ancestor",currentHostingSource,typographySource);
              assert.equal(git("diff","--name-status","--no-renames",
                currentHostingSource,typographySource),
                "M\tapp/(admin)/donation-list.tsx",
                "BLOCKED: unrelated source files/deletion/old code detected");
              for(const protectedPath of [
                "package.json","package-lock.json","app.json","firebase.json",
                ".firebaserc","tsconfig.json","firestore.rules","storage.rules",
                "functions/index.js","functions/package.json",
                "scripts/guard-live-protected-release.cjs",
                ".github/workflows/auto-publish-protected-live-hosting.yml",
                ".github/workflows/release-live-protected-hosting.yml","lib/firebase.ts"
              ]){
                assert.equal(blob(commit,protectedPath),blob(liveBase,protectedPath),
                  "BLOCKED: security/production/backend configuration changed: "+protectedPath);
              }
              console.log("PASS: Donation typography-only UI release pinned to current live");
              console.log("NO DEPLOY: PR verification, current records remain unchanged");
              return;
            }

            assert.equal(marker.revision,liveBase,
              "BLOCKED: protected base and production differ; reconcile FIRST");
            const text=git("diff","--name-status","--no-renames",liveBase,commit);
            const entries=text.split("\n").filter(Boolean).map(row=>row.split("\t"));
            assert(entries.length>0,"BLOCKED: empty PR");
            for(const [status,path] of entries){
              assert(["A","M"].includes(status),"BLOCKED: destructive source change "+path);
              const web=/^(app|components|assets|constants|hooks|lib|services|utils)\//.test(path);
              const test=/^scripts\/test-[\w-]+\.cjs$/.test(path);
              // Opt-in only; never allow Functions index, exports or deployment config.
              const stagedIdentity=path==="functions/registrationEmailScreening.js";
              // This workflow may only change under reviewed PR, not via auto deploy.
              const self=path===".github/workflows/verify-reconciled-hosting-source-no-deploy-20261111.yml";
              assert(web||test||stagedIdentity||self,
                "BLOCKED: backend, Firebase policy, Hosting config, workflow or unknown path "+path);
            }
            for(const path of [
              "package.json","package-lock.json","app.json","firebase.json",
              ".firebaserc","tsconfig.json","firestore.rules","storage.rules",
              "functions/index.js","functions/package.json",
              "scripts/guard-live-protected-release.cjs",
              ".github/workflows/auto-publish-protected-live-hosting.yml",
              ".github/workflows/release-live-protected-hosting.yml"
            ]) {
              assert.equal(blob(commit,path),blob(liveBase,path),
                "BLOCKED: protected release or security configuration drift: "+path);
            }
            assert.equal(blob(commit,"lib/firebase.ts"),blob(liveBase,"lib/firebase.ts"),
              "BLOCKED: production/staging Firebase Auth isolation changed");
            console.log("PASS production Hosting marker matches protected branch "+liveBase);
            console.log("PASS "+entries.length+" approved web/test/staged-screening-only paths");
            console.log("NO DEPLOY: Hosting, Firestore, Functions and Render remain unchanged");
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
