name: Local camera-only National ID staging tests (NO DEPLOY)

on:
  pull_request:
    paths:
      - "identity-ai/live_camera_scan_policy.py"
      - "identity-ai/local_national_id_selfie_review.py"
      - "identity-ai/test_live_camera_scan_policy.py"
      - "identity-ai/test_local_national_id_selfie_review.py"
      - "identity-ai/LOCAL_NATIONAL_ID_REVIEW_README.md"
      - ".github/workflows/test-identity-local-camera-only-no-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-camera-contract:
    name: In-memory camera scanner & OCR orientation (no personal media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile standalone private local lab
        run: |
          python -m py_compile identity-ai/local_national_id_selfie_review.py identity-ai/live_camera_scan_policy.py
      - name: Validate camera-only OCR and selfie policies (synthetic data ONLY)
        env:
          PYTHONPATH: identity-ai
        run: |
          python -m unittest discover -s identity-ai -p 'test_live_camera_scan_policy.py' -v
          python -m unittest discover -s identity-ai -p 'test_local_national_id_selfie_review.py' -v
      - name: Explicit no-deployment gate
        run: echo "NO DEPLOY - NO REAL IMAGES - NO MODEL DOWNLOAD - NO FIREBASE ACCESS"
