name: Firestore invited Volunteer incident read authorization — REAL EMULATOR
on:
  push:
    branches:
      - fix/auto-volunteer-incident-read-own-invite-20261123

permissions:
  contents: read

jobs:
  invited-only-incident-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-volunserve-simple-invites
      GOOGLE_CLOUD_PROJECT: demo-volunserve-simple-invites
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FUNCTIONS_EMULATOR: "true"
      VOLUNSERVE_SIMPLE_AUTO_INVITES_ENABLED: "true"
      VOLUNSERVE_SIMPLE_AUTO_INVITES_PROJECT_ID: demo-volunserve-simple-invites
      VOLUNSERVE_SIMPLE_AUTO_INVITES_PRODUCTION_APPROVED: "false"
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify only Firestore rules + real E2E test + CI are affected
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status a9e3331eed2184b1ad382706a1dde198fe615067 HEAD > /tmp/read-scope
          test "$(wc -l </tmp/read-scope)" -eq 3
          while IFS="$(printf '\t')" read -r st file; do
            case "$st:$file" in
              "M:firestore.rules"|"M:functions/test-emergencySimpleAutoInviteRealEmulator.cjs"|"A:.github/workflows/qa-automatic-invite-case-read-rules-20261123.yml") ;;
              *) echo "BLOCKED unexpected file: $st $file"; exit 1 ;;
            esac
          done </tmp/read-scope
          test -z "$(git diff --name-only a9e3331eed2184b1ad382706a1dde198fe615067 HEAD -- backend/server.js functions/index.js functions/emergencySimpleAutoInvite.js app/'(admin)'/admin-cases.tsx)"
      - name: Install pinned Firebase emulators
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Static syntax and no-prod Firebase configuration
        run: |
          node --check functions/test-emergencySimpleAutoInviteRealEmulator.cjs
          node --check functions/emergencySimpleAutoInvite.js
          node --test functions/test-emergencySimpleAutoInvite.cjs
      - name: Inject fictional test configuration only
        shell: bash
        run: |
          cat > functions/.env.local <<'DEMO'
          VOLUNSERVE_SIMPLE_AUTO_INVITES_ENABLED=true
          VOLUNSERVE_SIMPLE_AUTO_INVITES_PROJECT_ID=demo-volunserve-simple-invites
          VOLUNSERVE_SIMPLE_AUTO_INVITES_PRODUCTION_APPROVED=false
          DEMO
      - name: Real Auth + Firestore Rules + Functions E2E — own case read and 2 Accept 1 Decline
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-simple-invites --only auth,firestore,functions "node --test --test-concurrency=1 functions/test-emergencySimpleAutoInviteRealEmulator.cjs"
      - name: No deployment
        run: echo "NO DEPLOY and no real emergency dispatch. Local fictional Firebase Emulators only."
