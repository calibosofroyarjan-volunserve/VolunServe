name: Staging SFace Phone Photo & Two-Image QA (NO DEPLOY)
on:
  pull_request:
    branches: [integration/identity-full-staging-20261112]
    paths:
      - 'identity-ai/evaluate_sface_pairs_local.py'
      - 'identity-ai/check_sface_two_photos_local.py'
      - 'identity-ai/test_sface_phone_pair_local.py'
      - 'identity-ai/SFACE_TWO_PHOTO_LOCAL_QUICKSTART.md'
      - '.github/workflows/test-staging-sface-phone-local-no-deploy.yml'
permissions:
  contents: read
jobs:
  private-sface-phone-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Load immutable PR source without repository submodule checkout
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          curl -fLsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/$SOURCE_SHA" \
            -o /tmp/sface-local-phone.zip
          mkdir -p "$RUNNER_TEMP/sface-local-phone"
          unzip -q /tmp/sface-local-phone.zip -d "$RUNNER_TEMP/sface-local-phone"
          ROOT="$(find "$RUNNER_TEMP/sface-local-phone" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$ROOT/identity-ai/test_sface_phone_pair_local.py"
          cp -a "$ROOT/." "$GITHUB_WORKSPACE/"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare synthetic image math, no real face models
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 Pillow==11.3.0
      - name: Verify real photo decoder and no-webcam research diagnostic
        env:
          PYTHONPATH: identity-ai
        run: |
          python -m py_compile identity-ai/evaluate_sface_pairs_local.py identity-ai/check_sface_two_photos_local.py
          python -m unittest discover -s identity-ai -p 'test_sface_phone_pair_local.py' -v
          python -m unittest discover -s identity-ai -p 'test_sface_pair_metrics_local.py' -v
      - name: Confirm no real photos, Firebase, model weights or deployment
        run: echo 'SYNTHETIC_PIXELS_ONLY_NO_DEPLOY_NO_REAL_IMAGES_NO_FIREBASE'
