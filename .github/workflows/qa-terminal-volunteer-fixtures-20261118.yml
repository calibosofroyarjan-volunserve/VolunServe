name: Terminal Volunteer QA fixture safety — no deploy
on:
  pull_request:
    paths:
      - "backend/seed-isolated-staging-volunteers.cjs"
      - "backend/test-seed-isolated-staging-volunteers.cjs"
      - ".github/workflows/qa-terminal-volunteer-fixtures-20261118.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check backend/seed-isolated-staging-volunteers.cjs
      - name: Offline no-credential tests
        run: node --test backend/test-seed-isolated-staging-volunteers.cjs
      - name: No Firebase deploy or live writes
        run: echo "QA code not executed with --apply in CI"
