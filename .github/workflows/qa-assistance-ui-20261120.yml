name: QA Assistance UI TypeScript and Web Build (NO DEPLOY)
on:
  push:
    branches:
      - qa/assistance-tsc-web-check-20261120
permissions:
  contents: read
jobs:
  check-assistance-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit --incremental false
      - name: Verify original assistance action handlers unchanged (read-only)
        run: node scripts/test-assistance-ui-preserve-handlers-qa-20261120.cjs
      - name: Existing Admin navigation contract (read-only)
        run: node scripts/test-admin-navigation-contract.cjs
      - name: Existing LGU review contract (read-only)
        run: node scripts/test-lgu-internal-review-ux.cjs
      - name: Existing route entrypoint contract (read-only)
        run: node scripts/test-route-entrypoints.cjs
      - name: Legacy LGU header contract diagnostic (read-only)
        run: node scripts/test-lgu-admin-global-ui-pagination.cjs
      - name: Expo web export (no deployment)
        run: npx expo export --platform web --clear
      - name: Confirm no production mutation
        run: echo 'QA branch only. No Firebase Hosting, Firestore, or Render deploy.'
