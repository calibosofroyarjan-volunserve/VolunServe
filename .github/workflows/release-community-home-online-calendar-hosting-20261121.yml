# Controller is allowed to run ONLY from the protected default branch.
# Site is built from the exact audited production descendant, never from divergent
# protected branch app files. Hosting only, with backup + rollback.
name: Protected Community Home Online + Calendar Hosting ONLY
on:
  push:
    branches: [live-protected]
    paths:
      - '.github/workflows/release-community-home-online-calendar-hosting-20261121.yml'
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  guarded-release:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/live-protected'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
      SITE: volunserve-3aa5b
      BASE_SHA: d7eff0990eb8094666ddb7dc44355de050c76f68
      SOURCE_SHA: 0b748b6a9309e093fbb5dba6d827228d3c0ff302
      QA_SHA: d25c4cc5ab01ceb85bcf8d61f5123540d7af75d7
      TAB_LAYOUT_BLOB: 9bd52559a67d0048c5e3696f546438ab0a289c60
      MEMBER_PROFILE_BLOB: c05b06deef5bb0bc5173a943cc82cfa03fa1d56e
      CALENDAR_BLOB: 82f65b0c962599354d72b0998152cd18f10173f0
      ONLINE_BLOB: 1742da62d58b0379084f6c54088bce03230a6a0a
      HOME_NATIVE_BLOB: 0affb0606054e80cac59bd7b3667a4d8bbf2c2c8
      HOME_WEB_BLOB: 8e5cb78f8564ae35c797fdd494b0a2a14d70406c
      HEARTBEAT_BLOB: 94df993d9227039973d4d31826ff85478542de9b
      VOLUNSERVE_HOSTING_URL: https://volunserve.com
      BACKUP_CHANNEL: online-calendar-before-release-20261121
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify protected controller, exact production-source patch, and successful UI QA (NO DEPLOY)
        shell: bash
        run: |
          node <<'NODE'
          const a=require('node:assert/strict');
          const REPO='calibosofroyarjan-volunserve/VolunServe';
          const B=process.env.BASE_SHA,S=process.env.SOURCE_SHA,Q=process.env.QA_SHA;
          const TAB='app/(tabs)/_layout.tsx';
          const MEMBER='app/(tabs)/community-member-profile.tsx';
          const CAL='components/home/CommunityCalendar.tsx';
          const ONLINE='components/home/CommunityOnline.tsx';
          const NATIVE='components/home/Home.native.tsx';
          const WEB='components/home/Home.web.tsx';
          const HEARTBEAT='lib/useCommunityPresenceHeartbeat.ts';
          const WF='.github/workflows/release-community-home-online-calendar-hosting-20261121.yml';
          const api=async (route)=>{
            const url='https://api.github.com/repos/'+REPO+'/'+route;
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
              Accept:'application/vnd.github+json','User-Agent':'VolunServe-Protected-Hosting-Controller'},
              signal:AbortSignal.timeout(25000)});
            a(r.ok,'BLOCKED: GitHub API HTTP '+r.status+' for '+route);
            return r.json();
          };
          (async()=>{
            a.equal(process.env.GITHUB_REF,'refs/heads/live-protected',
              'BLOCKED: production environment requires protected branch');
            a.equal(process.env.GITHUB_REPOSITORY,REPO);
            const controller=await api('commits/'+process.env.GITHUB_SHA);
            const verifier='.github/workflows/verify-reconciled-hosting-source-no-deploy-20261111.yml';
            const approved=new Map([[WF,'added'],[verifier,'modified']]);
            a.equal(controller.files.length,approved.size,
              'BLOCKED controller commit changed unrelated paths');
            for(const file of controller.files){
              a.equal(approved.get(file.filename),file.status,
                'BLOCKED controller modified unexpected file '+file.filename);
            }
            const cmp=await api('compare/'+B+'...'+S);
            a.equal(cmp.status,'ahead','BLOCKED source does not descend from current Hosting');
            a.equal(cmp.behind_by,0,'BLOCKED divergent source');
            const changes=new Map(cmp.files.map(f=>[f.filename,f.status]));
            a.equal(changes.size,7,'BLOCKED stale or unrelated modules could enter Hosting');
            a.equal(changes.get(TAB),'modified');
            a.equal(changes.get(MEMBER),'added');
            a.equal(changes.get(CAL),'added');
            a.equal(changes.get(ONLINE),'added');
            a.equal(changes.get(NATIVE),'modified');
            a.equal(changes.get(WEB),'modified');
            a.equal(changes.get(HEARTBEAT),'added');
            const blob=async (path,sha)=>(await api('contents/'+path+'?ref='+sha)).sha;
            for(const [path,expected] of [[TAB,process.env.TAB_LAYOUT_BLOB],
                                         [MEMBER,process.env.MEMBER_PROFILE_BLOB],
                                         [CAL,process.env.CALENDAR_BLOB],
                                         [ONLINE,process.env.ONLINE_BLOB],
                                         [NATIVE,process.env.HOME_NATIVE_BLOB],
                                         [WEB,process.env.HOME_WEB_BLOB],
                                         [HEARTBEAT,process.env.HEARTBEAT_BLOB]]){
              a.equal(await blob(path,S),expected,'BLOCKED source UI drift: '+path);
              a.equal(await blob(path,Q),expected,'BLOCKED QA and release source differ: '+path);
            }
            let green=false;
            for(let i=0;i<55;i++){
              const items=await api('actions/runs?branch=qa%2Fhome-community-ui-20261121&per_page=40');
              const relevant=items.workflow_runs.filter(x=>x.head_sha===Q &&
                x.name==='QA Community Online + Calendar Home PC Mobile (NO DEPLOY)' &&
                x.event==='push');
              if(relevant.some(x=>x.status==='completed' && x.conclusion==='success')){
                green=true;break;
              }
              if(relevant.length && relevant.every(x=>x.status==='completed')) {
                throw Error('BLOCKED latest exact-UI QA failed');
              }
              console.log('WAITING on pinned QA, no live access');
              await new Promise(resolve=>setTimeout(resolve,12000));
            }
            a(green,'BLOCKED: no successful pinned QA run');
            console.log('PASS exact current-live source; seven QA-pinned online community calendar/home UI changes; green QA');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
      - name: Extract exact audited site revision without legacy gitlink checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" \
            -o "$RUNNER_TEMP/community-events-reviewed-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/community-events-reviewed-source.tar.gz" \
            --strip-components=1 -C site
          test -f 'site/app/(tabs)/community-member-profile.tsx'
          test -f 'site/components/home/CommunityCalendar.tsx'
          test -f 'site/components/home/CommunityOnline.tsx'
          test -f 'site/components/home/Home.web.tsx'
          test -f site/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Confirm authenticated online presence backend endpoint is deployed
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --location --output /dev/null --write-out '%{http_code}' \
            --max-time 25 'https://volunserve.onrender.com/api/community/presence')
          test "$STATUS" = "401" || { echo "::error::Backend endpoint not deployed or Auth boundary missing: HTTP $STATUS"; exit 1; }
          echo 'PASS opt-in community presence endpoint exists and requires authentication'
      - name: Confirm Hosting source still equals audited production (READ ONLY)
        working-directory: site
        shell: bash
        run: VOLUNSERVE_EXPECTED_SHA="$BASE_SHA" node scripts/check-live-hosting.cjs
      - name: Install exact pinned site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: TypeScript, roles, login, profile, and map regression checks
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --incremental false
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-profile-certificates-account-menu.cjs
      - name: Build approved Community Online and calendar without altering backend or Firestore
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          npx expo export --platform web --clear
          GITHUB_SHA="$SOURCE_SHA" node scripts/verify-hosting-release.cjs
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const marker=JSON.parse(fs.readFileSync('dist/volunserve-release.json','utf8'));
          a.equal(marker.revision,process.env.SOURCE_SHA);
          a.equal(marker.firebaseProject,process.env.SITE);
          a(fs.existsSync('dist/index.html'));
          a(fs.existsSync('dist/community-member-profile.html')||
            fs.existsSync('dist/community-member-profile/index.html'));
          console.log('PASS exact source revision, resident/volunteer home and member profile route');
          NODE
      - name: Reconfirm live unchanged, validate correct production Hosting secret
        working-directory: site
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          VOLUNSERVE_EXPECTED_SHA="$BASE_SHA" node scripts/check-live-hosting.cjs
          test -n "$FIREBASE_SA" || { echo "::error::Missing production Hosting credential, blocked"; exit 1; }
          node <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const v=JSON.parse(process.env.FIREBASE_SA);
          a.equal(v.type,'service_account');
          a.equal(v.project_id,process.env.SITE);
          a(v.client_email&&v.private_key,'BLOCKED: invalid production Hosting key');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/community-events-prod-hosting-key.json',
            process.env.FIREBASE_SA,{mode:0o600});
          console.log('PASS correct Firebase Hosting project key (secret not printed)');
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/community-events-prod-hosting-key.json" >> "$GITHUB_ENV"
      - name: Back up published live Hosting before any deploy
        id: backup
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          VOLUNSERVE_EXPECTED_SHA="$BASE_SHA" node scripts/check-live-hosting.cjs
          npx firebase-tools hosting:clone "$SITE:live" "$SITE:$BACKUP_CHANNEL" \
            --project "$SITE" --non-interactive
          echo "PASS published Hosting backup created"
      - name: Deploy Hosting ONLY, not Firestore, Auth, Functions, Render or data
        id: deploy
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          VOLUNSERVE_EXPECTED_SHA="$BASE_SHA" node scripts/check-live-hosting.cjs
          npx firebase-tools deploy --only hosting --project "$SITE" --non-interactive
          echo "Hosting-only deploy complete; verifying fingerprint"
      - name: Verify actual live Hosting revision and public routes
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if VOLUNSERVE_EXPECTED_SHA="$SOURCE_SHA" node scripts/check-live-hosting.cjs; then
              echo "PASS Community Online and calendar Homepage live, no backend changes"
              exit 0
            fi
            sleep 12
          done
          echo "::error::Production smoke failed; trigger backup rollback"
          exit 1
      - name: Restore previous Hosting snapshot on deployment / smoke failure
        if: failure() && steps.backup.outcome == 'success' && steps.deploy.outcome != 'skipped'
        working-directory: site
        shell: bash
        run: |
          npx firebase-tools hosting:clone "$SITE:$BACKUP_CHANNEL" "$SITE:live" \
            --project "$SITE" --non-interactive
          VOLUNSERVE_EXPECTED_SHA="$BASE_SHA" node scripts/check-live-hosting.cjs
      - name: Remove temporary production credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/community-events-prod-hosting-key.json"
