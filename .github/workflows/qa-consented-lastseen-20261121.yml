name: QA Consented Offline Last Seen Backend (NO DEPLOY)
on:
  push:
    branches: [fix/consented-lastseen-offline-20261121]
    paths:
      - 'backend/communitySocial.js'
      - 'backend/test-communitySocial.js'
      - '.github/workflows/qa-consented-lastseen-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend JavaScript
        run: |
          node --check backend/communitySocial.js
          node --check backend/test-communitySocial.js
      - name: Test existing chat, presence and Last Seen
        run: node --test backend/test-communitySocial.js backend/test-communityPresence.js
      - name: Protect unrelated production backend files
        run: |
          git fetch origin backend-live-protected --depth=1
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
            ['git','diff','--name-only','origin/backend-live-protected','HEAD'],text=True).splitlines())
          allowed={'backend/communitySocial.js','backend/test-communitySocial.js',
            '.github/workflows/qa-consented-lastseen-20261121.yml'}
          assert changed and changed.issubset(allowed),repr(changed)
          print('PASS no changes to login, rules, identity, donations or emergency APIs')
          PY