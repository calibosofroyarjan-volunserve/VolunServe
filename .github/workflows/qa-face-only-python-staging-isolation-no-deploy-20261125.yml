name: Original Face-Only Python Staging Credential Isolation (NO DEPLOY)
on:
  push:
    branches:
      - qa/original-face-only-python-staging-isolation-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-stage-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no original Python face-matcher or production behavior has changed
        uses: actions/github-script@v7
        with:
          script: |
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const base='d3320ccef20bd87b98cecc8885da5ab7fa57809e';
            const cmp=await github.rest.repos.compareCommits({owner,repo,base,head:context.sha});
            assert.equal(cmp.data.behind_by,0,'Must extend last passing face-only Python');
            assert.deepEqual((cmp.data.files||[]).map(x=>x.filename).sort(),[
              '.github/workflows/qa-face-only-python-staging-isolation-no-deploy-20261125.yml',
              'identity-ai/main.py',
              'identity-ai/staging_original_ai_isolation.py',
            ].sort(),'No unrelated Python or live application files may change');
            const load=async(ref)=>{
              const r=await github.rest.repos.getContent({owner,repo,
                path:'identity-ai/main.py',ref});
              return Buffer.from(r.data.content,'base64').toString('utf8');
            };
            const original=await load(base),candidate=await load(context.sha);
            const take=s=>{
              const start=s.indexOf('def run_face_verification(');
              assert.ok(start>=0);
              const next=s.slice(start+1).search(/^(?:@app\.|@lru_cache|def |async def |class )/m);
              return next<0?s.slice(start).trimEnd():s.slice(start,start+1+next).trimEnd();
            };
            assert.equal(take(original),take(candidate),'Original matcher must remain unchanged');
            core.info('PASS: Oct-23 original matcher and private face-only route unchanged');
      - name: Python syntax and original front/selfie synthetic tests
        run: |
          python -m py_compile identity-ai/main.py identity-ai/staging_original_ai_isolation.py
          python scripts/test-original-face-only-python-20261125.py
      - name: Exact guard with synthetic separate account and internal key
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util,hashlib
          p=Path('identity-ai/staging_original_ai_isolation.py')
          spec=importlib.util.spec_from_file_location('private_isolation',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          sha=lambda v:hashlib.sha256(v.encode()).hexdigest()
          stage_key='SYNTHETIC_ISOLATED_PYTHON_STAGE_KEY_NOT_REAL_20261125'
          prod_key='SYNTHETIC_DIFFERENT_PRODUCTION_KEY_NOT_REAL_20261125'
          env={
            'RENDER_SERVICE_NAME':'volunserve-identity-ai-staging',
            'VOLUNSERVE_DEPLOYMENT_ENV':'staging',
            'VOLUNSERVE_STAGING_STRICT':'true',
            'VOLUNSERVE_STAGING_FIREBASE_PROJECT_ID':'demo-isolated-staging',
            'VOLUNSERVE_STAGING_BACKEND_URL':'https://volunserve-backend-staging.onrender.com',
            'IDENTITY_AI_INTERNAL_KEY':stage_key,
            'VOLUNSERVE_STAGING_INTERNAL_KEY_SHA256':sha(stage_key),
            'VOLUNSERVE_PRODUCTION_INTERNAL_KEY_SHA256':sha(prod_key),
          }
          checks=0
          def allowed(label,override):
            global checks
            mod.assert_original_ai_staging_isolated({**env,**override})
            checks+=1;print('PASS:',label)
          def blocked(label,override):
            global checks
            try:mod.assert_original_ai_staging_isolated({**env,**override})
            except RuntimeError as exc:
              assert 'staging isolation blocked' in str(exc)
            else:raise AssertionError('Unexpectedly allowed: '+label)
            checks+=1;print('PASS:',label)
          allowed('isolated synthetic staging',{})
          blocked('private key reused from production',{
            'VOLUNSERVE_PRODUCTION_INTERNAL_KEY_SHA256':sha(stage_key)})
          blocked('private key mismatched fingerprint',{
            'IDENTITY_AI_INTERNAL_KEY':'SYNTHETIC_DIFFERENT_KEY_WRONG_STAGE_20261125'})
          blocked('production Firebase project declaration',{
            'VOLUNSERVE_STAGING_FIREBASE_PROJECT_ID':'volunserve-3aa5b'})
          blocked('production Cloudinary credentials in Python',{
            'CLOUDINARY_API_KEY':'SYNTHETIC_PROD_KEY'})
          blocked('Python staging pointed at production backend',{
            'VOLUNSERVE_STAGING_BACKEND_URL':'https://volunserve.onrender.com'})
          blocked('staging requests without strict flags',{
            'VOLUNSERVE_STAGING_STRICT':''})
          blocked('staging allows production origin',{
            'ALLOWED_ORIGINS':'https://volunserve.com'})
          mod.assert_original_ai_staging_isolated({
            'RENDER_SERVICE_NAME':'volunserve-identity-ai',
            'VOLUNSERVE_DEPLOYMENT_ENV':'production'})
          checks+=1;print('PASS: unchanged production behavior')
          assert checks==9
          print('SUCCESS:',checks,'Python staging-isolation synthetic checks')
          PY
      - name: No upload or deployment
        run: |
          echo 'NO DEPLOY, NO SDK CALLS, NO LIVE KEY, NO RESIDENT IMAGES, NO PAID SERVICE'
          echo 'BLOCKER: Actual hosted Node-Python key matching and separate staging credentials not yet verified'
