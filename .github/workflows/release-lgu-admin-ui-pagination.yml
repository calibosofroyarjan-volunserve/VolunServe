name: Publish Verified LGU Admin Pagination and UI (Hosting Only)
on:
  push:
    branches:
      - release/lgu-admin-ui-pagination-20261029
    paths:
      - .github/workflows/release-lgu-admin-ui-pagination.yml
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require approved, workflow-only release commit
        shell: bash
        run: |
          git merge-base --is-ancestor c4f818dcf24b0944879f5c60a921df770fcd4cd1 HEAD
          test "$(git diff --name-only c4f818dcf24b0944879f5c60a921df770fcd4cd1 HEAD)" = ".github/workflows/release-lgu-admin-ui-pagination.yml"
      - run: npm ci --no-audit --no-fund
      - name: Verify pagination, workflow guards, and Expo TypeScript
        run: |
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-admin-response-workspace-ux.cjs
          node scripts/test-admin-people-verification-premium-ui.cjs
          node scripts/test-lgu-dashboard-inline-approvals-and-paging.cjs
          node scripts/test-pavia-admin-pagination-announcements.cjs
          node scripts/test-final-admin-scope.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          npx tsc --noEmit --pretty false
      - name: Compile and stamp exact Expo Hosting revision
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require Firebase Hosting credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Hosting credentials; production unchanged."
            exit 1
          fi
      - name: Deploy Firebase Hosting only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Confirm exact release and routes on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Exact production UI revision could not be confirmed."
          exit 1
