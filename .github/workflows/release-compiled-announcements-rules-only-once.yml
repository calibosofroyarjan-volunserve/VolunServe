name: Guarded Announcements-ONLY Rules Activation (No Hosting/Data Changes)
on:
  push:
    branches: [audit/live-base-announcement-20261105]
    paths: [".github/workflows/release-compiled-announcements-rules-only-once.yml"]
permissions:
  contents: read
concurrency:
  group: volunserve-firestore-rules-announcements-activation
  cancel-in-progress: false
jobs:
  surgically-activate-reviewed-rules:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.event.head_commit.message == 'One-shot guarded activation of compiled announcement-only Firebase Ruleset'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: volunserve-3aa5b
      - uses: google-github-actions/setup-gcloud@v3
      - name: Reconstruct only the announcement policy change from exact live Cloud Ruleset
        run: python3 scripts/prepare-live-announcements-rules-candidate.py
      - name: Retrieve reviewed emulator authorization tests
        run: |
          git fetch --no-tags origin feature/announcements-on-verified-live-20261105
          git show FETCH_HEAD:scripts/test-announcements-audience-security.cjs > scripts/test-announcements-audience-security.cjs
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify barangay security before any production change
        run: npx firebase emulators:exec --only firestore --project demo-volunserve 'node scripts/test-announcements-audience-security.cjs'
      - name: Verify original LGU publishing and suspended Admin denial
        run: npx firebase emulators:exec --only firestore --project demo-volunserve 'node scripts/test-pavia-admin-announcement-emulator.cjs'
      - name: Guarded activation — verify both exact source hashes, deployed Hosting revision, then update existing Ruleset pointer only
        run: python3 scripts/release-compiled-announcements-rules-only.py
      - name: Explicit release boundary
        run: |
          echo 'Announcement-only Firebase Rules were activated from a previously compiled audited immutable Ruleset.'
          echo 'Hosting, Login, Signup, Auth, Super Admin, Admin screens, app code, Functions, Storage and Firestore documents were not deployed or modified by this workflow.'
