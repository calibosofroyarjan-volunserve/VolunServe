name: QA Exact Three-Tab VolunServe Profile Design (NO DEPLOY)
on:
  push:
    branches: [qa/profile-three-tabs-exact-design-20261121]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate exact profile design and existing certificates
        run: node --test scripts/test-exact-profile-three-tabs-20261121.cjs
      - name: Install exact pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and unchanged profile / role / login / map regressions
        run: |
          npx tsc --noEmit --incremental false
          node scripts/test-profile-certificates-account-menu.cjs
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-login-ui-release.cjs
      - name: Export web with both profile routes
        run: |
          npx expo export --platform web --clear
          test -f dist/profile.html || test -f dist/profile/index.html
          test -f dist/community-event-profile.html || test -f dist/community-event-profile/index.html
