name: Publish Unified Identity Screening UI (Firebase Hosting Only)
on:
  push:
    branches:
      - release/unified-identity-screening-web-20261030
    paths:
      - .github/workflows/release-unified-identity-screening-web.yml
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm merged Identity AI revision and workflow-only delta
        shell: bash
        run: |
          git merge-base --is-ancestor 264744be222f3b4b956bacdf1e908b7a00febf9c HEAD
          test "$(git diff --name-only 264744be222f3b4b956bacdf1e908b7a00febf9c HEAD)" = ".github/workflows/release-unified-identity-screening-web.yml"
      - run: npm ci --no-audit --no-fund
      - name: Test Resident/LGU screening and protected verification UI
        run: |
          node scripts/test-unified-identity-ai-government-id-screening.cjs
          node scripts/test-admin-people-verification-premium-ui.cjs
          node scripts/test-final-admin-scope.cjs
          npx tsc --noEmit --pretty false
      - name: Build static Expo web and verify release marker
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Check Firebase Hosting credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::No Hosting credentials. Production unchanged."
            exit 1
          fi
      - name: Publish web Hosting only (AI and Node services deploy separately)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact custom-domain revision
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Exact web revision not confirmed on custom domain."
          exit 1
