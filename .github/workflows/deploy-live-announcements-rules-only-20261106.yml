name: Guarded Live Announcements Rules Only - No Hosting Changes
on:
  push:
    branches: [hotfix/live-announcements-rules-only-20261106]
    paths:
      - .github/workflows/deploy-live-announcements-rules-only-20261106.yml
permissions:
  contents: read
concurrency:
  group: volunserve-production-firestore-rules-only
  cancel-in-progress: false
jobs:
  verify-and-release:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFIED_LIVE_SHA: 70b9785cd7baa9ae82933eeeedc0660ccb2a18dc
      OLD_RULES_SHA: 53c7d9b9bc39e15ee8c25ffe0e5384d39f3d3c2f
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prove branch is the exact working live Hosting snapshot plus this workflow
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VERIFIED_LIVE_SHA" HEAD
          test "$(git diff --name-only "$VERIFIED_LIVE_SHA" HEAD)" = ".github/workflows/deploy-live-announcements-rules-only-20261106.yml"
          test -n "$FIREBASE_SA"
          node <<'NODE'
          const creds=JSON.parse(process.env.FIREBASE_SA);
          if(creds.project_id!=='volunserve-3aa5b'||creds.type!=='service_account') throw Error('Wrong Firebase project');
          console.log('Verified project and isolated branch (no Hosting or application changes).');
          NODE
      - name: Install and validate exact live snapshot
        run: |
          npm ci --no-audit --no-fund
          node scripts/test-pavia-admin-pagination-announcements.cjs
          npx firebase-tools emulators:exec --only firestore --project demo-volunserve "node scripts/test-pavia-admin-announcement-emulator.cjs"
      - name: Authenticate to production Firebase project
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.FIREBASE_SA }}
          project_id: volunserve-3aa5b
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build a surgical announcement-only patch on actual active production rules
        id: audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/firestore.rules?ref=${OLD_RULES_SHA}" --jq .content | base64 -d > /tmp/old-firestore.rules
          cp firestore.rules /tmp/new-announcements-rules-source
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          export ACCESS_TOKEN
          node <<'NODE'
          const fs=require('fs');
          const original=fs.readFileSync('/tmp/old-firestore.rules','utf8');
          const updated=fs.readFileSync('/tmp/new-announcements-rules-source','utf8');
          const bounds=(value)=>{
            const start=value.indexOf('    match /announcements/{announcementId} {');
            const end=value.indexOf('    match /identityVerifications/{uid} {',start);
            if(start<0||end<0||end<=start)throw Error('Missing exact announcements rule anchors');
            return {start,end,block:value.slice(start,end)};
          };
          const old=bounds(original), next=bounds(updated);
          const without=(v,b)=>v.slice(0,b.start)+v.slice(b.end);
          if(without(original,old)!==without(updated,next))throw Error('Source contains unrelated changes: abort');
          if(!next.block.includes('request.resource.data.audience == "all"'))throw Error('Incorrect announcement target: abort');
          const auth={Authorization:'Bearer '+process.env.ACCESS_TOKEN};
          const base='https://firebaserules.googleapis.com/v1/';
          const get=async p=>{
            const r=await fetch(base+p,{headers:auth});
            if(!r.ok)throw Error('Cannot verify live rules: HTTP '+r.status);
            return r.json();
          };
          (async()=>{
            const release=await get('projects/volunserve-3aa5b/releases/cloud.firestore');
            if(!release.rulesetName)throw Error('Active release missing ruleset');
            const ruleset=await get(release.rulesetName);
            if(ruleset.source?.files?.length!==1||typeof ruleset.source.files[0].content!=='string')
              throw Error('Unrecognized active rules file layout: abort');
            const active=ruleset.source.files[0].content;
            const activeBlock=bounds(active);
            // Preserve every deployed rule except the single announcements match.
            // Only rewrite exact, known clauses from the inspected active policy.
            // The verified source was already tested; replace only the announcement
            // block rather than assuming byte-identical formatting in old live rules.
            if(!activeBlock.block.includes('function ownAnnouncementArea()') ||
               !activeBlock.block.includes("profile().get('adminStatus', 'active') != 'suspended'") ||
               !activeBlock.block.includes('allow create: if isAdmin()') ||
               !activeBlock.block.includes('allow delete: if isAdmin()'))
              throw Error('Unrecognized old live announcement authority; abort without deployment');
            let revised=next.block;
            // Preserve active suspension protection: the new app source's isAdmin()
            // alone may not match the deployed helper's adminStatus behavior.
            for(const operation of ['create','update','delete']){
              const before='allow '+operation+': if isAdmin()';
              if(revised.split(before).length!==2)throw Error('Unexpected '+operation+' announcement writer rule');
              revised=revised.replace(before,before+"\\n        && profile().get('adminStatus', 'active') != 'suspended'");
            }
            // Preserve the active production suspension gate even if the
            // announcement-only source was authored before that restriction.
            for(const operation of ['create','update','delete']){
              const before='allow '+operation+': if isAdmin()';
              if(revised.split(before).length!==2)throw Error('Unexpected '+operation+' authorization');
              revised=revised.replace(before,
                before+"\n        && profile().get('adminStatus', 'active') != 'suspended'");
            }
            if(!revised.includes('allow create: if isAdmin()') ||
               !revised.includes('allow update: if isAdmin()') ||
               !revised.includes('allow delete: if isAdmin()') ||
               !revised.includes('request.resource.data.createdBy == request.auth.uid') ||
               !revised.includes('resource.data.createdBy == request.auth.uid'))
              throw Error('New announcement writer or ownership rules differ from audited contract');
            if(!revised.includes('request.resource.data.audience == "all"') ||
               !revised.includes('resource.data.publishAt <= request.time'))
               throw Error('Global published-only contract incomplete');
            const patched=active.slice(0,activeBlock.start)+revised+active.slice(activeBlock.end);
            const patchBound=bounds(patched);
            if(without(active,activeBlock)!==without(patched,patchBound))throw Error('Non-announcement rules changed: abort');
            fs.writeFileSync('firestore.rules',patched);
            fs.writeFileSync('/tmp/verified-active-ruleset',release.rulesetName);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'deploy=true\n');
            console.log('Verified scoped patch: active non-announcement rules kept byte-for-byte.');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Validate exact patched active rule set in emulator
        if: steps.audit.outputs.deploy == 'true'
        run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve "node scripts/test-pavia-admin-announcement-emulator.cjs"
      - name: Reverify active rule release has not changed since audit
        if: steps.audit.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          NAME="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" 'https://firebaserules.googleapis.com/v1/projects/volunserve-3aa5b/releases/cloud.firestore' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>console.log(JSON.parse(s).rulesetName||''))")"
          test "$NAME" = "$(cat /tmp/verified-active-ruleset)" || { echo "::error::Active rules changed during audit; no deployment"; exit 1; }
      - name: Deploy Firestore security rules ONLY (no Hosting, Auth, database, Storage or Functions)
        if: steps.audit.outputs.deploy == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        shell: bash
        run: npx firebase-tools deploy --only firestore:rules --project volunserve-3aa5b --non-interactive
