# One-time FAIL-CLOSED release of verified UI-only VolunServe typography across roles.
# Do not deploy pending protected-branch backend or unrelated auth/rules changes.
name: ONE-TIME Unified VolunServe Typography (concurrent-safe Hosting)
on:
  push:
    branches: [live-protected]
    paths:
      - '.github/workflows/one-time-unified-typography-concurrent-safe-20261108.yml'
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  isolated-typography-release:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/live-protected'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      BASE_SHA: '6ebd3b6fba3c3d0c9088cda1c5a59da764414058'
      UI_SHA: '9ffe1840b942a4b2f47aa2508d923d2a03f5fe3e'
      TRIGGER_PATH: '.github/workflows/one-time-unified-typography-concurrent-safe-20261108.yml'
    steps:
      - name: Inspect CURRENT protected branch and event only (no deployment)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject wrong trigger, stale live marker and unapproved UI diff
        shell: bash
        run: |
          node scripts/guard-live-protected-release.cjs --self-test
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const sha=x=>/^[a-f0-9]{40}$/.test(x||'');
          const expected=new Set(["app/(admin)/_layout.tsx","app/(admin)/account-approvals.tsx","app/(admin)/admin-cases.tsx","app/(admin)/admin-certificates.tsx","app/(admin)/admin-disputes.tsx","app/(admin)/admin-profile.tsx","app/(admin)/assistance-requests.tsx","app/(admin)/command-center.tsx","app/(admin)/community-attendance.tsx","app/(admin)/community-certificates.tsx","app/(admin)/community-events.tsx","app/(admin)/create-announcement.tsx","app/(admin)/donation-list.tsx","app/(admin)/identity-reviews.tsx","app/(admin)/lgu-attendance.tsx","app/(admin)/lgu-members.tsx","app/(superadmin)/_layout.tsx","app/(superadmin)/admin-accounts.tsx","app/(superadmin)/admin-logs.tsx","app/(superadmin)/all-records.tsx","app/(superadmin)/index.tsx","app/(superadmin)/profile.tsx","app/(superadmin)/system-settings.tsx","app/(tabs)/_layout.tsx","app/(tabs)/analytics.tsx","app/(tabs)/announcements.tsx","app/(tabs)/certificate.tsx","app/(tabs)/community-events.tsx","app/(tabs)/disaster-response.tsx","app/(tabs)/donation-history.tsx","app/(tabs)/donation.tsx","app/(tabs)/my-cases.tsx","app/(tabs)/notifications.tsx","app/(tabs)/profile.tsx","app/(tabs)/resident.tsx","app/(tabs)/volunteer-application.tsx","app/(tabs)/volunteer-impact.tsx","app/(tabs)/volunteer.tsx","app/(tabs)/volunteer.web.tsx","app/account-security.tsx","app/admin-request.tsx","app/login.tsx","app/login.web.tsx","app/signup.tsx","app/signup.web.tsx","components/admin/AdminReviewHero.tsx","components/admin/DashboardOperationalInsights.tsx","components/admin/DashboardPendingIdentityReviews.tsx","components/admin/DashboardRecentActivities.tsx","components/admin/DashboardVolunteerApprovals.tsx","components/auth/EmailFirstSignup.tsx","components/auth/PasswordResetDialog.tsx","components/auth/PremiumAuthShell.tsx","components/donations/CampaignBeneficiaryWallet.tsx","components/donations/DonationAdminDashboard.tsx","components/donations/FundReconciliationPanel.tsx","components/donations/FundReleaseControls.tsx","components/donations/PremiumCampaignDetails.tsx","components/donations/ResidentReleaseAcknowledgment.tsx","components/guest/GuestWorkspace.tsx","components/home/Home.native.tsx","components/home/Home.web.tsx","components/volunteers/CommunityEventRoster.tsx","components/volunteers/VolunteerAttendanceSummary.tsx","constants/volunserveLiveUi.ts"]);
          async function main(){
            const {GITHUB_SHA,GITHUB_REF,GITHUB_REPOSITORY,GITHUB_EVENT_PATH,BASE_SHA,UI_SHA,TRIGGER_PATH}=process.env;
            const e=JSON.parse(fs.readFileSync(GITHUB_EVENT_PATH,'utf8'));
            assert.equal(GITHUB_REF,'refs/heads/live-protected');
            assert.equal(GITHUB_REPOSITORY,'calibosofroyarjan-volunserve/VolunServe');
            assert(sha(GITHUB_SHA)&&sha(BASE_SHA)&&sha(UI_SHA)&&sha(e.before));
            assert.equal(git('rev-parse','HEAD'),GITHUB_SHA);
            const remote=git('ls-remote','--heads','origin','live-protected').split(/\s+/)[0];
            if(remote!==GITHUB_SHA){
              cp.execFileSync('git',['fetch','origin','live-protected'],{stdio:'ignore'});
              git('merge-base','--is-ancestor',GITHUB_SHA,remote);
            }
            git('merge-base','--is-ancestor',e.before,GITHUB_SHA);
            assert.equal(git('diff','--name-status','--no-renames',e.before,GITHUB_SHA),'A\t'+TRIGGER_PATH,'BLOCKED: unapproved trigger changes');
            assert.equal(git('rev-parse',BASE_SHA),BASE_SHA);
            assert.equal(git('rev-parse',UI_SHA),UI_SHA);
            git('merge-base','--is-ancestor',BASE_SHA,UI_SHA);
            const fileNames=git('diff','--name-only','--no-renames',BASE_SHA,UI_SHA).split('\n').filter(Boolean);
            assert.equal(fileNames.length,65,'BLOCKED: unexpected count');
            assert.deepEqual(new Set(fileNames),expected,'BLOCKED: unapproved candidate file paths');
            for(const file of fileNames)assert(/^(app|components|constants)\/.*\.(ts|tsx)$/.test(file),'BLOCKED: non-UI file');
            const statuses=git('diff','--name-status','--no-renames',BASE_SHA,UI_SHA).split('\n').filter(Boolean);
            assert(statuses.every(x=>/^M\t/.test(x)),'BLOCKED: added, deleted or renamed files');
            const res=await fetch('https://volunserve.com/volunserve-release.json',{headers:{'Cache-Control':'no-cache','Accept':'application/json'},signal:AbortSignal.timeout(12000),redirect:'error'});
            assert(res.ok,'BLOCKED: production marker unavailable');
            const marker=await res.json();
            assert.equal(marker.app,'VolunServe');
            assert.equal(marker.firebaseProject,'volunserve-3aa5b');
            assert.equal(marker.revision,BASE_SHA,'BLOCKED: production changed since approved baseline');
            console.log('PASS: exact live marker + isolated approved 65 UI files + protected source');
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Checkout exact TESTED isolated typography candidate
        uses: actions/checkout@v4
        with:
          ref: 9ffe1840b942a4b2f47aa2508d923d2a03f5fe3e
          fetch-depth: 0
          submodules: false
      - name: Confirm isolated candidate checkout and scope
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict'),cp=require('node:child_process');
          const git=(...a)=>cp.execFileSync('git',a,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),process.env.UI_SHA);
          git('merge-base','--is-ancestor',process.env.BASE_SHA,process.env.UI_SHA);
          const x=git('diff','--name-only','--no-renames',process.env.BASE_SHA,process.env.UI_SHA).split('\n').filter(Boolean);
          assert.equal(x.length,65);
          assert(x.every(f=>/^(app|components|constants)\/.*\.(tsx|ts)$/.test(f)));
          console.log('PASS: exact UI-only candidate ready for web build');
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and live role-UI regression checks
        run: |
          npx tsc --noEmit --incremental false
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
          node scripts/test-resident-volunteer-sidebar.cjs
          node scripts/test-superadmin-accounts-directory.cjs
          node scripts/test-login-field-validation.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
      - name: Build ONLY isolated web candidate and fingerprint its revision
        shell: bash
        run: |
          npx expo export --platform web --clear
          env -u GITHUB_SHA node scripts/verify-hosting-release.cjs
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const marker=JSON.parse(fs.readFileSync('dist/volunserve-release.json','utf8'));
          assert.equal(marker.revision,process.env.UI_SHA,'BLOCKED: artifact revision mismatch');
          assert.equal(marker.firebaseProject,'volunserve-3aa5b');
          console.log('PASS: exact isolated release SHA in web artifact');
          NODE
      - name: Recheck current branch and production marker immediately BEFORE publishing
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict'),cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          async function main(){
            assert.equal(git('rev-parse','HEAD'),process.env.UI_SHA);
            const remote=git('ls-remote','--heads','origin','live-protected').split(/\s+/)[0];
            if(remote!==process.env.GITHUB_SHA){
              cp.execFileSync('git',['fetch','origin','live-protected'],{stdio:'ignore'});
              git('merge-base','--is-ancestor',process.env.GITHUB_SHA,remote);
            }
            const res=await fetch('https://volunserve.com/volunserve-release.json',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(12000),redirect:'error'});
            assert(res.ok);const live=await res.json();
            assert.equal(live.app,'VolunServe');
            assert.equal(live.firebaseProject,'volunserve-3aa5b');
            assert.equal(live.revision,process.env.BASE_SHA,'BLOCKED: live revision drift; no deploy');
            console.log('PASS: live still approved revision before Hosting publish');
          }main().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Require production environment-only Firebase credential
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Production Hosting environment credential missing"
            exit 1
          fi
      - name: Publish Firebase Hosting LIVE ONLY (NO backend, Firestore rules or functions)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Confirm new live revision and public pages
        shell: bash
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: 9ffe1840b942a4b2f47aa2508d923d2a03f5fe3e
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Live Hosting has not served the isolated typography revision"
          exit 1
