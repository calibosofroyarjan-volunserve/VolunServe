name: Identity AI protected-release candidate checks (NO DEPLOY)

on:
  push:
    branches:
      - release/identity-ai-from-protected-20261111
    paths:
      - 'identity-ai/**'
      - '.github/workflows/identity-ai-release-candidate-20261111.yml'
  pull_request:
    branches:
      - identity-live-protected
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-policy-tests:
    name: Five-ID allowlist and blur review policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile identity-ai/main.py identity-ai/document_screening.py identity-ai/face_boxes.py
      - name: Privacy-safe classification tests
        working-directory: identity-ai
        run: python -m unittest -v test_document_screening.py test_face_box_dedup.py

  face-runtime-smoke:
    name: Real MediaPipe face-mesh smoke checks (NO OCR REQUIRED)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: identity-ai/requirements.txt
      - name: Install pinned Python runtime
        run: python -m pip install -r identity-ai/requirements.txt
      - name: Verify installed MediaPipe and OpenCV on fabricated blank images
        working-directory: identity-ai
        run: python -m unittest -v test_ai_runtime_smoke.py

  runtime-synthetic-tests:
    name: Actual Tesseract and MediaPipe in production-equivalent Docker (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Build existing Python AI Dockerfile locally (never push)
        run: |
          docker build --pull -t volunserve-identity-ai-ci:local -f identity-ai/Dockerfile identity-ai
      - name: Verify OCR binary and MediaPipe runtime are installed
        run: |
          docker run --rm --entrypoint sh volunserve-identity-ai-ci:local -c 'command -v tesseract && tesseract --version && python -c "import cv2, mediapipe; print(cv2.__version__, mediapipe.__version__)"'
      - name: Run synthetic ID OCR and face integration tests inside image
        run: |
          docker run --rm --network none --entrypoint python volunserve-identity-ai-ci:local -m unittest -v test_ai_runtime_smoke.py test_synthetic_document_pipeline.py
