name: Import SJDM public place index and QA (NO DEPLOY)
on:
  push:
    branches: [fix/event-meeting-point-search-20261124]
    paths: ['.github/workflows/qa-event-meeting-place-search-20261124.yml']
permissions:
  contents: write
concurrency:
  group: sjdm-place-index-one-time-import
  cancel-in-progress: false
jobs:
  qa:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/fix/event-meeting-point-search-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Extract exact candidate without submodules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import only named public OSM features in SJDM
        run: node scripts/import-sjdm-meeting-places.cjs
      - run: npm ci --no-audit --no-fund
      - name: Verify real indexed place search and existing GPS acquisition
        run: |
          node scripts/test-event-meeting-place-search.cjs
          node --experimental-strip-types --test scripts/test-attendance-gps-retry.cjs
          npx tsc --noEmit --incremental false
          npx expo export --platform web --clear
      - name: Save only tested public place snapshot to isolated candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict');
          const branch='fix/event-meeting-point-search-20261124';
          const path='constants/sjdmMeetingPlaces.json';
          const root='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          (async()=>{
            const ref=await fetch(root+'/git/ref/heads/'+branch,{headers});a(ref.ok);
            a.equal((await ref.json()).object.sha,process.env.GITHUB_SHA,'Candidate branch changed; do not overwrite');
            const old=await fetch(root+'/contents/'+path+'?ref='+branch,{headers});a(old.ok);
            const sha=(await old.json()).sha;
            const data=fs.readFileSync(path);a(data.length<3000000);
            const res=await fetch(root+'/contents/'+path,{method:'PUT',headers,body:JSON.stringify({branch,sha,message:'Freeze tested OSM public place snapshot (ODbL; isolated candidate only)',content:data.toString('base64')})});
            a(res.ok,'Snapshot commit failed HTTP '+res.status);
            console.log('TESTED_SNAPSHOT_COMMIT='+(await res.json()).commit.sha);
            console.log('No production deployment, Firestore access, user GPS export, or backend changes.');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
