name: QA Brighter Login Carousel Photos (No Deploy)
on:
  push:
    branches: [fix/live-login-carousel-photo-visibility-20261108]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout exact UI candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove only slideshow presentation changes
        shell: bash
        run: |
          test "$(git diff --name-status --no-renames f7bc8d12d8e926365175afb5288f2adf214025a5 HEAD -- app components)" = "$(printf 'M\tcomponents/auth/PremiumAuthShell.tsx')"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const src = fs.readFileSync('components/auth/PremiumAuthShell.tsx','utf8');
          assert(src.includes('rgba(4,38,32,0.18)'));
          assert(src.includes('rgba(0,38,31,0.70)'));
          assert(src.includes('resizeMode="cover"'));
          assert(src.includes('width: heroBounds.width'));
          assert(src.includes('textShadowColor'));
          console.log('PASS: brighter photos, original full-cover sizing, legible headline');
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and existing login/signup safeguards
        run: |
          npx tsc --noEmit --incremental false
          node scripts/test-login-field-validation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-route-entrypoints.cjs
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
      - name: Export Expo web without deploying
        run: |
          npx expo export --platform web --clear
          node scripts/verify-hosting-release.cjs
