name: Identity OCR unit tests (review only, no deploy)
on:
  pull_request:
    paths:
      - "identity-ai/document_screening.py"
      - "identity-ai/strict_document_screening.py"
      - "identity-ai/profile_consistency.py"
      - "identity-ai/test_document_screening.py"
      - "identity-ai/test_strict_document_screening.py"
      - "identity-ai/test_id_backscan_quality.py"
      - "identity-ai/test_profile_consistency.py"
      - "identity-ai/passport_mrz_shadow.py"
      - "identity-ai/test_passport_mrz_shadow.py"
      - "identity-ai/test_passport_mrz_integration.py"
      - "identity-ai/ICAO_PASSPORT_MRZ_QA.md"
      - "identity-ai/main.py"
      - "identity-ai/passive_pad_shadow.py"
      - "identity-ai/test_passive_pad_shadow.py"
      - "identity-ai/test_pad_shadow_decision_isolation.py"
      - "identity-ai/audit_minifasnet_onnx_synthetic.py"
      - "identity-ai/test_onnx_compatibility_synthetic.py"
      - "identity-ai/ONNX_COMPATIBILITY_AUDIT.md"
      - "identity-ai/yunet_shadow.py"
      - "identity-ai/test_yunet_shadow.py"
      - "identity-ai/sface_shadow.py"
      - "identity-ai/test_sface_shadow.py"
      - "identity-ai/download_sface_model.py"
      - "identity-ai/download_yunet_model.py"
      - "identity-ai/THIRD_PARTY_MODELS.md"
      - "identity-ai/licenses/YuNet-MIT.txt"
      - "identity-ai/evaluate_passive_pad_local.py"
      - "identity-ai/test_pad_local_eval.py"
      - "identity-ai/evaluate_pad_scales_local.py"
      - "identity-ai/test_pad_dual_scale_local_eval.py"
      - "identity-ai/run_pad_webcam_trials_local.py"
      - "identity-ai/test_pad_webcam_trials_local.py"
      - "identity-ai/PAD_WEBCAM_PILOT.md"
      - "identity-ai/PAD_REAL_DEVICE_DUAL_SCALE_QA.md"
      - "identity-ai/PAD_LOCAL_EVALUATION.md"
      - "identity-ai/download_passive_pad_model.py"
      - "identity-ai/Dockerfile"
      - "identity-ai/test_ai_route_contract.py"
      - "identity-ai/test_staging_health_contract.py"
      - "backend/identityAiReadiness.js"
      - "backend/test-identityAiReadiness.js"
      - "backend/test-identity-staging-admin-only.js"
      - "backend/test-staging-lab-auth-phase.cjs"
      - "backend/independentPadAttestation.js"
      - "backend/test-independentPadAttestation.cjs"
      - "backend/stagingProfileDiagnostics.js"
      - "backend/test-stagingProfileDiagnostics.js"
      - "backend/server.js"
      - "backend/firebaseAdmin.js"
      - "backend/stagingFirebaseIsolation.js"
      - "backend/scripts/check-staging-isolation.cjs"
      - "backend/test-stagingFirebaseIsolation.js"
      - "backend/selectedIdPolicy.js"
      - "backend/test-selectedIdPolicy.js"
      - "backend/test-id-backscan-quality.cjs"
      - "lib/identityVerification.ts"
      - "app/identity-verification.web.tsx"
      - "app/identity-verification.tsx"
      - "components/identity/DocumentScreeningSummary.tsx"
      - "lib/firebaseAuth.ts"
      - "app/signup.tsx"
      - "components/auth/EmailFirstSignup.tsx"
      - "firestore.rules"
      - "backend/test-identity-contract-staging.js"
      - "backend/test-firestore-dob-rules.js"
      - "backend/identityIssuerReviewPolicy.js"
      - "backend/test-identityIssuerReviewPolicy.js"
      - "backend/test-admin-passport-mrz-review.cjs"
      - "backend/test-admin-identity-flow-synthetic.cjs"
      - "app/(admin)/identity-reviews.tsx"
      - ".github/workflows/test-identity-ocr-no-deploy.yml"
permissions:
  contents: read
jobs:
  identity-ocr-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Screen current and staged ID document OCR
        env:
          PYTHONPATH: identity-ai
        run: |
          python -m unittest discover -s identity-ai -p 'test_document_screening.py' -v
          python -m unittest discover -s identity-ai -p 'test_strict_document_screening.py' -v
          python -m unittest discover -s identity-ai -p 'test_id_backscan_quality.py' -v
      - name: Test DOB and barangay consistency
        env:
          PYTHONPATH: identity-ai
        run: |
          python -m unittest discover -s identity-ai -p 'test_profile_consistency.py' -v
          python -m unittest discover -s identity-ai -p 'test_passport_mrz_shadow.py' -v
          python -m unittest discover -s identity-ai -p 'test_passport_mrz_integration.py' -v
          python -m py_compile identity-ai/passport_mrz_shadow.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Synthetic Python route-handler staging contract (no real photos, no network)
        env:
          PYTHONPATH: identity-ai
        run: python -m unittest discover -s identity-ai -p 'test_ai_route_contract.py' -v
      - name: Validate actual AI OCR/profile readiness health contract (synthetic only)
        run: python -m unittest discover -s identity-ai -p 'test_staging_health_contract.py' -v
      - name: Validate protected Python AI API syntax
        run: python -m py_compile identity-ai/main.py identity-ai/strict_document_screening.py identity-ai/profile_consistency.py
      - name: Unit-test experimental PAD (synthetic images only, NO MODEL DOWNLOAD)
        env:
          PYTHONPATH: identity-ai
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 opencv-contrib-python-headless==4.11.0.86
          python -m unittest discover -s identity-ai -p 'test_passive_pad_shadow.py' -v
          python -m unittest discover -s identity-ai -p 'test_pad_shadow_decision_isolation.py' -v
          python -m unittest discover -s identity-ai -p 'test_onnx_compatibility_synthetic.py' -v
          python -m unittest discover -s identity-ai -p 'test_yunet_shadow.py' -v
          python -m unittest discover -s identity-ai -p 'test_sface_shadow.py' -v
          python -m unittest discover -s identity-ai -p 'test_pad_local_eval.py' -v
          python -m unittest discover -s identity-ai -p 'test_pad_dual_scale_local_eval.py' -v
          python -m unittest discover -s identity-ai -p 'test_pad_webcam_trials_local.py' -v
          python -m py_compile identity-ai/run_pad_webcam_trials_local.py
          python -m py_compile identity-ai/evaluate_pad_scales_local.py
          python -m py_compile identity-ai/passive_pad_shadow.py identity-ai/download_passive_pad_model.py identity-ai/evaluate_passive_pad_local.py identity-ai/yunet_shadow.py identity-ai/download_yunet_model.py identity-ai/sface_shadow.py identity-ai/download_sface_model.py
      - name: Inspect actual pinned MiniFASNet ONNX graph and synthetic 0..255/0..1 responses (NO DEPLOY)
        env:
          PYTHONPATH: identity-ai
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir onnx==1.17.0
          python identity-ai/download_passive_pad_model.py
          python identity-ai/audit_minifasnet_onnx_synthetic.py
      - name: Validate Node identity gateway syntax and selected ID policy
        run: |
          node --check backend/server.js
          node --check backend/firebaseAdmin.js
          node --check backend/stagingFirebaseIsolation.js
          node --check backend/scripts/check-staging-isolation.cjs
          node --test backend/test-selectedIdPolicy.js
          node --test backend/test-id-backscan-quality.cjs
          node --test backend/test-identity-contract-staging.js
          node --test backend/test-firestore-dob-rules.js
          node --test backend/test-identityIssuerReviewPolicy.js
          node --test backend/test-admin-passport-mrz-review.cjs
          node --test backend/test-admin-identity-flow-synthetic.cjs
          node --test backend/test-stagingFirebaseIsolation.js
          node --test backend/test-identityAiReadiness.js
          node --test backend/test-identity-staging-admin-only.js
          node --test backend/test-staging-lab-auth-phase.cjs
          node --test backend/test-stagingProfileDiagnostics.js
          node --test backend/test-independentPadAttestation.cjs
      - name: Install frontend dependency lockfile (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend identity UI and API client
        run: npx tsc --noEmit
      - name: Confirm no deployment occurs in this workflow
        run: echo "NO DEPLOY - unit tests only"
