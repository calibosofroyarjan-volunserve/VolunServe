name: QA original selfie capture with preserved ID UI (NO DEPLOY)
on:
  push:
    branches: [fix/original-face-scan-on-identity-ui-20261125]
    paths:
      - 'app/identity-verification.web.tsx'
      - '.github/workflows/qa-original-face-scan-preserve-id-ui-20261125.yml'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original face-capture flow and unchanged ID precheck UI
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=fs.readFileSync('app/identity-verification.web.tsx','utf8');
          for(const snippet of [
            'Government ID Details','Front of National ID','Back of National ID',
            'Upload File','Check ID, then Face Scan',
            'precheckIdentityDocument({','await submitIdentityVerification({',
            'setSelfie({','void captureFrame();','setScanState("hold_still")',
            'if (heldFor >= 1400)','documentConsent',
          ]) assert(p.includes(snippet),'Missing original flow or preserved UI: '+snippet);
          for(const snippet of ['movementRef','movementCompleted','MovementCheck',
            'challenge_left','challenge_right','random sideways movement']) {
            assert(!p.includes(snippet),'Obsolete motion prompt still present: '+snippet);
          }
          assert(p.includes('It does not establish liveness or prevent spoofing.'));
          console.log('PASS: UI unchanged; OCR front/back -> one stable centered face -> selfie -> existing private AI comparison');
          NODE
  full-client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit --incremental false
      - run: npx expo export --platform web
