name: Original AI Native Lost-Response Recovery and Failed-Retry QA (NO DEPLOY)
on:
  push:
    branches:
      - qa/original-ai-native-submit-recovery-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-response-recovery:
    name: Original AI native camera-to-Admin recovery + no false Verified
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exactly one native candidate screen and two regression suites
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const path=require('node:path');
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const base='82d55847cfc766d56abd537db0714761cc132989';
            const cmp=await github.rest.repos.compareCommits({
              owner,repo,base,head:context.sha
            });
            assert.equal(cmp.data.behind_by,0,'Candidate may not lose earlier native review fix');
            assert.deepEqual((cmp.data.files||[]).map(x=>x.filename).sort(),[
              '.github/workflows/qa-original-ai-native-submit-recovery-20261125.yml',
              'app/identity-verification.tsx',
              'scripts/test-original-ai-native-submit-recovery-20261125.cjs'
            ].sort(),'No unexpected frontend/backend/hosting changes allowed');
            const pinned=[
              ['app/identity-verification.tsx',context.sha],
              ['app/identity-verification.web.tsx',base],
              ['lib/identityVerification.ts',base],
              ['scripts/test-original-ai-native-submit-recovery-20261125.cjs',context.sha],
              ['scripts/test-original-ai-native-review-no-face-20261125.cjs',base]
            ];
            for(const [filename,ref] of pinned){
              const {data}=await github.rest.repos.getContent({owner,repo,path:filename,ref});
              if(Array.isArray(data)||data.encoding!=='base64')
                throw Error('Pinned source missing '+filename);
              const target=path.join(process.env.GITHUB_WORKSPACE,'.qa-native',filename);
              fs.mkdirSync(path.dirname(target),{recursive:true});
              fs.writeFileSync(target,Buffer.from(data.content,'base64'));
              core.info('Read-only '+filename);
            }
            core.info('PASS: additive native submission recovery only, pre-existing Native review fix retained');
      - name: Install TypeScript transpiler only
        run: |
          npm install --prefix .qa-native --no-save --no-audit --no-fund --ignore-scripts typescript@5.9.3
          node --check .qa-native/scripts/test-original-ai-native-submit-recovery-20261125.cjs
          node --check .qa-native/scripts/test-original-ai-native-review-no-face-20261125.cjs
      - name: Verify Native TSX parses and execute actual response-handling closures
        working-directory: .qa-native
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const ts=require('./node_modules/typescript');
          const source=fs.readFileSync('app/identity-verification.tsx','utf8');
          const result=ts.transpileModule(source,{
            fileName:'app/identity-verification.tsx',
            compilerOptions:{
              jsx:ts.JsxEmit.ReactJSX,module:ts.ModuleKind.ESNext,
              target:ts.ScriptTarget.ES2022
            },reportDiagnostics:true
          });
          const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
          assert.deepEqual(errors.map(d=>ts.flattenDiagnosticMessageText(d.messageText,' ')),[]);
          assert.ok(result.outputText.includes('getIdentityVerificationStatus'));
          console.log('PASS: native TSX syntax transpile, native status recovery present');
          NODE
          node --test \
            scripts/test-original-ai-native-review-no-face-20261125.cjs \
            scripts/test-original-ai-native-submit-recovery-20261125.cjs
      - name: Confirm no staging/prod mutation
        run: |
          echo "PASS NO DEPLOY: one Native candidate screen + 2 test files; fake callbacks only; no accounts, cameras or media providers"
# No application deployment or merge. Tests are mocked closures, not physical
# camera verification or real-world same-person biometric accuracy.
