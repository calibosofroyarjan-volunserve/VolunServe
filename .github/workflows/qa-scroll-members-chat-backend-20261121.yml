name: QA Scrollable Members SelfKey and Mutual Chat Backend (NO DEPLOY)
on:
  push:
    branches: [fix/community-chat-consent-directory-20261121]
    paths:
      - backend/communitySocial.js
      - backend/test-communitySocial.js
      - .github/workflows/qa-scroll-members-chat-backend-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  community-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax verification
        run: |
          node --check backend/communitySocial.js
          node --check backend/test-communitySocial.js
      - name: Community members, private chat and presence regression tests
        run: node --test backend/test-communitySocial.js backend/test-communityPresence.js
      - name: Ensure production backend change scope is isolated
        run: |
          git fetch origin backend-live-protected --depth=1
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
            ['git','diff','--name-only','origin/backend-live-protected','HEAD'],text=True).splitlines())
          allowed={
            'backend/communitySocial.js',
            'backend/test-communitySocial.js',
            '.github/workflows/qa-scroll-members-chat-backend-20261121.yml'
          }
          assert changed and changed.issubset(allowed), repr(changed)
          print('PASS only community API and QA files changed')
          PY
