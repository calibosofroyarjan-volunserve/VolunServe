name: Validate Community Events and Donations announcements (no deploy)
on:
  push:
    branches:
      - fix/event-donation-published-to-announcements-20261115

permissions:
  contents: read

jobs:
  tests-and-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Announcements privacy, approval, and source contract
        run: |
          node scripts/test-module-announcements-publishing-20261115.cjs
          node scripts/test-emergency-announcement-advisory-link.cjs
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-community-events-rules.cjs
          node scripts/test-donation-lgu-role-isolation.cjs
          node scripts/test-pavia-admin-pagination-announcements.cjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Expo web export, no Hosting deployment
        run: npx expo export --platform web --clear
