name: Identity backend protected-release candidate (NO DEPLOY)

on:
  push:
    branches:
      - release/identity-backend-from-protected-20261111
    paths:
      - 'backend/**'
      - 'app/identity-verification.tsx'
      - 'app/identity-verification.web.tsx'
      - 'app/(admin)/identity-reviews.tsx'
      - 'lib/identityVerification.ts'
      - 'lib/firebase.ts'
      - 'scripts/test-staging-firebase-release-isolation.cjs'
      - 'scripts/test-identity-staging-endpoint-allowlist.cjs'
      - 'components/identity/DocumentScreeningSummary.tsx'
      - '.github/workflows/identity-backend-release-candidate-20261111.yml'
  pull_request:
    branches:
      - backend-live-protected
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    name: Node syntax, identity policy and production-boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse protected backend and identity helpers
        run: node --check backend/server.js && node --check backend/selectedIdPolicy.js && node --check backend/identityIssuerReviewPolicy.js
      - name: Run no-credential security regression tests
        run: node --test backend/test-selectedIdPolicy.js backend/test-identityIssuerReviewPolicy.js backend/test-protectedIdentityReleaseBoundary.js backend/test-frontBackCaptureContract.js

  web-and-mobile-types:
    name: Identity and existing app TypeScript compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify offline staging Firebase initialization cannot reuse production
        run: node --test scripts/test-staging-firebase-release-isolation.cjs scripts/test-identity-staging-endpoint-allowlist.cjs
      - run: npx tsc --noEmit --pretty false

  web-bundle:
    name: Browser bundle smoke test (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Synthetic no-deploy config: do not point any CI test at live identity API.
      EXPO_PUBLIC_VOLUNSERVE_ENV: staging
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://identity-bundle-smoke.invalid
      # Synthetic Firebase credentials for BUILD ONLY. No real or production access.
      EXPO_PUBLIC_FIREBASE_API_KEY: fake-ci-key-no-external-auth
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-identity-isolated.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-identity-isolated
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-identity-isolated.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export static web candidate without deployment
        run: npx expo export --platform web --output-dir /tmp/volunserve-identity-bundle-smoke
      - name: Verify bundle artifacts exist (never upload or publish)
        run: |
          test -d /tmp/volunserve-identity-bundle-smoke
          test -n "$(find /tmp/volunserve-identity-bundle-smoke -type f -name '*.js' -print -quit)"

  android-js-bundle:
    name: Android JavaScript bundle smoke test (NO APK / NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: staging
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://identity-bundle-smoke.invalid
      # Deliberately fake test project: no real-user Firebase access.
      EXPO_PUBLIC_FIREBASE_API_KEY: fake-ci-key-no-external-auth
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-identity-isolated.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-identity-isolated
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-identity-isolated.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export Android JS assets without native APK signing or deployment
        run: npx expo export --platform android --output-dir /tmp/volunserve-android-js-smoke
      - name: Confirm candidate Android JS exists
        run: |
          test -d /tmp/volunserve-android-js-smoke
          test -n "$(find /tmp/volunserve-android-js-smoke -type f -name '*.hbc' -o -name '*.js' | head -n 1)"
