name: Identity backend protected-release candidate (NO DEPLOY)

on:
  push:
    branches:
      - release/identity-backend-from-protected-20261111
    paths:
      - 'backend/**'
      - 'app/identity-verification.tsx'
      - 'app/identity-verification.web.tsx'
      - 'app/(admin)/identity-reviews.tsx'
      - 'lib/identityVerification.ts'
      - 'components/identity/DocumentScreeningSummary.tsx'
      - '.github/workflows/identity-backend-release-candidate-20261111.yml'
  pull_request:
    branches:
      - backend-live-protected
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    name: Node syntax, identity policy and production-boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse protected backend and identity helpers
        run: node --check backend/server.js && node --check backend/selectedIdPolicy.js && node --check backend/identityIssuerReviewPolicy.js
      - name: Run no-credential security regression tests
        run: node --test backend/test-selectedIdPolicy.js backend/test-identityIssuerReviewPolicy.js backend/test-protectedIdentityReleaseBoundary.js backend/test-frontBackCaptureContract.js

  web-and-mobile-types:
    name: Identity and existing app TypeScript compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --pretty false

  web-bundle:
    name: Browser bundle smoke test (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Synthetic no-deploy config: do not point any CI test at live identity API.
      EXPO_PUBLIC_VOLUNSERVE_ENV: staging
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://identity-bundle-smoke.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export static web candidate without deployment
        run: npx expo export --platform web --output-dir /tmp/volunserve-identity-bundle-smoke
      - name: Verify bundle artifacts exist (never upload or publish)
        run: |
          test -d /tmp/volunserve-identity-bundle-smoke
          test -n "$(find /tmp/volunserve-identity-bundle-smoke -type f -name '*.js' -print -quit)"
