name: Verify Fund Reconciliation Fix
on:
  push:
    branches: [fix/fund-release-campaign-reconciliation-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Backend test and syntax
        run: |
          node --check backend/server.js
          node --check backend/fundReleaseDemoRoutes.js
          node --test backend/tests/fundReleaseReconciliation.test.js
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Expo production web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo export --platform web --clear --max-workers 1
      - name: Verify output
        run: test -f dist/index.html
