name: Release Resident/Volunteer Desktop Header — Hosting ONLY
on:
  push:
    branches: [release/resident-volunteer-header-hosting-only-20261120]
    paths:
      - '.github/workflows/release-resident-volunteer-header-hosting-only-20261120.yml'
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  gated-hosting-release:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/release/resident-volunteer-header-hosting-only-20261120'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
      BASE_SHA: 1a9e206bdfea2167b205ce6eec168757323a8e9f
      SITE: volunserve-3aa5b
      BACKUP_CHANNEL: resident-header-before-20261120
      VOLUNSERVE_HOSTING_URL: https://volunserve.com
    steps:
      - name: Check out release candidate without submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: FAIL CLOSED if candidate includes unrelated changes or an untested UI source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          git diff --name-status --no-renames "$BASE_SHA" HEAD > /tmp/resident-release-changes.txt
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const allowed=new Set([
            'app/(tabs)/_layout.tsx',
            'components/layout/ResidentDesktopActions.tsx',
            'scripts/test-resident-volunteer-sidebar.cjs',
            'scripts/test-volunteer-donations-sidebar-removal.cjs',
            '.github/workflows/release-resident-volunteer-header-hosting-only-20261120.yml',
          ]);
          const rows=fs.readFileSync('/tmp/resident-release-changes.txt','utf8').trim().split('\n');
          const changed=new Set();
          for(const row of rows){
            const [kind,path]=row.split('\t');
            assert.ok(['A','M'].includes(kind),'BLOCKED destructive change '+row);
            assert.ok(allowed.has(path),'BLOCKED unrelated/outdated module '+path);
            changed.add(path);
          }
          assert.equal(changed.size,allowed.size,'BLOCKED unexpected change count');
          for(const path of allowed) assert.ok(changed.has(path),'BLOCKED missing scoped source '+path);
          const blob=path=>cp.execFileSync('git',['rev-parse','HEAD:'+path],{encoding:'utf8'}).trim();
          assert.equal(blob('app/(tabs)/_layout.tsx'),
            'e94a76ee99e0fbdb527e53a9f637d475fe0de529',
            'BLOCKED: shared Tabs layout no longer matches Chromium-tested source');
          assert.equal(blob('components/layout/ResidentDesktopActions.tsx'),
            '1d935433ae48416946ee2f29dd6b9088892d6cef',
            'BLOCKED: account header no longer matches Chromium-tested source');
          console.log('PASS: ONLY Chromium-tested header + two QA scripts + release workflow');
          NODE
          git diff --quiet "$BASE_SHA" HEAD -- \
            app/login.tsx app/signup.tsx app/_layout.tsx \
            lib/firebase.ts lib/firebaseAuth.ts lib/registrationEmailPolicy.ts \
            backend functions firestore.rules firestore.indexes.json storage.rules \
            firebase.json .firebaserc app.json package.json package-lock.json
          echo "PASS: no auth, backend, Firebase security policy, hosting config or dependency change"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm current production is STILL exact source baseline (READ ONLY)
        shell: bash
        run: |
          export VOLUNSERVE_EXPECTED_SHA="$BASE_SHA"
          node scripts/check-live-hosting.cjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check unaffected Resident, Volunteer, Profile and Map contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-resident-volunteer-sidebar.cjs
          node --test scripts/test-volunteer-donations-sidebar-removal.cjs
          node --test scripts/test-profile-certificates-account-menu.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
      - name: TypeScript validation
        run: npx tsc --noEmit --incremental false
      - name: Build Hosting-only static website
        shell: bash
        run: |
          set -euo pipefail
          npx expo export --platform web --clear
          node scripts/verify-hosting-release.cjs
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const marker=JSON.parse(fs.readFileSync('dist/volunserve-release.json','utf8'));
          assert.equal(marker.revision,process.env.GITHUB_SHA,'BLOCKED candidate build SHA mismatch');
          assert.equal(marker.firebaseProject,process.env.SITE,'BLOCKED wrong Firebase project');
          console.log('PASS static website revision matches release commit');
          NODE
      - name: Check production source again before obtaining deploy credentials
        shell: bash
        run: |
          export VOLUNSERVE_EXPECTED_SHA="$BASE_SHA"
          node scripts/check-live-hosting.cjs
      - name: Validate protected Hosting-only service credential
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SA" || { echo "::error::Missing production Hosting credential; aborted"; exit 1; }
          node <<'NODE'
          const fs=require('node:fs');
          const key=JSON.parse(process.env.FIREBASE_SA);
          if(key.type!=='service_account'||key.project_id!==process.env.SITE||!key.client_email||!key.private_key){
            throw Error('BLOCKED wrong production Hosting credentials');
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/resident-header-hosting-only-key.json',
            process.env.FIREBASE_SA,{mode:0o600});
          console.log('PASS correct Firebase Hosting project key (secret not logged)');
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/resident-header-hosting-only-key.json" >> "$GITHUB_ENV"
      - name: Recheck current live, clone backup, deploy ONLY Hosting, verify or ROLLBACK
        shell: bash
        run: |
          set -euo pipefail
          export VOLUNSERVE_EXPECTED_SHA="$BASE_SHA"
          node scripts/check-live-hosting.cjs
          npx firebase-tools hosting:clone "$SITE:live" "$SITE:$BACKUP_CHANNEL" \
            --project "$SITE" --non-interactive
          echo "PASS: current production Hosting backed up before release"
          # Explicitly Hosting ONLY: never deploy Auth, Firestore, Functions or backend.
          npx firebase-tools deploy --only hosting --project "$SITE" --non-interactive
          export VOLUNSERVE_EXPECTED_SHA="$GITHUB_SHA"
          VERIFIED=0
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then VERIFIED=1; break; fi
            sleep 12
          done
          if [ "$VERIFIED" != 1 ]; then
            echo "::error::Post-deploy Hosting check failed; restoring previous live Hosting backup"
            npx firebase-tools hosting:clone "$SITE:$BACKUP_CHANNEL" "$SITE:live" \
              --project "$SITE" --non-interactive || \
              echo "::error::Hosting rollback itself failed; manual restoration required"
            export VOLUNSERVE_EXPECTED_SHA="$BASE_SHA"
            node scripts/check-live-hosting.cjs || true
            exit 1
          fi
          echo "PASS: current volunserve.com serves exact release revision"
          echo "PASS: no Firebase rules, Functions, Render, login or signup changes"
