name: Isolated staging 002 offer expiry consistency - NO DEPLOY
on:
  pull_request:
    branches:
      - feat/emergency-auto-dispatch-server-staging-20261115
    paths:
      - "backend/staging002OfferDeadline.js"
      - "backend/stagingBulkVolunteerOffers.js"
      - "backend/staging002ExpiredBulkRetry.js"
      - "backend/stagingAdminLogin.html"
      - "backend/test-staging002OfferDeadline.cjs"
      - "backend/test-staging002ExpiredBulkRetry.cjs"
      - ".github/workflows/qa-staging-002-expiry-clock-consistency-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-expiry-diagnosis-and-guarded-bulk-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install staging backend locked dependencies
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Check staging-only syntax
        run: |
          node --check backend/staging002OfferDeadline.js
          node --check backend/stagingBulkVolunteerOffers.js
          node --check backend/staging002ExpiredBulkRetry.js
      - name: Test date conversion and protected bulk reissue
        run: |
          node --test backend/test-staging002OfferDeadline.cjs
          node --test backend/test-staging002ExpiredBulkRetry.cjs
      - name: Existing accepted-001/002 regression tests
        run: |
          node --test backend/test-stagingFreshEndToEnd.cjs
          node --test backend/test-staging002EligibilitySummary.cjs
      - name: Confirm no cloud activity or deploy
        run: echo "Synthetic fixtures only; no Firebase writes, credentials, or deployment."
