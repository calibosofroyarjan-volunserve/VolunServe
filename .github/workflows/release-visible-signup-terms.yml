name: Deploy Visible Terms Consent on Signup Step 1 (Hosting Only)
on:
  push:
    branches:
      - release/signup-visible-terms-step1-20261029
    paths:
      - .github/workflows/release-visible-signup-terms.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify mandatory Step 1 policy checkbox and signup regression
        run: |
          node scripts/test-signup-email-first-middle-optional.cjs
          npx tsc --noEmit --pretty false
      - name: Verify existing Emergency Reports flow
        run: node --test scripts/test-clean-emergency-report-header.cjs
      - name: Export Expo website for Firebase Hosting
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require Firebase Hosting credentials
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Firebase service account missing. No deploy attempted."
            exit 1
          fi
      - name: Deploy Firebase Hosting ONLY
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact custom-domain production revision
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Waiting for production custom-domain propagation attempt $attempt"
            sleep 10
          done
          echo "::error::Expected revision was not confirmed on volunserve.com"
          exit 1
