name: QA original face scan + government ID front/back UI (NO DEPLOY)
on:
  push:
    branches: ['integration/identity-original-face-ui-20261125']
    paths:
      - 'app/identity-verification.web.tsx'
      - 'identity-ai/**'
      - 'backend/server.js'
      - 'lib/identityVerification.ts'
      - 'lib/communitySocial.ts'
      - 'backend/test-community-social-environment.cjs'
      - 'backend/test-identity-emulator-auth-e2e.cjs'
      - 'backend/test-staging-identity-acceptance-e2e.cjs'
      - 'backend/identity-e2e-emulators.json'
      - 'components/layout/**'
      - '.github/workflows/qa-integrated-original-identity-ui-20261125.yml'
permissions:
  contents: read
jobs:
  guard-and-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unchanged visual controls and actual precheck route
        run: |
          node <<'NODE'
          const a=require("node:assert/strict"),fs=require("node:fs");
          const ui=fs.readFileSync("app/identity-verification.web.tsx","utf8");
          const api=fs.readFileSync("backend/server.js","utf8");
          const py=fs.readFileSync("identity-ai/main.py","utf8");
          const ids=fs.readFileSync("identity-ai/strict_document_screening.py","utf8");
          for(const marker of ["Government ID Details","Front of National ID","Back of National ID",
            "Check ID, then Face Scan","precheckIdentityDocument({","submitIdentityVerification({",
            "void captureFrame();","setSelfie({","setScanState(\"hold_still\")"]) {
            a(ui.includes(marker),"Missing UI/flow: "+marker);
          }
          for(const removed of ["movementRef","movementCompleted","challenge_left","challenge_right"]) {
            a(!ui.includes(removed),"Obsolete movement remains: "+removed);
          }
          a(api.includes('"/api/identity/document/precheck"'),"Backend ID precheck endpoint missing");
          a(py.includes('"/document/precheck"'),"AI OCR precheck endpoint missing");
          a(ids.includes('"school_id_not_supported"'),"School ID rejection missing");
          a(py.includes('"school_id_not_supported"'),"Python precheck missing school rejection handling");
          a(api.includes('"school_id_not_supported"'),"Backend precheck missing school rejection handling");
          console.log("PASS UI preserved, old face capture restored, OCR and School ID rejection routes present");
          NODE
      - name: Validate document type / school ID regression tests
        run: |
          python -m unittest discover -s identity-ai -p 'test_document_screening.py' -v
          python -m unittest discover -s identity-ai -p 'test_strict_document_screening.py' -v
          python -m py_compile identity-ai/main.py identity-ai/document_screening.py identity-ai/strict_document_screening.py
          node --check backend/server.js
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Confirm restored chat header cannot leak staging credentials to production
        run: node --test backend/test-community-social-environment.cjs
      - run: npx tsc --noEmit --incremental false
      - run: npx expo export --platform web

  isolated-auth-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-volunserve-identity-e2e
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked isolated test SDKs without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Assert no cloud Firebase targets or production media uploads
        run: |
          test "$GCLOUD_PROJECT" = "demo-volunserve-identity-e2e"
          grep -Fq 'const STAGING_IDENTITY_MEDIA_UPLOADS_ENABLED = false' backend/server.js
          node --check backend/test-identity-emulator-auth-e2e.cjs
          node --check backend/server.js
      - name: Authenticated synthetic Resident to Admin via local Firebase emulators
        run: |
          npx --no-install firebase emulators:exec \
            --config backend/identity-e2e-emulators.json \
            --only auth,firestore \
            --project demo-volunserve-identity-e2e \
            "node --test backend/test-identity-emulator-auth-e2e.cjs"
      - name: Test status, rejection, approval and attempts against actual route code
        run: |
          node --test backend/test-staging-identity-acceptance-e2e.cjs
          node --test backend/test-staging-admin-review-ui-contract.cjs
          node --test backend/test-identity-media-capability-preflight.cjs
      - name: Explain limits and forbid deployment
        run: |
          echo "NO DEPLOY; only fabricated identity records in ephemeral Firebase Auth/Firestore emulators."
          echo "A passing test does not prove hosted service integration, ID authenticity, anti-spoofing, or automatic Verified Resident."
