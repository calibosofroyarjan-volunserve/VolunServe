# Legacy community-event Firestore rules RELEASE frozen on default branch.
# The rules-validation tests can be run locally; cloud rules must not auto-deploy.
# Old workflow copies on other branches still require GitHub UI disabling.
name: "[FROZEN] validate-community-events-permissions.yml - no production Firestore rules deployment"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permanently-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy production rules deploy blocked pending explicit reviewed release."
