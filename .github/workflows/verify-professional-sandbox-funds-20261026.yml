name: VolunServe Final Defense Integration CI

on:
  push:
    branches:
      - main
      - feat/professional-sandbox-payout-20261026
      - fix/sjdm-strict-map-boundary-20261028
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Node syntax
        run: |
          node --check backend/server.js
          node --check backend/lguStaffFaceScreening.js
          node --check backend/lguStaffLiveness.js
          node --check backend/lguStaffDocumentScreening.js
          node --check backend/lguStaffPrivacy.js
          node --check backend/fundReleaseDemoRoutes.js
          node --check functions/index.js
      - name: Identity AI Python syntax (offline, no provider calls)
        run: python -m py_compile identity-ai/main.py identity-ai/lgu_id_ocr.py identity-ai/test_lgu_id_ocr.py identity-ai/firebase_admin_config.py
      - name: Philippine National ID, passport, drivers license and rejected school ID OCR heuristics (synthetic)
        run: python -m unittest discover -s identity-ai -p 'test_lgu_id_ocr.py'
      - name: Super Admin-only front/back government ID OCR screening (mock integration)
        run: node --test scripts/test-lgu-staff-document-screening.cjs
      - name: LGU staff withdrawal, evidence purge and privacy audit (synthetic-only)
        run: node --test scripts/test-lgu-staff-privacy.cjs
      - name: Donation reconciliation and sandbox release tests
        run: node --test backend/tests/fundReleaseReconciliation.test.js
      - name: Install Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Premium responsive Resident and LGU login UI regression
        run: node scripts/test-premium-auth-portal.cjs
      - name: Verify role-specific Admin/Super Admin overview KPI, audit and workflows
        run: node scripts/test-dashboard-overviews.cjs
      - name: Final Admin navigation, names, workflow ordering and privilege gates
        run: node scripts/test-admin-navigation-contract.cjs
      - name: Final Super Admin / LGU Admin scope and role boundary checks
        run: node scripts/test-final-admin-scope.cjs
      - name: Staff login tabs, pending applications and Super Admin gate
        run: node scripts/test-admin-staff-login.cjs
      - name: LGU staff government ID intake, private evidence and pagination contract
        run: node scripts/test-lgu-applicant-private-evidence.cjs
      - name: LGU Admin credential security (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-lgu-admin-rules.cjs"
      - name: LGU applicant government ID, privacy and manual-review metadata rules (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-lgu-applicant-evidence-rules.cjs"
      - name: LGU staff private AI face screening security regression (offline)
        run: node scripts/test-lgu-staff-face-screening.cjs
      - name: AWS active liveness session security (mocked provider, no AWS credentials)
        run: node --test scripts/test-lgu-staff-liveness.cjs
      - name: AWS browser liveness protocol and score-free UI contract
        run: node --test scripts/test-lgu-liveness-web-contract.cjs
      - name: Build official AWS liveness React camera detector (no cloud credentials)
        run: |
          npm --prefix backend/liveness-web install --no-audit --no-fund
          npm --prefix backend/liveness-web run build
      - name: Mock private LGU staff facial screen, role access and forced manual review
        run: node --test scripts/test-lgu-staff-face-screening-integration.cjs
      - name: LGU staff government-ID and facial-photo private Storage access (Firestore+Storage emulators)
        run: npx firebase emulators:exec --only firestore,storage --project demo-volunserve "node scripts/test-lgu-applicant-storage-rules.cjs"
      - name: Donation financial records only for LGU Admin (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-donation-lgu-role-isolation.cjs"
      - name: Ensure local VolunServe backup folders are excluded from TypeScript
        run: node scripts/test-typescript-backup-excludes.cjs
      - name: Verify Admin and Community Events navigation routes
        run: node scripts/test-route-entrypoints.cjs
      - name: Audit static Expo Router links across application
        run: node scripts/audit-static-navigation.cjs
      - name: Verify LGU grouped navigation retains all modules
        run: node scripts/test-lgu-admin-navigation-groups.cjs
      - name: Verify LGU Overview chart and Admin Profile
        run: node scripts/test-admin-overview-ui.cjs
      - name: Live Emergency GPS and shelter permissions (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-live-emergency-map-rules.cjs"
      - name: Community Events proposal, LGU approval and attendance (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-community-events-rules.cjs"
      - name: Event organizer GPS privacy after mode switch (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-community-organizer-gps-cleanup.cjs"
      - name: SJDM polygon boundary and LGU facility safety contracts
        run: node --test scripts/test-sjdm-live-map-contract.cjs
      - name: LGU facility admin management and verified pin access contracts
        run: node --test scripts/test-sjdm-facility-admin-contract.cjs
      - name: LGU facilities and evacuation centers Admin-only publication (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-sjdm-facility-rules.cjs"
      - name: Real Firebase LGU office and shelter live-update events (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-sjdm-live-firebase-subscriptions.cjs"
      - name: Community event road maps and shelter usability
        run: node scripts/test-event-map-route-ux.cjs
      - name: Resident Community Event pin picker UX
        run: node scripts/test-event-pin-picker.cjs
      - name: Check Expo JSX / VS Code TypeScript project
        run: node scripts/test-vscode-typescript-jsx.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Expo Android JavaScript bundle (not APK)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo export --platform android --clear --max-workers 1
      - name: Expo web production export
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo export --platform web --clear --max-workers 1
      - name: Verify exported remock routes and stamp revision (NO DEPLOY)
        run: node scripts/verify-hosting-release.cjs
      - name: Probe live VolunServe Hosting (informational, read-only)
        continue-on-error: true
        run: node scripts/check-live-hosting.cjs
