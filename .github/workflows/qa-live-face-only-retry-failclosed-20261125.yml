name: Original Face-Only Failed Similarity Retry Regression (NO DEPLOY)
on:
  push:
    branches: [qa/live-face-only-retry-failclosed-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  face-only-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No other production module, OCR route or Cloudinary file can change
        uses: actions/github-script@v7
        with:
          script: |
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const base='4308ff0eef985dcd0777c96906e61540bb9d7fd2';
            const r=await github.rest.repos.compareCommits({owner,repo,base,head:context.sha});
            assert.equal(r.data.behind_by,0,'Node QA retry must be based on current live Node commit');
            assert.deepEqual((r.data.files||[]).map(x=>x.filename).sort(),[
              '.github/workflows/qa-live-face-only-retry-failclosed-20261125.yml',
              'backend/server.js',
              'backend/test-live-face-only-retry-20261125.cjs',
            ].sort(),'Only isolated face-only retry bug and no-deploy tests may change');
            const get=async(ref,path)=>{
              const v=await github.rest.repos.getContent({owner,repo,ref,path});
              return Buffer.from(v.data.content,'base64').toString('utf8');
            };
            const [old,newFile]=await Promise.all([
              get(base,'backend/server.js'),
              get(context.sha,'backend/server.js')
            ]);
            const change=()=>x=>x.replace(
              /const decision = faceOnly[\s\S]*?const reviewTrack =/,
              'const decision = <RETRY_GATE>;\n      const reviewTrack ='
            ).replace(
              /const resultMessage = faceOnly[\s\S]*?: reviewTrack === "blurry_id_review"/,
              'const resultMessage = <RETRY_MESSAGE>\n          : reviewTrack === "blurry_id_review"'
            );
            assert.equal(change()(old),change()(newFile),
              'Unexpected server.js changes beyond face-only retry gate/messages');
            core.info('PASS: only exact retry decision/message changed; OCR/Admin/Cloudinary untouched');
      - name: Execute 7 original face-only fail-closed retry tests offline
        run: |
          node --check backend/server.js
          node --check backend/test-live-face-only-retry-20261125.cjs
          node --test backend/test-live-face-only-retry-20261125.cjs
      - name: No live deployment or Resident data
        run: |
          echo 'NO DEPLOY: no Firebase/Cloudinary/Render API calls; no real ID or resident credentials'
