name: Auto Volunteer Phase 4 LOCAL Firestore Emulator race tests - NO DEPLOY
on:
  pull_request:
    branches:
      - feat/auto-volunteer-phase3-atomic-decision-simulation-20261119
    paths:
      - "backend/test-autoVolunteerFirestoreEmulator.cjs"
      - "docs/emergency-volunteer/PHASE4_FIRESTORE_EMULATOR_CONCURRENCY_20261119.md"
      - ".github/workflows/qa-auto-volunteer-phase4-emulator-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-firestore-emulator-concurrency-with-known-manual-no-go:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-volunserve-auto-phase4
      GOOGLE_CLOUD_PROJECT: demo-volunserve-auto-phase4
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict Phase 4 test-only change allowlist
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/auto-volunteer-phase3-atomic-decision-simulation-20261119
          git diff --name-only origin/feat/auto-volunteer-phase3-atomic-decision-simulation-20261119 HEAD > /tmp/phase4-diff
          OTHER="$(grep -Ev '^(backend/test-autoVolunteerFirestoreEmulator\.cjs|docs/emergency-volunteer/PHASE4_FIRESTORE_EMULATOR_CONCURRENCY_20261119\.md|\.github/workflows/qa-auto-volunteer-phase4-emulator-20261119\.yml)$' /tmp/phase4-diff || true)"
          test -z "$OTHER" || { echo "BLOCKED: unexpected live runtime change"; printf '%s\n' "$OTHER"; exit 1; }
          echo "PASS: exactly test, documentation, CI; NO runtime changes."
      - name: Install locked Firebase emulator tooling and backend deps
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Syntax checks and existing Phase 3 policy simulations
        run: |
          node --check backend/test-autoVolunteerFirestoreEmulator.cjs
          node --test backend/test-autoVolunteerAtomicDecisionPolicy.cjs
      - name: Real local Firestore emulator transactions (test project only)
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo "BLOCKED: credentials must not exist"; exit 1; }
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only firestore "node --test --test-concurrency=1 backend/test-autoVolunteerFirestoreEmulator.cjs"
      - name: Preserve Phase 1 and 2 offline tests and existing backend regressions
        run: |
          node --test backend/test-emergencyAutoVolunteerReadOnlyPlanner.cjs
          node --test backend/test-autoVolunteerAdminReadOnlyPreview.cjs
          npm run check --prefix backend
      - name: Explicit no-deploy and known P0 incompatibility notice
        run: |
          test ! -f backend/autoVolunteerProductionWriteAdapter.js
          echo "KNOWN P0 BUG: current manual Admin offer may overwrite accepted automatic winner."
          echo "NO GO FOR LIVE DISPATCH. NO FIREBASE/RENDER/HOSTING DEPLOY."
