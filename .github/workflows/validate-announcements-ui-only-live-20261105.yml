name: Verify UI-Only Announcements Against Actual Live Rules + Preview (No Live Deploy)
on:
  push:
    branches: [feature/announcements-ui-only-verified-live-20261105]
permissions:
  contents: read
concurrency:
  group: volunserve-announcements-ui-preview
  cancel-in-progress: false
jobs:
  verify-ui-and-live-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify protected source files are completely unchanged
        env:
          LIVE_BASE: 579bed559b1ba81e2045ba420847f8635e8f182c
        run: |
          git merge-base --is-ancestor "$LIVE_BASE" HEAD
          git diff --name-only "$LIVE_BASE" HEAD > "$RUNNER_TEMP/changes.txt"
          node - <<'NODE'
          const fs=require('node:fs');
          const files=fs.readFileSync(process.env.RUNNER_TEMP+'/changes.txt','utf8').split('\n').filter(Boolean);
          const allowed=new Set([
            'components/home/Home.web.tsx','components/home/Home.native.tsx',
            'app/(tabs)/notifications.tsx','app/(tabs)/announcements.tsx',
            'lib/useCommunityAnnouncements.ts','scripts/test-live-announcement-ui-compat.cjs',
            '.github/workflows/validate-announcements-ui-only-live-20261105.yml'
          ]);
          const illegal=files.filter(x=>!allowed.has(x));
          if(illegal.length)throw Error('Protected application or Rules files changed: '+illegal.join(','));
          console.log('PASS: Login, Signup, Super Admin, Admin, Auth, Firestore Rules and other modules unchanged.');
          NODE
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript compile
        run: npx tsc --noEmit --pretty false
      - name: Build production web assets without deployment
        run: npx expo export --platform web
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: volunserve-3aa5b
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read current deployed Firestore Ruleset (no modification)
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True).strip()
          base='https://firebaserules.googleapis.com/v1/'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=20) as response:return json.load(response)
          release=get('projects/volunserve-3aa5b/releases/cloud.firestore')
          rules=get(release['rulesetName'])
          files=rules.get('source',{}).get('files',[])
          candidates=[x for x in files if x.get('name','').endswith('firestore.rules')]
          if not candidates and len(files)==1:candidates=files
          if len(candidates)!=1:raise Exception('Actual deployed Firestore Rules not identifiable')
          with open(os.environ['RUNNER_TEMP']+'/actual-live-firestore.rules','w') as output:
              output.write(candidates[0]['content'])
          print('Read ACTIVE Cloud Ruleset for emulator only: '+release['rulesetName'])
          PY
      - name: Test scoped and old client queries against ACTUAL live Firestore Rules (emulator only)
        run: |
          LIVE_FIRESTORE_RULES_FILE="$RUNNER_TEMP/actual-live-firestore.rules" npx firebase emulators:exec --only firestore --project demo-volunserve 'node scripts/test-live-announcement-ui-compat.cjs'
      - name: Verify live website revision is still the source for this branch
        env:
          EXPECTED_SHA: 579bed559b1ba81e2045ba420847f8635e8f182c
        run: |
          node - <<'NODE'
          (async()=>{
            const response=await fetch('https://volunserve.com/volunserve-release.json?read_only='+Date.now(),{headers:{'cache-control':'no-cache'}});
            if(!response.ok)throw Error('Live revision check returned '+response.status);
            const json=await response.json();
            if(json.revision!==process.env.EXPECTED_SHA)throw Error('Live Hosting has changed! STOP: '+json.revision);
            console.log('PASS: live Hosting still serves exact base revision '+json.revision);
          })().catch(error=>{console.error(error.message);process.exit(1);});
          NODE
  build-isolated-preview:
    needs: verify-ui-and-live-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Web-only export for isolated Hosting preview
        run: npx expo export --platform web
      - name: Stamp exact candidate SHA and deployed base
        env:
          LIVE_BASE: 579bed559b1ba81e2045ba420847f8635e8f182c
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('dist/volunserve-preview.json',JSON.stringify({
            revision:process.env.GITHUB_SHA,
            basedOnLive:process.env.LIVE_BASE,
            scope:'announcements-ui-only',
            noProductionRulesChanges:true
          }));
          NODE
      - name: Deploy PREVIEW channel only (never Hosting live)
        id: isolated-preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: announcements-livebased-20261105
          expires: 1d
      - name: Confirm the release boundary
        run: |
          echo 'Only temporary Hosting preview was deployed. LIVE Hosting, Auth, Firestore Rules, Functions and production data were not modified.'
