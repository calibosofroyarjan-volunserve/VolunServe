name: Smoke Test Hosted Consolidated Four-Role VolunServe (No Production)
on:
  push:
    branches: [design/consolidated-four-role-desktop-mobile-20261107]
permissions:
  contents: read
jobs:
  smoke-hosted-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Fetch exact reviewed source without submodules
        run: |
          set -euo pipefail
          mkdir source && cd source
          git init
          git remote add origin https://github.com/calibosofroyarjan-volunserve/VolunServe.git
          git fetch --depth=1 --no-recurse-submodules origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated headless-browser driver only
        run: |
          set -euo pipefail
          mkdir -p /tmp/volunserve-preview-browser
          cd /tmp/volunserve-preview-browser
          npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund playwright-core
      - name: Check all deployed role routes, layout widths and actual browser clicks
        working-directory: source
        env:
          NODE_PATH: /tmp/volunserve-preview-browser/node_modules
          VS_BROWSER_ORIGIN: https://volunserve-consolidated-pc-mobile-review.onrender.com
        run: |
          set -euo pipefail
          node scripts/test-four-role-browser-layout-20261107.cjs
      - name: Attach live-hosted browser QA screenshots (sample data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-consolidated-four-role-pc-mobile-screenshots
          path: source/reports/visual-screenshots/
          if-no-files-found: warn
          retention-days: 7
