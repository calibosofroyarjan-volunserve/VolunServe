name: Smoke Test Hosted Consolidated Four-Role VolunServe (No Production)
on:
  push:
    branches: [design/consolidated-four-role-desktop-mobile-20261107]
permissions: {}
jobs:
  smoke-hosted-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the new public Render preview URLs serve isolated pages
        run: |
          node <<'NODE'
          const assert=require("node:assert/strict");
          const cp=require("node:child_process");
          const base="https://volunserve-consolidated-pc-mobile-review.onrender.com";
          const routes=[
            "/public/preview?role=resident&module=home",
            "/public/preview?role=volunteer&module=emergency-tasks",
            "/public/preview?role=admin&module=command-center",
            "/public/preview?role=superadmin&module=overview",
            "/public/design-review",
          ];
          async function check(url) {
            for(let i=1;i<=4;i++){
              try{
                const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(18000)});
                const body=await r.text();
                assert(r.url.startsWith(base),"Preview redirected to an unexpected host");
                assert.equal(r.status,200,"No HTTP 200 from "+url);
                assert((r.headers.get("content-type")||"").includes("html"),"Expected HTML");
                assert(body.toLowerCase().includes("<html"),"Missing Expo web document");
                return;
              }catch(e){if(i===4)throw e;console.log("Retry public preview",i,e.message);}
            }
          }
          (async()=>{
            for(const route of routes){await check(base+route);console.log("PASS public URL "+route);}
            const chrome=cp.execFileSync("bash",["-lc","command -v google-chrome || command -v chromium || command -v chromium-browser"],{encoding:"utf8"}).trim().split("\n")[0];
            for(const [route,label] of [
              ["/public/preview?role=admin&module=command-center","Workflow and records"],
              ["/public/preview?role=superadmin&module=overview","System Overview"],
            ]){
              let matched=false, last="";
              for(let attempt=1;attempt<=3;attempt++){
                const doc=cp.execFileSync(chrome,["--headless=new","--no-sandbox","--disable-gpu",
                  "--disable-dev-shm-usage","--disable-background-networking","--virtual-time-budget=16000",
                  "--dump-dom",base+route],{encoding:"utf8",timeout:70000,maxBuffer:15*1024*1024,
                  stdio:["ignore","pipe","ignore"]});
                matched=doc.includes(label)&&!/<input[^>]+type=["']password["']/i.test(doc);
                last="attempt "+attempt+" htmlBytes="+doc.length+" label="+doc.includes(label);
                if(matched)break;
              }
              assert(matched,"Hosted preview did not hydrate isolated "+route+" "+last);
              console.log("PASS hydrated UI "+route+" "+label);
            }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
