name: Offline Hybrid Identity Demo Source Gate (NO DEPLOY)
on:
  pull_request:
    branches:
      - release/staging-hybrid-web-baseline-20261114
    paths:
      - 'demos/volunserve-hybrid-identity-offline.html'
      - 'demos/test-hybrid-identity-offline.cjs'
      - 'demos/README-hybrid-identity-offline.md'
      - '.github/workflows/test-offline-hybrid-identity-demo-no-deploy.yml'
permissions:
  contents: read
jobs:
  fictional-offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load immutable PR source archive without repository submodules
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          curl -fLsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/$SOURCE_SHA" \
            -o /tmp/hybrid-offline-demo.zip
          mkdir -p "$RUNNER_TEMP/hybrid-offline-source"
          unzip -q /tmp/hybrid-offline-demo.zip -d "$RUNNER_TEMP/hybrid-offline-source"
          ROOT="$(find "$RUNNER_TEMP/hybrid-offline-source" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$ROOT/demos/test-hybrid-identity-offline.cjs"
          cp -a "$ROOT/." "$GITHUB_WORKSPACE/"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local-only fictional flow and JavaScript syntax
        run: node --test demos/test-hybrid-identity-offline.cjs
      - name: Confirm no deploy, Firebase requests or real ID data
        run: echo 'NO_DEPLOY_NO_FIREBASE_AUTH_NO_REAL_IDENTITIES'
