name: Auto Volunteer Phase 10 LOCAL Admin Volunteer App E2E - NO DEPLOY
on:
  pull_request:
    branches:
      - qa/auto-volunteer-phase9-safe-cancel-auth-emulator-20261119
    paths:
      - "backend/autoVolunteerPhase10LocalApp.js"
      - "backend/phase10LocalAdmin.html"
      - "backend/phase10LocalVolunteer.html"
      - "backend/test-autoVolunteerPhase10LocalAppE2E.cjs"
      - "docs/emergency-volunteer/PHASE10_LOCAL_STAGING_APP_INTEGRATION_20261119.md"
      - ".github/workflows/qa-auto-volunteer-phase10-app-e2e-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-local-admin-volunteer-app-auth-emulator-no-deploy:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-volunserve-auto-phase4
      GOOGLE_CLOUD_PROJECT: demo-volunserve-auto-phase4
      VOLUNSERVE_AUTO_VOLUNTEER_PHASE6_EMULATOR_WRITE: enabled
      VOLUNSERVE_AUTO_VOLUNTEER_DISPATCH: disabled
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Exact six-file scope (never modify live or existing staging)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin qa/auto-volunteer-phase9-safe-cancel-auth-emulator-20261119
          git diff --name-only origin/qa/auto-volunteer-phase9-safe-cancel-auth-emulator-20261119 HEAD > /tmp/phase10-files
          while IFS= read -r f; do
            case "$f" in
              "backend/autoVolunteerPhase10LocalApp.js"|"backend/phase10LocalAdmin.html"|"backend/phase10LocalVolunteer.html"|"backend/test-autoVolunteerPhase10LocalAppE2E.cjs"|"docs/emergency-volunteer/PHASE10_LOCAL_STAGING_APP_INTEGRATION_20261119.md"|".github/workflows/qa-auto-volunteer-phase10-app-e2e-20261119.yml") ;;
              *) echo "BLOCKED: unexpected file changed: $f"; exit 1 ;;
            esac
          done < /tmp/phase10-files
          echo "PASS: only six new local test/review/UI files. No live server or staging fixture changed."
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Phase 10 source syntax and safe release exclusion
        run: |
          node --check backend/autoVolunteerPhase10LocalApp.js
          node --check backend/test-autoVolunteerPhase10LocalAppE2E.cjs
          if grep -Fq 'autoVolunteerPhase10LocalApp' backend/server.js; then
            echo "BLOCKED: local QA app must NEVER be loaded by deployed live server"
            exit 1
          fi
          if grep -Fq 'autoVolunteerPhase10LocalApp' backend/emergencyAutoDispatchStagingServer.js; then
            echo "BLOCKED: accepted staging app must remain untouched"
            exit 1
          fi
      - name: Real local Auth + Firestore Emulator HTTP Admin/Volunteer integration
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo "BLOCKED: Firebase service credentials present"; exit 1; }
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" || { echo "BLOCKED: real cloud credentials present"; exit 1; }
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only auth,firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase10LocalAppE2E.cjs"
      - name: Preserve Phase 9 real Auth cancellation tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only auth,firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase9AuthCancelEmulator.cjs"
      - name: Preserve Phase 8-4 Firestore emulator regressions
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase8PendingSchedulerEmulator.cjs backend/test-autoVolunteerPhase7WaveEmulator.cjs backend/test-autoVolunteerPhase6DecisionEmulator.cjs backend/test-autoVolunteerFirestoreEmulator.cjs backend/test-autoVolunteerPhase5CompatEmulator.cjs backend/test-autoVolunteerPhase5RulesEmulator.cjs"
      - name: Planner, Auth preview, shared guard and live backend regressions
        run: |
          node --test backend/test-emergencyVolunteerWinnerGuard.cjs
          node --test backend/test-emergencyAutoVolunteerReadOnlyPlanner.cjs
          node --test backend/test-autoVolunteerAdminReadOnlyPreview.cjs
          node --test backend/test-autoVolunteerAtomicDecisionPolicy.cjs
          npm run check --prefix backend
      - name: No cloud staging or production deployment
        run: |
          echo "LOCAL HTTP QA ONLY. NO Render service/release modification."
          echo "NO Firebase live/staging rules/accounts/accepted Volunteer task reset."
          echo "NO durable autonomous production scheduler or real emergency dispatch."
