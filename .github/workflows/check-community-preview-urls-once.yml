name: Read-Only VolunServe Login and Signup Preview Smoke Check
on:
  push:
    branches:
      - feature/community-updates-notifications-20261105
    paths:
      - ".github/workflows/check-community-preview-urls-once.yml"

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact preview deployment and public routing (read-only)
        shell: bash
        env:
          PREVIEW_URL: https://volunserve-3aa5b--community-updates-preview-20261105-vd9i8kag.web.app
          EXPECTED_SHA: da48c35b271d32d3057b8b4129d66da4525a9429
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 "$PREVIEW_URL/volunserve-preview.json" -o /tmp/preview-info.json
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const data = require("/tmp/preview-info.json");
          assert.equal(data.sha, process.env.EXPECTED_SHA, "Preview build revision mismatch");
          assert.equal(data.scope, "community-updates-preview");
          assert.equal(data.project, "volunserve-3aa5b");
          console.log("PASS: published exact preview commit " + data.sha);
          NODE
          for page in login signup admin-login admin-request; do
            code=$(curl --location --silent --show-error --max-time 30 -o "/tmp/preview-$page.html" -w '%{http_code}' "$PREVIEW_URL/$page")
            if [ "$code" != "200" ]; then
              echo "::error::Preview route /$page returned HTTP $code"
              exit 1
            fi
            test -s "/tmp/preview-$page.html"
            echo "PASS: /$page returns HTTP 200 with content"
          done
          echo 'This checks public route availability only, not successful authentication or Firestore access.'
