name: Verify Resident Sidebar Vertical Spacing
on:
  push:
    branches: [style/raise-resident-sidebar-modules-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Expo web production export
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo export --platform web --clear --max-workers 1
      - run: test -f dist/index.html
