name: Verify VolunServe Live Identity AI and Backend Health
on:
  push:
    branches:
      - release/identity-hosting-publish-20261030
    paths:
      - .github/workflows/verify-live-identity-api-20261030.yml
permissions:
  contents: write
jobs:
  live-identity-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check live AI readiness, Node configuration and anonymous access isolation
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function probe(url, opts={}, attempts=4) {
            let last;
            for (let i=0; i<attempts; i++) {
              try {
                const res = await fetch(url,{redirect:'error',signal:AbortSignal.timeout(35000),...opts});
                if (res.status >= 500) {last=Error(url+' HTTP '+res.status);await sleep(5000);continue;}
                return res;
              } catch(e) {last=e;await sleep(5000);}
            }
            throw last||Error('Endpoint unavailable');
          }
          (async()=>{
            const ai=await probe('https://volunserve-identity-ai.onrender.com/health');
            assert.equal(ai.status,200,'AI health must return HTTP 200');
            const a=await ai.json();
            assert.equal(a.ok,true);
            assert.equal(a.verificationEngineReady,true,'FaceMesh must be available');
            assert.equal(a.internalAuthConfigured,true,'Private AI key must be configured');
            assert.equal(a.idDocumentScreeningImplemented,true,'ID OCR screening must be activated');
            assert.equal(a.idDocumentAuthenticityVerified,false,'No unsupported authenticity claims');
            console.log('PASS AI: OCR ready, FaceMesh available, private key configured');

            const node=await probe('https://volunserve.onrender.com/health');
            assert.equal(node.status,200,'Node health must return HTTP 200');
            const b=await node.json();
            assert.equal(b.ok,true);
            assert.equal(b.identityEngine,'volunserve_ai_configured','Node AI URL must be configured');
            console.log('PASS Node backend: identity AI endpoint configured');

            const admin=await probe('https://volunserve.onrender.com/api/admin/identity/reviews');
            assert.ok([401,403].includes(admin.status),'Anonymous user must not read identity reviews: HTTP '+admin.status);
            console.log('PASS admin identity reviews reject anonymous requests');

            const submit=await probe('https://volunserve.onrender.com/api/identity/verify',{method:'POST'});
            assert.ok([401,403].includes(submit.status),'Anonymous user must not submit verification: HTTP '+submit.status);
            console.log('PASS identity verification rejects anonymous submissions');

            console.log('PASS public health & auth-boundary smoke. Authenticated ID/selfie/Admin case not tested.');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1;});
          NODE
      - name: Save auditable runtime smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('/tmp/identity-live-api.json',JSON.stringify({
            app:'VolunServe',runId:process.env.GITHUB_RUN_ID,
            status:process.env.OUTCOME,completedAt:new Date().toISOString(),
            release:'f3e2a46cbf766ed8ff8516b6eadbc8b219b611b1',
            scope:'Unauthenticated public health and API authorization boundaries only'
          },null,2)+'\n');
          NODE
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/deployment-receipts/identity-live-api-20261030.json" \
            -f message="ci: record live identity API smoke result" \
            -f branch="release/identity-hosting-publish-20261030" \
            -f content="$(base64 -w0 /tmp/identity-live-api.json)"
