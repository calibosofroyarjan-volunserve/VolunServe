name: READ ONLY Check Current Live Announcement Compatibility
on:
  push:
    branches: [audit/live-base-announcement-20261105]
    paths: [".github/workflows/audit-announcements-current-live-20261105.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: volunserve-3aa5b
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read live Hosting and actual active Firestore policy without writes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,urllib.request,re
          url='https://volunserve.com/volunserve-release.json?audit=20261105'
          with urllib.request.urlopen(url,timeout=25) as response: live=json.load(response)
          print('LIVE_HOSTING_REVISION='+str(live.get('revision','UNKNOWN')))
          print('LIVE_BUILD_TIMESTAMP='+str(live.get('builtAt','UNKNOWN')))
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True).strip()
          base='https://firebaserules.googleapis.com/v1/'
          def get(p):
              req=urllib.request.Request(base+p,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=20) as response:return json.load(response)
          release=get('projects/volunserve-3aa5b/releases/cloud.firestore')
          rules=get(release['rulesetName'])
          files=rules.get('source',{}).get('files',[])
          candidates=[x for x in files if x.get('name','').endswith('firestore.rules')]
          if not candidates and len(files)==1:candidates=files
          if len(candidates)!=1:raise Exception('Unable to identify the current rule source')
          rulesText=candidates[0]['content']
          start=rulesText.find('match /announcements/{announcementId}')
          end=rulesText.find('match /',start+10)
          if start<0:raise Exception('No announcements rule is installed')
          announcement=rulesText[start:end]
          print('ACTUAL_RULESET_NAME='+release['rulesetName'])
          print('ACTUAL_RULESET_SHA256='+hashlib.sha256(rulesText.encode()).hexdigest())
          print('ANNOUNCEMENTS_BLOCK_START')
          print(announcement[:4100])
          print('ANNOUNCEMENTS_BLOCK_END')
          print('LIVE_ANNOUNCEMENT_READ_MATCHES_ANY_APPROVED=' + str('approved()' in announcement and 'resource.data.publishAt <= request.time' in announcement and 'resource.data.audience' not in announcement.split('allow create:')[0]))
          PY
      - name: Read status of exact composite index (no writes)
        shell: bash
        run: |
          gcloud firestore indexes composite list --project=volunserve-3aa5b --database='(default)' --format=json > /tmp/live-indexes.json
          node - <<'NODE'
          const fs=require('node:fs');
          const indexes=JSON.parse(fs.readFileSync('/tmp/live-indexes.json','utf8'));
          const candidates=indexes.filter(index=>{
            const group=index.collectionGroup || String(index.name||'').match(/\/collectionGroups\/([^/]+)\/indexes\//)?.[1];
            const f=(index.fields||[]).filter(x=>x.fieldPath!=='__name__');
            return group==='announcements'&&index.queryScope==='COLLECTION'&&f.length===2&&
              f[0].fieldPath==='audience'&&f[0].order==='ASCENDING'&&
              f[1].fieldPath==='publishAt'&&f[1].order==='DESCENDING';
          });
          console.log('EXACT_ANNOUNCEMENT_INDEX_COUNT='+candidates.length);
          console.log('EXACT_ANNOUNCEMENT_INDEX_STATUS='+(candidates[0]?.state||'MISSING'));
          if(candidates.length!==1||candidates[0].state!=='READY')process.exitCode=1;
          NODE
