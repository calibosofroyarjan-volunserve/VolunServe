name: Compare Deployed Firestore Security Rules Differences (Read Only)
on:
  push:
    branches: [release/lgu-pending-approve-reject-ui-20261105]
    paths: [.github/workflows/compare-current-live-rules-20261105.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compare actual live rules with historical audited source - no writes
        shell: bash
        run: |
          python3 - <<'PY'
          import difflib,json,subprocess,urllib.request,hashlib
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True).strip()
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          base='https://firebaserules.googleapis.com/v1/'
          release=get(base+'projects/volunserve-3aa5b/releases/cloud.firestore')
          live=get(base+release['rulesetName'])
          documents=live['source']['files']
          existing=max(documents,key=lambda x:len(x.get('content','')))['content']
          historical=subprocess.check_output(['git','show','4520b201c9f6e86f810d2b7c3c1377c158ac424e:firestore.rules'],text=True)
          print('LIVE_RULES_BYTES',len(existing),'BASE_RULES_BYTES',len(historical))
          print('LIVE_RULES_SHA256',hashlib.sha256(existing.encode()).hexdigest())
          print('BASE_RULES_SHA256',hashlib.sha256(historical.encode()).hexdigest())
          normalized=lambda v:'\n'.join(x.rstrip() for x in v.replace('\r\n','\n').splitlines()).strip()
          print('WHITESPACE_NORMALIZED_EQUAL',normalized(existing)==normalized(historical))
          edits=list(difflib.unified_diff(historical.splitlines(),existing.splitlines(),fromfile='REPO_BASE',tofile='DEPLOYED_LIVE',n=3))
          print('CHANGED_LINES',len(edits),'HUNKS',len([x for x in edits if x.startswith('@@')]))
          print('DIFF_START')
          for line in edits[:165]:print(line[:350])
          if len(edits)>165:print('... Remaining diff lines omitted for safety and brevity.')
          print('DIFF_END')
          print('READ ONLY: nothing changed in Firebase or GitHub source')
          PY
