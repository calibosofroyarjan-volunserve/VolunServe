# TEMPORARY UI PREVIEW ONLY. NEVER DEPLOY TO FIREBASE HOSTING :live.
name: Assistance UI Preview Only (NEVER LIVE)
on:
  push:
    branches:
      - qa/assistance-ui-preview-only-20261120
    paths:
      - .github/workflows/qa-assistance-preview-only-20261120.yml
permissions:
  contents: read
concurrency:
  group: volunserve-assistance-visual-preview-20261120
  cancel-in-progress: false
jobs:
  preview-only:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/qa/assistance-ui-preview-only-20261120'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
      PROJECT: volunserve-3aa5b
      REVIEWED_SHA: d160fbdfdad3a4a2cf1aeec50b04c14effa91598
      LIVE_SHA: d89b225b98500e7b4fbffd8424ce9296aea4d2cc
      PREVIEW_CHANNEL: assistance-ui-review-20261120
    steps:
      - name: Checkout isolated preview controller with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fail-closed exact UI source, no other module, and production marker preflight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const ref=process.env.GITHUB_REF;
          assert.equal(ref,'refs/heads/qa/assistance-ui-preview-only-20261120','Not QA preview ref');
          assert.notEqual(process.env.PREVIEW_CHANNEL,'live','Never deploy to live');
          const path='app/(admin)/assistance-requests.tsx';
          const fileBlob=git('rev-parse','HEAD:'+path);
          const reviewedBlob=git('rev-parse',process.env.REVIEWED_SHA+':'+path);
          assert.equal(fileBlob,reviewedBlob,'Preview file changed since reviewed UI PR #687');
          const change=git('diff','--name-only',process.env.LIVE_SHA,'HEAD').split('\n').filter(Boolean).sort();
          assert.deepEqual(change.sort(),[
            '.github/workflows/qa-assistance-preview-only-20261120.yml',
            path,
          ].sort(),'Unreviewed files in QA preview');
          (async()=>{
            const res=await fetch('https://volunserve.com/volunserve-release.json?preview_pre='+Date.now(),{
              headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            assert(res.ok,'Cannot confirm production marker');
            const marker=await res.json();
            assert.equal(marker.app,'VolunServe');
            assert.equal(marker.firebaseProject,process.env.PROJECT);
            assert.equal(marker.revision,process.env.LIVE_SHA,'Production changed; abort preview');
            console.log('PASS: production unchanged, one reviewed Assistance Requests UI file, preview only');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and web export, no production deployment
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --incremental false
          npx expo export --platform web --clear
          GITHUB_SHA="$REVIEWED_SHA" node scripts/verify-hosting-release.cjs
      - name: Restrict credential to intended Firebase Hosting project
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SA" || { echo 'No Hosting secret, no preview deployment'; exit 1; }
          node <<'NODE'
          const assert=require('node:assert/strict');
          const data=JSON.parse(process.env.FIREBASE_SA);
          assert.equal(data.project_id,process.env.PROJECT,'Wrong Firebase project');
          assert.equal(data.type,'service_account');
          NODE
          umask 077
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/preview-only-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/preview-only-sa.json" >> "$GITHUB_ENV"
      - name: Deploy dedicated temporary Hosting preview channel ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "$PREVIEW_CHANNEL" = assistance-ui-review-20261120
          test "$PREVIEW_CHANNEL" != live
          npx firebase-tools hosting:channel:deploy "$PREVIEW_CHANNEL" --expires 3d --project "$PROJECT" --non-interactive
      - name: Verify live Hosting still has the previous exact revision
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const res=await fetch('https://volunserve.com/volunserve-release.json?preview_post='+Date.now(),{
              headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            assert(res.ok);
            const marker=await res.json();
            assert.equal(marker.revision,process.env.LIVE_SHA,'Production marker changed unexpectedly');
            console.log('PASS: Preview channel only. volunserve.com remains unchanged.');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
