name: Original AI Restored Web + Native Camera Behavior QA (NO DEPLOY)
on:
  push:
    branches:
      - qa/original-ai-live-parity-20261125
    paths:
      - scripts/qa-original-ai-web-native-camera-contract-20261125.cjs
      - .github/workflows/qa-original-ai-web-native-camera-no-deploy-20261125.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-native-camera:
    name: Published web camera + restored native camera/precheck workflow
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact live/restored frontend snapshots and test harness without checkout
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const path=require('node:path');
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const hosting='5af28d279618dacd5eab518e5e0d52259eae8844';
            const nativeFix='82d55847cfc766d56abd537db0714761cc132989';
            const pinned=[
              ['app/identity-verification.web.tsx',hosting],
              ['app/identity-verification.tsx',nativeFix],
              ['lib/identityVerification.ts',hosting],
              ['scripts/test-identity-camera-cancellation.cjs',hosting],
              ['scripts/test-original-ai-native-review-no-face-20261125.cjs',nativeFix],
              ['scripts/qa-original-ai-web-native-camera-contract-20261125.cjs',context.sha]
            ];
            const ciBase='25dc4d93438ed86c246122f83870e70217b4cf65';
            const diff=await github.rest.repos.compareCommits({owner,repo,base:ciBase,head:context.sha});
            assert.equal(diff.data.behind_by,0,'QA must not lose previous real Node+Python pass');
            const allowed=[
              'scripts/qa-original-ai-web-native-camera-contract-20261125.cjs',
              '.github/workflows/qa-original-ai-web-native-camera-no-deploy-20261125.yml'
            ];
            assert.deepEqual((diff.data.files||[]).map(f=>f.filename).sort(),allowed.sort(),
              'QA branch changed an application file or an unapproved path');
            for(const [filename,ref] of pinned){
              const {data}=await github.rest.repos.getContent({owner,repo,path:filename,ref});
              if(Array.isArray(data)||data.encoding!=='base64')throw Error('Pinned frontend missing '+filename);
              const target=path.join(process.env.GITHUB_WORKSPACE,'.qa-ui',filename);
              fs.mkdirSync(path.dirname(target),{recursive:true});
              fs.writeFileSync(target,Buffer.from(data.content,'base64'));
              core.info('Read-only frontend/test file '+filename+' @ '+ref.slice(0,10));
            }
            core.info('PASS: exact published Web/Client + tested native candidate, only two QA files changed');
      - name: Install isolated TypeScript transpiler (no frontend build/deploy)
        run: |
          npm install --prefix .qa-ui --no-save --no-audit --no-fund --ignore-scripts typescript@5.9.3
          for f in .qa-ui/scripts/*.cjs; do node --check "$f"; done
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const ts=require('./.qa-ui/node_modules/typescript');
          for(const name of ['identity-verification.tsx','identity-verification.web.tsx']){
            const filename='.qa-ui/app/'+name;
            const t=ts.transpileModule(fs.readFileSync(filename,'utf8'),{
              fileName:filename,
              compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},
              reportDiagnostics:true
            });
            const errors=(t.diagnostics||[]).filter(v=>v.category===ts.DiagnosticCategory.Error);
            assert.deepEqual(errors.map(v=>ts.flattenDiagnosticMessageText(v.messageText,' ')),[]);
            console.log('PASS: TSX syntax transpilation: '+name);
          }
          NODE
      - name: Execute actual Web camera + Native precheck/photo action closures
        working-directory: .qa-ui
        run: |
          node --test \
            scripts/test-identity-camera-cancellation.cjs \
            scripts/test-original-ai-native-review-no-face-20261125.cjs \
            scripts/qa-original-ai-web-native-camera-contract-20261125.cjs
      - name: Confirm no privileged or real media operations
        run: |
          echo "PASS NO DEPLOY: simulated cameras and consent decisions only, 0 real images, 0 Firebase, 0 Render or Cloudinary calls"
# TESTING LIMIT: Runs event-handling closures with mocked camera APIs.
# Does not validate actual Android permissions/hardware nor real biometric match.
