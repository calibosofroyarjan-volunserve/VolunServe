name: Validate Simplified Assistance Live-Source Candidate (NO DEPLOY)
on:
  pull_request:
    branches:
      - baseline/verified-hosting-b208-20261119
    paths:
      - 'app/(admin)/assistance-requests.tsx'
      - 'scripts/test-assistance-live-clean-flow-20261119.cjs'
      - '.github/workflows/validate-assistance-live-clean-flow-20261119.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npx tsc --noEmit --incremental false
      - name: Validate Assistance Requests redesign
        run: node scripts/test-assistance-live-clean-flow-20261119.cjs
      - name: Existing LGU static regression checks
        run: node scripts/test-lgu-internal-review-ux.cjs
      # The donation role-isolation integration test must only run with
      # FIRESTORE_EMULATOR_HOST configured in a separate emulator job.
      # It intentionally refuses to run against production Firestore.
