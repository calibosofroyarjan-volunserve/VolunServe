name: Auto Volunteer Phase 17 DEFENSE EVIDENCE - LOCAL QA ONLY, NO DEPLOY
on:
  pull_request:
    branches:
      - review/auto-volunteer-phase16-render-managed-oidc-compat-20261119
    paths:
      - "scripts/check-auto-volunteer-phase17-defense-readiness.cjs"
      - "docs/emergency-volunteer/PHASE17_DEFENSE_READINESS_AND_RELEASE_GATES_20261119.md"
      - ".github/workflows/qa-auto-volunteer-phase17-defense-evidence-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  defense-proof-with-release-no-go:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-volunserve-auto-phase4
      GOOGLE_CLOUD_PROJECT: demo-volunserve-auto-phase4
      VOLUNSERVE_AUTO_VOLUNTEER_PHASE6_EMULATOR_WRITE: enabled
      VOLUNSERVE_AUTO_VOLUNTEER_DISPATCH: disabled
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Scope guard — exactly three review/evidence files only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin review/auto-volunteer-phase16-render-managed-oidc-compat-20261119
          git diff --name-status origin/review/auto-volunteer-phase16-render-managed-oidc-compat-20261119 HEAD > /tmp/phase17-diff
          while IFS="$(printf '\t')" read -r status filename; do
            test "$status" = A || { echo "BLOCKED: modified original runtime file: $filename"; exit 1; }
            case "$filename" in
              "scripts/check-auto-volunteer-phase17-defense-readiness.cjs"|"docs/emergency-volunteer/PHASE17_DEFENSE_READINESS_AND_RELEASE_GATES_20261119.md"|".github/workflows/qa-auto-volunteer-phase17-defense-evidence-20261119.yml") ;;
              *) echo "BLOCKED: not defense evidence file: $filename"; exit 1 ;;
            esac
          done < /tmp/phase17-diff
          test "$(wc -l < /tmp/phase17-diff)" -eq 3
          echo "PASS: only 3 additive audit, documentation and CI files."
      - name: No Firebase project credentials permitted
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${GOOGLE_CLOUD_KEYFILE_JSON:-}"
          echo "PASS: no cloud service account or ADC credential in runner."
      - name: Install locked dependencies for local emulator E2E only
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Confirm explicit launch NO-GO and complete source evidence
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/check-auto-volunteer-phase17-defense-readiness.cjs
          node scripts/check-auto-volunteer-phase17-defense-readiness.cjs > /tmp/phase17.json
          node - <<'NODE'
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const result=JSON.parse(fs.readFileSync("/tmp/phase17.json","utf8"));
          assert.equal(result.sourceAuditPassed,true,
            JSON.stringify(result.sourceAuditFailures));
          assert.equal(result.verdict,"NO_GO_FOR_PRODUCTION_AUTOMATIC_DISPATCH");
          assert.equal(result.productionDeploymentAuthorized,false);
          assert.equal(result.liveAutomaticVolunteerEnabledByThisPhase,false);
          assert.equal(result.managed24HourSchedulerDeployed,false);
          assert.equal(result.realCloudAuthVerified,false);
          console.log("PASS: local evidence reviewed; production automatic dispatch NO-GO");
          NODE
      - name: Auth+Firestore Emulator — signed Admin/Volunteer full local HTTP E2E
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only auth,firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase10LocalAppE2E.cjs"
      - name: Auth+Firestore Emulator — Admin cancellation and Accept race E2E
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only auth,firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase9AuthCancelEmulator.cjs"
      - name: Firestore Emulator — all prior winning responder and Rules regressions
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase8PendingSchedulerEmulator.cjs backend/test-autoVolunteerPhase7WaveEmulator.cjs backend/test-autoVolunteerPhase6DecisionEmulator.cjs backend/test-autoVolunteerFirestoreEmulator.cjs backend/test-autoVolunteerPhase5CompatEmulator.cjs backend/test-autoVolunteerPhase5RulesEmulator.cjs"
      - name: Cloud safety and SDK offline reviews — no cloud access
        shell: bash
        run: |
          set -euo pipefail
          for file in             backend/test-autoVolunteerPhase16RenderManagedOidcGate.cjs             backend/test-autoVolunteerPhase15RenderOidcIamPreflight.cjs             backend/test-autoVolunteerPhase14StagingServer.cjs             backend/test-autoVolunteerPhase13ReadOnlyCloudBootstrap.cjs             backend/test-autoVolunteerPhase12CloudPreviewAdapter.cjs             backend/test-autoVolunteerPhase11CloudIsolationGate.cjs             backend/test-autoVolunteerAdminReadOnlyPreview.cjs             backend/test-emergencyAutoVolunteerReadOnlyPlanner.cjs             backend/test-emergencyVolunteerWinnerGuard.cjs             backend/test-autoVolunteerAtomicDecisionPolicy.cjs; do
            node --test --test-concurrency=1 "$file"
          done
      - name: Existing live backend identity, signup and certificates regressions
        run: npm run check --prefix backend
      - name: Definitive evidence classification — NO DEPLOY
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const r=JSON.parse(require("node:fs").readFileSync("/tmp/phase17.json","utf8"));
          if(r.productionDeploymentAuthorized!==false||
            r.verdict!=="NO_GO_FOR_PRODUCTION_AUTOMATIC_DISPATCH")
              process.exit(1);
          console.log("LOCAL EMULATOR E2E PASSED (if all prior steps green).");
          console.log("LIVE AUTOMATIC DISPATCH NOT TESTED OR ACTIVATED.");
          console.log("NO real cloud identity, Render deployment, Firebase writes, accepted staging reset or 24/7 scheduler.");
          NODE
