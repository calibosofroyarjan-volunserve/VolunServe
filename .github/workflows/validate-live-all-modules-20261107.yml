name: Validate All-Module VolunServe UI Review (No Deploy)
on:
  push:
    branches: [fix/live-module-controls-consistency-20261107]
  pull_request:
    branches: [design/live-verified-ui-20261107]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      VERIFIED_LIVE_SOURCE_SHA: e83f4a72c7cb733ff7bb888a6ac19bf3c0f076c4
    steps:
      - name: Fetch review branch and exact previous live commit without running submodule checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          git -C source init
          git -C source remote add origin https://github.com/calibosofroyarjan-volunserve/VolunServe.git
          git -C source fetch --no-recurse-submodules --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          git -C source fetch --no-recurse-submodules --depth=1 origin "$VERIFIED_LIVE_SOURCE_SHA"
          git -C source cat-file -e "$VERIFIED_LIVE_SOURCE_SHA^{commit}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install exact locked dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Inventory every role module and clickable control
        working-directory: source
        run: node scripts/audit-volunserve-module-controls-20261107.cjs
      - name: Publish downloadable static audit (not production data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volunserve-module-ui-audit
          path: source/reports/volunserve-ui-controls-inventory.*
          if-no-files-found: warn
      - name: Enforce UI-only diff from verified live build
        working-directory: source
        run: node scripts/test-live-first-ui-only-20261107.cjs
      - name: Shared button/form and existing server-action guardrails
        working-directory: source
        run: |
          node scripts/test-live-controls-consistency-20261107.cjs
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-admin-response-workspace-ux.cjs
          node scripts/test-admin-compact-workspace-ux.cjs
          node scripts/test-admin-people-verification-premium-ui.cjs
          node scripts/test-admin-navigation-contract.cjs
          node --test scripts/test-resident-volunteer-sidebar.cjs
          node --test scripts/test-volunteer-donations-sidebar-removal.cjs
          node --test scripts/test-profile-certificates-account-menu.cjs
      - name: TypeScript full app typecheck
        working-directory: source
        run: npx tsc --noEmit --pretty false
      - name: Web browser build only, never deploy
        working-directory: source
        run: npx expo export --platform web
