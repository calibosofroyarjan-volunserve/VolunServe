name: Original AI Face-Only Web UI Typecheck (NO DEPLOY)
on:
  push:
    branches:
      - qa/restore-20261023-face-only-web-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  face-only-web:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact published Hosting source and only face-only web files differ
        uses: actions/github-script@v7
        with:
          script: |
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const base='5af28d279618dacd5eab518e5e0d52259eae8844';
            const r=await github.rest.repos.compareCommits({owner,repo,base,head:context.sha});
            assert.equal(r.data.behind_by,0);
            assert.deepEqual((r.data.files||[]).map(x=>x.filename).sort(),[
              '.github/workflows/qa-original-face-only-web-20261125.yml',
              'app/identity-verification.web.tsx',
              'app/(admin)/identity-reviews.tsx',
              'lib/identityVerification.ts',
            ].sort());
            const original=await github.rest.repos.getContent({owner,repo,path:'app/identity-verification.web.tsx',ref:base});
            const candidate=await github.rest.repos.getContent({owner,repo,path:'app/identity-verification.web.tsx',ref:context.sha});
            const read=x=>Buffer.from(x.data.content,'base64').toString('utf8');
            const styleTail=s=>s.slice(s.lastIndexOf('const styles = StyleSheet.create('));
            assert.ok(styleTail(read(original)).startsWith('const styles = StyleSheet.create('));
            assert.equal(styleTail(read(candidate)),styleTail(read(original)),
              'Same design required: identity page styles must be byte-for-byte unchanged');
            core.info('PASS: original published layout CSS/styles fully preserved, no redesign');
      - name: Check original and OCR UI remain distinct, default opt-in disabled
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const ui=fs.readFileSync('app/identity-verification.web.tsx','utf8');
          const api=fs.readFileSync('lib/identityVerification.ts','utf8');
          const admin=fs.readFileSync('app/(admin)/identity-reviews.tsx','utf8');
          assert.ok(ui.includes('EXPO_PUBLIC_VOLUNSERVE_ORIGINAL_FACE_ONLY === "true"'));
          assert.ok(ui.includes('if (FACE_ONLY_MODE) {'));
          assert.ok(ui.includes('...(idType === "passport" ? [] : ['));
          assert.ok(ui.includes('Front of National ID'));
          assert.ok(ui.includes('Back of National ID'));
          assert.ok(ui.includes('Optional for face comparison'));
          assert.ok(ui.includes('idCaptureGridDesktop'));
          assert.ok(ui.includes('Open Camera'));
          assert.ok(ui.includes('Upload File'));
          assert.ok(ui.includes('Government ID Details'));
          assert.ok(ui.includes('!FACE_ONLY_MODE && movementRef.current.stage'));
          assert.ok(ui.includes('Continue to Face Scan'));
          assert.ok(ui.includes('No OCR') || ui.includes('no OCR'));
          assert.ok(ui.includes('precheckIdentityDocument('));
          assert.ok(api.includes('/api/identity/verify-face-only'));
          assert.ok(api.includes('/api/identity/verify-with-evidence'));
          assert.ok(api.includes('options.faceOnly === true'));
          assert.ok(admin.includes('volunserve_ai_face_only'));
          assert.ok(admin.includes('eligibleFaceOnly'));
          assert.ok(admin.includes('issuerReviewAttested'));
          assert.ok(admin.includes('item.evidenceAvailable === true'));
          console.log('PASS: screenshot layout retained (both ID cards); original face-only skips OCR and does NOT require back scan; old flow preserved');
          JS
      - name: Compile TypeScript without deploying or using credentials
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit --pretty false
      - name: Preserve live unchanged
        run: echo 'PASS NO DEPLOY - no Firebase Hosting deploy, no production backend, no Cloudinary uploads'
