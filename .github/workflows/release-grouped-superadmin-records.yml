name: Release Grouped Super Admin System Records (Hosting Only)
on:
  push:
    branches:
      - release/restore-grouped-superadmin-records-20261029
    paths:
      - .github/workflows/release-grouped-superadmin-records.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Safety regression gate for records, signup, maps and password reset forms
        run: |
          node scripts/test-superadmin-grouped-records.cjs
          node scripts/test-superadmin-settings-records-retention.cjs
          node scripts/test-superadmin-premium-restoration.cjs
          node scripts/test-dashboard-overviews.cjs
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-final-admin-scope.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-password-reset-popup.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-live-emergency-map-rules.cjs
          node --test scripts/test-login-ui-release.cjs
          npx tsc --noEmit --pretty false
      - name: Build production Expo website and release marker
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require Firebase Hosting credentials
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Firebase service account; no production deploy attempted"
            exit 1
          fi
      - name: Deploy Firebase Hosting ONLY, not Firestore Functions or rules
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact revision on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Waiting for exact production revision, attempt $attempt"
            sleep 10
          done
          echo "::error::Live domain did not confirm the expected grouped records release"
          exit 1
