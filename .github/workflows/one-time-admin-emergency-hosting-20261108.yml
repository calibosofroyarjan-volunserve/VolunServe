# One-time isolated Hosting release of the approved Admin Emergency Reports UI.
# Trigger is a protected-branch merge adding this exact file; no input can select other code.
# Never deploy latest protected source, main, backend, Firebase rules or functions.
name: ONE-TIME Admin Emergency Reports UI (isolated Hosting release)
on:
  push:
    branches: [live-protected]
    paths:
      - '.github/workflows/one-time-admin-emergency-hosting-20261108.yml'
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  isolated-hosting-release:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/live-protected'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      BASE_SHA: 'cf3e3f41e66dbcba9419b448cefc26e0485da4e3'
      UI_SHA: '6ebd3b6fba3c3d0c9088cda1c5a59da764414058'
      RELEASE_FILE: '.github/workflows/one-time-admin-emergency-hosting-20261108.yml'
      APPROVED_APP_FILE: 'app/(admin)/admin-cases.tsx'
    steps:
      - name: Checkout current protected live branch for fail-closed review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify approved one-time trigger and live baseline BEFORE checkout
        shell: bash
        run: |
          node scripts/guard-live-protected-release.cjs --self-test
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const git = (...args) => cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const { BASE_SHA, UI_SHA, RELEASE_FILE, APPROVED_APP_FILE } = process.env;
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const sha = x => /^[a-f0-9]{40}$/.test(x || '');
          async function run() {
            assert.equal(process.env.GITHUB_REF,'refs/heads/live-protected');
            assert.equal(process.env.GITHUB_REPOSITORY,'calibosofroyarjan-volunserve/VolunServe');
            assert(sha(event.before)&&sha(process.env.GITHUB_SHA)&&sha(BASE_SHA)&&sha(UI_SHA));
            assert.equal(git('rev-parse','HEAD'),process.env.GITHUB_SHA);
            const remote=git('ls-remote','--heads','origin','live-protected').split(/\s+/)[0];
            assert.equal(remote,process.env.GITHUB_SHA,'BLOCKED: protected branch moved');
            git('merge-base','--is-ancestor',event.before,process.env.GITHUB_SHA);
            const delta=git('diff','--name-status','--no-renames',event.before,process.env.GITHUB_SHA);
            assert.equal(delta,'A\t'+RELEASE_FILE,'BLOCKED: trigger push contains other changes');
            assert.equal(git('rev-parse',BASE_SHA),BASE_SHA);
            assert.equal(git('rev-parse',UI_SHA),UI_SHA);
            git('merge-base','--is-ancestor',BASE_SHA,UI_SHA);
            const appDelta=git('diff','--name-status','--no-renames',BASE_SHA,UI_SHA);
            assert.equal(appDelta,'M\t'+APPROVED_APP_FILE,'BLOCKED: candidate has unapproved changes');
            const resp=await fetch('https://volunserve.com/volunserve-release.json',{
              headers:{'Cache-Control':'no-cache','Accept':'application/json'},
              signal:AbortSignal.timeout(12000),redirect:'error'
            });
            assert(resp.ok,'BLOCKED: cannot read live marker');
            const live=await resp.json();
            assert.equal(live.app,'VolunServe');
            assert.equal(live.firebaseProject,'volunserve-3aa5b');
            assert.equal(live.revision,BASE_SHA,'BLOCKED: production changed; no publish');
            console.log('PASS: isolated UI-only candidate; exact old live baseline; protected release branch; single approved trigger');
          }
          run().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE

      - name: Checkout PINNED isolated UI candidate, never protected backlog
        uses: actions/checkout@v4
        with:
          ref: 6ebd3b6fba3c3d0c9088cda1c5a59da764414058
          fetch-depth: 0
          submodules: false

      - name: Re-verify single changed application file after isolated checkout
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),process.env.UI_SHA);
          git('merge-base','--is-ancestor',process.env.BASE_SHA,process.env.UI_SHA);
          assert.equal(git('diff','--name-status','--no-renames',process.env.BASE_SHA,process.env.UI_SHA),
            'M\t'+process.env.APPROVED_APP_FILE);
          console.log('PASS: only approved Emergency Reports UI diff in deployed source');
          NODE

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and cross-role UI regression checks
        run: |
          npx tsc --noEmit --incremental false
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs

      - name: Export and validate isolated web bundle with exact candidate revision
        shell: bash
        run: |
          npx expo export --platform web --clear
          env -u GITHUB_SHA node scripts/verify-hosting-release.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const marker=JSON.parse(fs.readFileSync('dist/volunserve-release.json','utf8'));
          assert.equal(marker.revision,process.env.UI_SHA,'BLOCKED: wrong artifact revision');
          console.log('PASS: dist fingerprint matches isolated UI commit');
          NODE

      - name: Final fail-closed production check immediately BEFORE Hosting publish
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          async function run(){
            assert.equal(git('rev-parse','HEAD'),process.env.UI_SHA);
            const remote=git('ls-remote','--heads','origin','live-protected').split(/\s+/)[0];
            assert.equal(remote,process.env.GITHUB_SHA,'BLOCKED: newer protected branch already exists');
            const res=await fetch('https://volunserve.com/volunserve-release.json',{
              headers:{'Cache-Control':'no-cache','Accept':'application/json'},
              signal:AbortSignal.timeout(12000),redirect:'error'});
            assert(res.ok);
            const marker=await res.json();
            assert.equal(marker.app,'VolunServe');
            assert.equal(marker.firebaseProject,'volunserve-3aa5b');
            assert.equal(marker.revision,process.env.BASE_SHA,
              'BLOCKED: production drifted from baseline; no publishing');
            console.log('PASS: production still exact authorized baseline');
          }
          run().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE

      - name: Require production environment ONLY Hosting credential
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::No production environment Hosting credential"
            exit 1
          fi

      - name: Publish Firebase Hosting ONLY (never database, rules, functions, backend)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live

      - name: Verify production serves exact isolated Admin UI candidate
        shell: bash
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: 6ebd3b6fba3c3d0c9088cda1c5a59da764414058
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Production did not serve isolated UI candidate SHA"
          exit 1
