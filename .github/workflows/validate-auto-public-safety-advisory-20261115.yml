name: Validate automatic public safety advisory (no deploy)
on:
  push:
    branches:
      - fix/auto-community-safety-advisory-on-validation-20261115

permissions:
  contents: read

jobs:
  auto-advisory-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Advisory privacy, allowed schema and automatic Admin validation tests
        run: |
          node scripts/test-emergency-announcement-advisory-link.cjs
          node scripts/test-admin-response-workspace-ux.cjs
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-defense-unified-lgu-volunteer-dispatch.cjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Expo web export (build only, never deploy)
        run: npx expo export --platform web --clear
