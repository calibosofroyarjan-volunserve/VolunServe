name: Actual VolunServe Auto Volunteer - isolated emulator end-to-end (NO DEPLOY)
on:
  push:
    branches:
      - qa/actual-volunserve-emergency-emulator-check-20261123

permissions:
  contents: read

jobs:
  actual-app-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-volunserve-simple-invites
      GOOGLE_CLOUD_PROJECT: demo-volunserve-simple-invites
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FUNCTIONS_EMULATOR: "true"
      VOLUNSERVE_SIMPLE_AUTO_INVITES_ENABLED: "true"
      VOLUNSERVE_SIMPLE_AUTO_INVITES_PROJECT_ID: demo-volunserve-simple-invites
      VOLUNSERVE_SIMPLE_AUTO_INVITES_PRODUCTION_APPROVED: "false"
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify only non-production test workflow was added
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 1
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/qa-actual-volunserve-emulator-20261123.yml"
          test "$VOLUNSERVE_SIMPLE_AUTO_INVITES_PRODUCTION_APPROVED" = false
          test "$GCLOUD_PROJECT" = demo-volunserve-simple-invites
      - name: Install pinned root and Firebase Functions dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Check app types and guarded function logic
        run: |
          node --check functions/index.js
          node --check functions/emergencySimpleAutoInvite.js
          node --check functions/test-emergencySimpleAutoInviteRealEmulator.cjs
          node --test functions/test-emergencySimpleAutoInvite.cjs
          npx tsc --noEmit --incremental false
      - name: Enable only a fictional local emulator runtime
        shell: bash
        run: |
          cat > functions/.env.local <<'DEMO'
          VOLUNSERVE_SIMPLE_AUTO_INVITES_ENABLED=true
          VOLUNSERVE_SIMPLE_AUTO_INVITES_PROJECT_ID=demo-volunserve-simple-invites
          VOLUNSERVE_SIMPLE_AUTO_INVITES_PRODUCTION_APPROVED=false
          DEMO
      - name: Real Firebase Auth, Firestore Rules and Functions emulator - 3 invites, 2 Accept, 1 Decline
        run: |
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-simple-invites --only auth,firestore,functions "node --test --test-concurrency=1 functions/test-emergencySimpleAutoInviteRealEmulator.cjs"
      - name: No production deployment
        run: echo "PASS isolated emulators only - no live service or real emergency data modified"
