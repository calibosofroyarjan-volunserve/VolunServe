name: Resident Submission -> All Volunteers (isolated DEMO emulator, NO DEPLOY)
on:
  push:
    branches:
      - qa/resident-submission-auto-invite-demo-20261123
  pull_request:
    branches:
      - feat/live-emergency-auto-invite-approval-guarded-20261123

permissions:
  contents: read

jobs:
  resident-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-volunserve-simple-invites
      GOOGLE_CLOUD_PROJECT: demo-volunserve-simple-invites
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FUNCTIONS_EMULATOR: "true"
      VOLUNSERVE_SIMPLE_AUTO_INVITES_ENABLED: "true"
      VOLUNSERVE_SIMPLE_AUTO_INVITES_PROJECT_ID: demo-volunserve-simple-invites
      VOLUNSERVE_SIMPLE_AUTO_INVITES_PRODUCTION_APPROVED: "false"
      VOLUNSERVE_RESIDENT_SUBMISSION_DEMO_ENABLED: "true"
      VOLUNSERVE_RESIDENT_DEMO_STAGING_APPROVED: "false"
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned web and Functions dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Verify OFF-by-default production safeguards and code
        run: |
          node --check functions/index.js
          node --check functions/emergencySimpleAutoInvite.js
          node --check functions/emergencyResidentSubmissionDemo.js
          node --check functions/test-emergencyResidentSubmissionDemoRealEmulator.cjs
          node --test functions/test-emergencySimpleAutoInvite.cjs
          node --test functions/test-emergencyResidentSubmissionDemoGates.cjs
          npx tsc --noEmit --incremental false
      - name: Isolated Firebase Functions emulator flags (never production)
        shell: bash
        run: |
          cat > functions/.env.local <<'DEMO'
          VOLUNSERVE_SIMPLE_AUTO_INVITES_ENABLED=true
          VOLUNSERVE_SIMPLE_AUTO_INVITES_PROJECT_ID=demo-volunserve-simple-invites
          VOLUNSERVE_SIMPLE_AUTO_INVITES_PRODUCTION_APPROVED=false
          VOLUNSERVE_RESIDENT_SUBMISSION_DEMO_ENABLED=true
          VOLUNSERVE_RESIDENT_DEMO_STAGING_APPROVED=false
          DEMO
      - name: Resident SDK submit -> Function fanout -> Notifications and Tasks -> secure decisions -> Admin
        run: |
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-simple-invites --only auth,firestore,functions "node --test --test-concurrency=1 functions/test-emergencyResidentSubmissionDemoRealEmulator.cjs"
      - name: Confirm NO live deployment
        run: echo "Isolated DEMO emulator passed; no production service or user data modified"
