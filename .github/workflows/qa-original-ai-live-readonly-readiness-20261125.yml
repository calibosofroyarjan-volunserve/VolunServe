name: Original AI live READ-ONLY readiness audit (NO DEPLOY)
on:
  push:
    branches:
      - qa/original-ai-live-readiness-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-live-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check protected production source and idempotent public health endpoints only
        uses: actions/github-script@v7
        with:
          script: |
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const baseline='4fbd818711fd6ec8f09594f37b3658d0ce973134';
            const liveNode='d06aeb1e0a572bf8581a99d7064da0a8d2430ed4';
            const livePython='319152e6a1cad5e54653c20e87bd1551a82b219e';
            const expected='.github/workflows/qa-original-ai-live-readonly-readiness-20261125.yml';
            const diff=await github.rest.repos.compareCommits({owner,repo,base:baseline,head:context.sha});
            assert.equal(diff.data.behind_by,0,'Do not regress staging QA baseline');
            assert.deepEqual((diff.data.files||[]).map(x=>x.filename),[expected],
              'Only one read-only audit workflow may change');
            const read=async(path,ref)=>{
              const r=await github.rest.repos.getContent({owner,repo,path,ref});
              assert.equal(r.data.encoding,'base64');
              return Buffer.from(r.data.content,'base64').toString('utf8');
            };
            const [server,python,web,evidence]=await Promise.all([
              read('backend/server.js',liveNode),
              read('identity-ai/main.py',livePython),
              read('lib/identityVerification.ts','5af28d279618dacd5eab518e5e0d52259eae8844'),
              read('backend/identityPrivateEvidence.js',liveNode)
            ]);
            for(const route of ['"/api/identity/document/precheck-with-evidence"',
                                '"/api/identity/verify-with-evidence"',
                                '"/api/admin/identity/reviews"']){
              assert.ok(server.includes(route),'Missing live Node contract: '+route);
            }
            assert.ok(python.includes('@app.post("/document/precheck")'));
            assert.ok(web.includes('/api/identity/document/precheck-with-evidence'));
            assert.ok(web.includes('/api/identity/verify-with-evidence'));
            assert.ok(evidence.includes('type: "authenticated"'));
            assert.ok(evidence.includes('private_download_url'));
            assert.ok(server.includes('identityVerified: true'));
            core.info('PASS: exact live Node/Python + restored Hosting client contracts and authenticated private evidence exist');

            const NODE='https://volunserve.onrender.com',AI='https://volunserve-identity-ai.onrender.com';
            const checks=[
              ['node_health',NODE+'/health',{}],
              ['python_health',AI+'/health',{}],
              ['python_auth_no_key',AI+'/api/internal/auth-check',{}],
              ['python_auth_wrong_key',AI+'/api/internal/auth-check',{'X-VolunServe-Internal-Key':'SYNTHETIC_WRONG_KEY_NOT_REAL'}],
              ['node_engine_no_token',NODE+'/api/identity/engine-health',{}],
              ['node_admin_no_token',NODE+'/api/admin/identity/reviews',{}],
            ];
            for(const [,url] of checks){
              const parsed=new URL(url);
              assert.ok(parsed.origin===NODE||parsed.origin===AI);
              assert.equal(parsed.protocol,'https:');
            }
            const probe=async([name,url,headers])=>{
              try{
                const res=await fetch(url,{method:'GET',redirect:'manual',
                  signal:AbortSignal.timeout(100000),headers:{Accept:'application/json',...headers}});
                const code=res.status;
                let health={};
                if(name.endsWith('health')&&code===200){
                  const obj=await res.json();
                  const keys=name==='python_health'?
                    ['ok','internalAuthConfigured','verificationEngineReady','documentOcrReady',
                     'profileComparisonReady','documentPrecheckReady','livenessImplemented',
                     'idDocumentAuthenticityVerified']:
                    ['ok','identityEngine','assistanceEvidenceStorage'];
                  for(const key of keys){if(typeof obj[key]==='boolean'||typeof obj[key]==='string')health[key]=obj[key];}
                }
                // NEVER dump any private endpoint body, tokens, unknown health fields or headers.
                return {name,code,health};
              }catch(e){
                return {name,code:'UNREACHABLE',health:{},error_type:String(e.name||'Error')};
              }
            };
            const results=await Promise.all(checks.map(probe));
            for(const row of results)core.info('LIVE_READ_ONLY_OBSERVATION '+JSON.stringify(row));
            const map=Object.fromEntries(results.map(x=>[x.name,x]));
            const blockers=[];
            const nh=map.node_health,ph=map.python_health;
            if(nh.code!==200||nh.health.ok!==true)blockers.push('Live Node /health not ready');
            if(nh.health.assistanceEvidenceStorage!=='secure_cloudinary_configured')
              blockers.push('Production backend secure Cloudinary not configured');
            if(ph.code!==200||ph.health.ok!==true)blockers.push('Live Python /health not ready');
            for(const key of ['internalAuthConfigured','verificationEngineReady','documentOcrReady',
              'profileComparisonReady','documentPrecheckReady']){
              if(ph.health[key]!==true)blockers.push('Python '+key+' is not confirmed ready');
            }
            for(const name of ['python_auth_no_key','python_auth_wrong_key',
              'node_engine_no_token','node_admin_no_token']){
              const code=map[name].code;
              if(code===200)throw Error('SECURITY BLOCKER: unauthenticated private GET unexpectedly returned 200: '+name);
              if(code!==401&&code!==403)
                blockers.push(name+' expected 401/403 but observed '+code);
            }
            for(let i=0;i<blockers.length;i++)core.warning('BLOCKER_'+(i+1)+': '+blockers[i]);
            if(blockers.length===0)core.info('READINESS: production public health and negative authentication smoke checks PASS');
            else core.warning('READINESS: production GET-only smoke test has '+blockers.length+' blocker(s)');
            core.warning('AUTHENTICATED END-TO-END NOT VERIFIED: no live resident/Admin token, no real matching, no document upload, no private Node-to-Python key proof from public endpoints');
            core.info('SCOPE: six HTTPS GET only, no production writes, no Firebase writes, no Cloudinary upload, no deployment, no secrets');
