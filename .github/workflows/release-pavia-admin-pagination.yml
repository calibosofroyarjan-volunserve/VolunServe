name: Release Pavia LGU Admin Pagination and Workflows (Hosting Only)
on:
  push:
    branches:
      - release/pavia-admin-pagination-workflows-20261029
    paths:
      - .github/workflows/release-pavia-admin-pagination.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression tests for LGU modules and preserved signup/map/Super Admin
        run: |
          node scripts/test-pavia-admin-pagination-announcements.cjs
          node scripts/test-lgu-dashboard-inline-approvals-and-paging.cjs
          node scripts/test-lgu-internal-review-ux.cjs
          node scripts/test-final-admin-scope.cjs
          node scripts/test-superadmin-grouped-records.cjs
          node scripts/test-superadmin-settings-records-retention.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-password-reset-popup.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-clean-emergency-report-header.cjs
          npx tsc --noEmit --pretty false
      - name: Validate Announcement write permissions against Firestore emulator
        run: npx firebase emulators:exec --only firestore --project demo-volunserve 'node scripts/test-pavia-admin-announcement-emulator.cjs'
      - name: Build production Expo web and release marker
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Verify Hosting credentials
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Hosting service credentials; no production deploy"
            exit 1
          fi
      - name: Deploy Firebase Hosting ONLY (never deploy Firestore, Functions or Storage)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact release revision on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Waiting for matching production release attempt $attempt"
            sleep 10
          done
          echo "::error::Custom domain does not serve expected Admin revision"
          exit 1
