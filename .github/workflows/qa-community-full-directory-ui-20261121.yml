name: QA Searchable Member Directory + Offline Profile Consent PC Mobile (NO DEPLOY)
on:
  push:
    branches: [qa/community-full-directory-ui-20261121]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read-only UI diff and existing Home invariants
        run: |
          git diff --name-status 8587836c945007f26ec715f87316182ff7498677 1dcb67846ca0e31a76454c6070550ede0879c007
          node - <<'NODE'
          const a=require('node:assert/strict'), fs=require('fs');
          const ui=fs.readFileSync('components/home/CommunityOnline.tsx','utf8');
          const home=fs.readFileSync('components/home/Home.web.tsx','utf8');
          const native=fs.readFileSync('components/home/Home.native.tsx','utf8');
          const profile=fs.readFileSync('app/(tabs)/community-member-profile.tsx','utf8');
          const chat=fs.readFileSync('app/(tabs)/community-chat.tsx','utf8');
          const cal=fs.readFileSync('components/home/CommunityCalendar.tsx','utf8');
          for(const term of ['Community Members','Search community members','Keep my profile in Members Directory',
            '"directoryListed"','Show More Members','Online','Offline','Chat','Residents','Volunteers'])
            a(ui.includes(term),'Missing directory function: '+term);
          a(home.includes('title="Announcements"'));
          a(home.includes('Emergency Contacts'));
          a(home.includes('ContactCard kind="local"') && home.includes('ContactCard kind="national"'));
          a(native.includes('CommunityOnline'));
          a(home.includes('CommunityCalendar')&&cal.includes('Asia/Manila'));
          a(chat.includes('Report Conversation')&&chat.includes('Block Member'));
          a(profile.includes('Read-only'));
          a(!ui.includes('collection(db,')&&!ui.includes('getDocs('),'UI cannot directly enumerate private users');
          NODE
      - name: Install pinned web dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and unchanged login, volunteers, map and profile tests
        run: |
          npx tsc --noEmit --incremental false
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-profile-certificates-account-menu.cjs
      - name: Expo production web export, no deploy
        run: |
          npx expo export --platform web --clear
          test -f dist/index.html
          test -f dist/community-inbox.html || test -f dist/community-inbox/index.html
          test -f dist/community-member-profile.html || test -f dist/community-member-profile/index.html
