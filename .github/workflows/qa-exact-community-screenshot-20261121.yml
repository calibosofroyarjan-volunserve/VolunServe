name: QA Exact Screenshot Members and Calendar (NO DEPLOY)
on:
  push:
    branches: [qa/exact-community-screenshot-20261121]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exactly five live-derived UI files and no code regression
        run: |
          git diff --name-status df63157a1933453fd9055b552fa6a18889ade98a a0e1fdeea3705bf4c8da5ef2d6caa3f9391ae1fe
          node - <<'NODE'
          const a=require('node:assert/strict');
          const fs=require('node:fs'),cp=require('node:child_process');
          const changed=cp.execFileSync('git',['diff','--name-status',
            'df63157a1933453fd9055b552fa6a18889ade98a','a0e1fdeea3705bf4c8da5ef2d6caa3f9391ae1fe'],{encoding:'utf8'}).trim().split('\n').sort();
          a.deepEqual(changed,[
            'A\tapp/(tabs)/community-members.tsx',
            'M\tcomponents/home/CommunityCalendar.tsx',
            'M\tcomponents/home/CommunityOnline.tsx',
            'M\tcomponents/home/Home.native.tsx',
            'M\tcomponents/home/Home.web.tsx',
          ].sort());
          const web=fs.readFileSync('components/home/Home.web.tsx','utf8');
          const native=fs.readFileSync('components/home/Home.native.tsx','utf8');
          const members=fs.readFileSync('components/home/CommunityOnline.tsx','utf8');
          const calendar=fs.readFileSync('components/home/CommunityCalendar.tsx','utf8');
          const route=fs.readFileSync('app/(tabs)/community-members.tsx','utf8');
          for(const home of [web,native]){
            a(home.includes('CommunityOnline uid={user?.uid} dashboard/>'));
            a(home.includes('CommunityCalendar uid={user?.uid}'));
            a(home.includes('communityColumnsStacked'));
            a(home.includes('Emergency Contacts'));
          }
          a(web.includes('title="Announcements"'));
          a(web.includes('ContactCard kind="local"')&&web.includes('ContactCard kind="national"'));
          a(native.includes('nativeEmergencyCard'));
          a(members.includes('const rowsPerPage=dashboard?5:10'));
          a(members.includes('const totalPages='));
          a(members.includes('View Profile'));
          a(members.includes('Message'));
          a(members.includes('memberLastSeen'));
          a(members.includes('!dashboard&&<>'),'Settings must be outside Home');
          a(!members.includes('settingsOpen'));
          a(members.includes('community-members'));
          a(members.includes('activeCounts.total'));
          a(members.includes('directoryListed'));
          a(calendar.includes('{!dashboard&&<View style={[styles.eventPane'));
          a(calendar.includes('{!dashboard&&<Pressable onPress'));
          a(calendar.includes('where("publicationStatus","==","published")'));
          a(calendar.includes('timeZone:"Asia/Manila"'));
          a(route.includes('CommunityOnline uid={user?.uid} dashboard={false}'));
          a(!members.includes('collection(db,')&&!members.includes('getDocs('));
          NODE
      - name: Install frozen site dependencies
        run: npm ci --no-audit --no-fund
      - name: Static types, login, volunteer role, profile and map regressions
        run: |
          npx tsc --noEmit --incremental false
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-profile-certificates-account-menu.cjs
      - name: Production web export (NO DEPLOY)
        run: |
          npx expo export --platform web --clear
          test -f dist/index.html
          test -f dist/community-members.html || test -f dist/community-members/index.html
          test -f dist/community-member-profile.html || test -f dist/community-member-profile/index.html
          test -f dist/community-chat.html || test -f dist/community-chat/index.html
      - name: Android JS export smoke (NO DEPLOY)
        run: npx expo export --platform android --output-dir qa-android-js --clear
