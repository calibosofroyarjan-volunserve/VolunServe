name: Validate Resident and Volunteer Portal Visual Flow
on:
  push:
    branches:
      - feat/resident-volunteer-portal-visual-flow-20261029
    paths:
      - .github/workflows/validate-resident-volunteer-portal-ui.yml
      - app/(tabs)/_layout.tsx
      - app/(tabs)/resident.tsx
      - app/(tabs)/volunteer.tsx
      - app/(tabs)/volunteer.web.tsx
      - scripts/test-portal-resident-volunteer-ui-flow.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check role-safe Resident & Volunteer navigation plus protected flows
        run: |
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
          node scripts/test-resident-volunteer-sidebar-navigation.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-superadmin-premium-restoration.cjs
          npx tsc --noEmit --pretty false
      - name: Build web portal (NO DEPLOY)
        run: npx expo export --platform web
