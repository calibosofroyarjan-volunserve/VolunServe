name: Validate Clean LGU Admin Analytics and Compact Workspace
on:
  push:
    branches:
      - fix/admin-defense-clean-analytics-no-scroll-20261030
  pull_request:
    branches:
      - main
    paths:
      - app/(admin)/command-center.tsx
      - components/admin/DashboardOperationalInsights.tsx
      - scripts/test-admin-clean-operational-analytics.cjs
      - .github/workflows/validate-admin-clean-analytics-no-scroll.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate clean operational analytics, paging, permissions and navigation
        run: |
          node scripts/test-admin-clean-operational-analytics.cjs
          node scripts/test-admin-overview-ui.cjs
          node scripts/test-dashboard-overviews.cjs
          node scripts/test-admin-compact-workspace-ux.cjs
          node scripts/test-unified-admin-dashboard-and-emergency-pagination.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-remove-admin-evacuation-centers.cjs
          node scripts/test-defense-dashboard-residents-volunteers-activity.cjs
          node scripts/test-final-admin-scope.cjs
          npx tsc --noEmit --pretty false
      - name: Verify production Expo web build without deploying
        run: npx expo export --platform web
