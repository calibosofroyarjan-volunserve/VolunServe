name: National ID OCR label diagnostics — staging only, no deployment
on:
  push:
    branches:
      - feat/staging-upload-ocr-labels-20261122
    paths:
      - 'identity-ai/strict_document_screening.py'
      - 'identity-ai/profile_consistency.py'
      - 'identity-ai/test_national_id_label_regression_20261122.py'
      - '.github/workflows/test-national-id-labels-no-deploy-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-synthetic-label-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax
        run: python -m py_compile identity-ai/strict_document_screening.py identity-ai/profile_consistency.py identity-ai/test_national_id_label_regression_20261122.py
      - name: Run synthetic regression without real documents
        run: |
          python -m unittest discover -s identity-ai -p test_national_id_label_regression_20261122.py -v
          python -m unittest discover -s identity-ai -p test_profile_consistency.py -v
          python -m unittest discover -s identity-ai -p test_strict_document_screening.py -v
      - name: No production release
        run: echo "Only synthetic test strings. No real ID, files, Firebase, Render, deployment, or automatic Verified Resident status." >> "$GITHUB_STEP_SUMMARY"
