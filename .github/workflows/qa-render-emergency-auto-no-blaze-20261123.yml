name: Render Emergency Auto Invites No Blaze (QA only / NO DEPLOY)
on:
  push:
    branches:
      - feat/render-emergency-auto-invite-no-blaze-20261123
  pull_request:
    branches:
      - backend-live-protected

permissions:
  contents: read

jobs:
  safe-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Render backend syntax, gating and functional mocked-Firestore tests
        run: |
          node --check backend/server.js
          node --check backend/renderEmergencyAutoInvites.js
          node --test backend/test-renderEmergencyAutoInvites.cjs
      - name: Existing production backend certificate and Auth regressions
        working-directory: backend
        run: |
          node --test test-communityCertificateAutoSync.js
          node --test tests/verifiedFirebaseToken.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Real Firebase Auth + Firestore Rules emulator E2E (fictional only)
        env:
          CI: "true"
          GCLOUD_PROJECT: demo-volunserve-simple-invites
          GOOGLE_CLOUD_PROJECT: demo-volunserve-simple-invites
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
          FIREBASE_CLI_DISABLE_TELEMETRY: "1"
        run: |
          node --check backend/test-renderEmergencyAutoInvitesRealEmulator.cjs
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-simple-invites --only auth,firestore "node --test --test-concurrency=1 backend/test-renderEmergencyAutoInvitesRealEmulator.cjs"
      - name: TypeScript web/mobile compilation
        run: npx tsc --noEmit --pretty false
      - name: Explicitly NO Firebase/Render/live deployment
        run: echo "QA only. Auto-invites remain OFF unless approved service & app flags are enabled."
