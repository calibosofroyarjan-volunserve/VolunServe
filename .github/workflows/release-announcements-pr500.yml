name: Scoped PR 500 Announcements (Protected, Manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect performs IAM/compiler checks only; release also publishes the pinned artifact and tests authorized roles'
        type: choice
        options: [inspect, release]
        default: inspect
        required: true
      expected_live_sha:
        description: 'Exact current production Hosting SHA'
        type: string
        default: '2cd63d318ecb6b0dfc52706308e05d0b5806d874'
        required: true
  pull_request:
    branches: [live-protected]
    paths:
      - .github/workflows/release-announcements-pr500.yml
      - scripts/release-announcements-pr500.cjs
      - scripts/verify-announcements-pr500-roles.cjs
      - scripts/test-announcements-release-controller.cjs
  push:
    branches: [release/announcements-controller-20261114]
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  validate-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed source, credential, scope and rollback guards without production access
        run: |
          node --check scripts/release-announcements-pr500.cjs
          node --check scripts/verify-announcements-pr500-roles.cjs
          node --test scripts/test-announcements-release-controller.cjs
  protected-preflight-or-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/live-protected' && github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    needs: validate-controller
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
    steps:
      - name: Checkout protected controller only; its application source is never deployed
        uses: actions/checkout@v4
        with:
          path: controller
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Checkout immutable PR 500 artifact derived from exact live site
        uses: actions/checkout@v4
        with:
          path: site
          ref: 5b7f769d3db8a906309f962930306a4c863a026c
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact candidate dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Verify pinned TypeScript and announcement access on disposable emulator
        working-directory: site
        run: |
          npx tsc --noEmit --incremental false
          npx firebase emulators:exec --only firestore --project demo-volunserve "node scripts/test-announcements-published-audience-emulator.cjs"
      - name: Export only pinned candidate web source
        if: inputs.mode == 'release'
        working-directory: site
        run: |
          npx expo export --platform web --clear
          GITHUB_SHA=5b7f769d3db8a906309f962930306a4c863a026c node scripts/verify-hosting-release.cjs
      - name: Protected IAM and production compiler preflight, or coordinated scoped release with rollback
        env:
          VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
          VOLUNSERVE_ANNOUNCEMENTS_QA_SESSIONS: ${{ secrets.VOLUNSERVE_ANNOUNCEMENTS_QA_SESSIONS }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: node controller/scripts/release-announcements-pr500.cjs "$RELEASE_MODE"
      - name: Preserve credential-free release and rollback references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcements-pr500-release-${{ github.run_id }}
          path: ${{ runner.temp }}/announcements-pr500-release.json
          if-no-files-found: warn
          retention-days: 14
