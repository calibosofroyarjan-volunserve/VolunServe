name: Verify Announcements On Exact Live Base (NO DEPLOY)
on:
  push:
    branches: [feature/announcements-on-verified-live-20261105]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify exact live ancestor and unchanged protected modules
        env:
          LIVE_BASE: 579bed559b1ba81e2045ba420847f8635e8f182c
        run: |
          git cat-file -e "$LIVE_BASE^{commit}"
          git merge-base --is-ancestor "$LIVE_BASE" HEAD
          git diff --name-only "$LIVE_BASE" HEAD > /tmp/changes.txt
          node - <<'NODE'
          const fs=require('node:fs');
          const changed=fs.readFileSync('/tmp/changes.txt','utf8').split('\n').filter(Boolean);
          const allowed=new Set([
            'components/home/Home.web.tsx','components/home/Home.native.tsx',
            'app/(tabs)/notifications.tsx','app/(tabs)/announcements.tsx',
            'lib/useCommunityAnnouncements.ts','firestore.rules','firestore.indexes.json',
            'scripts/test-announcements-audience-security.cjs',
            '.github/workflows/validate-live-announcements-isolated.yml'
          ]);
          const bad=changed.filter(x=>!allowed.has(x));
          if(bad.length)throw Error('Unexpected protected live code changes: '+bad.join(', '));
          console.log('PASS unchanged: Login, Signup, Super Admin, Admin, remaining Resident and Volunteer modules.');
          NODE
      - name: Install locked packages
        run: npm ci --no-audit --no-fund
      - name: TypeScript compilation
        run: npx tsc --noEmit --pretty false
      - name: Test announcement read isolation in Firestore emulator
        run: npx firebase emulators:exec --only firestore --project demo-volunserve 'node scripts/test-announcements-audience-security.cjs'
      - name: Verify existing LGU Admin publishing in emulator
        run: npx firebase emulators:exec --only firestore --project demo-volunserve 'node scripts/test-pavia-admin-announcement-emulator.cjs'
      - name: Expo web export only; DO NOT DEPLOY
        run: npx expo export --platform web
