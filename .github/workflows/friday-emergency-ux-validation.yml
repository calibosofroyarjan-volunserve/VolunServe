name: Friday Emergency UX Validation (No Deploy)

on:
  push:
    branches:
      - fix/friday-emergency-hub-navigation-20261028
  pull_request:
    paths:
      - "app/(tabs)/**"
      - "components/**"
      - "scripts/test-friday-emergency-hub.cjs"
      - ".github/workflows/friday-emergency-ux-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friday-emergency-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, navigation contracts and web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify emergency UI navigation and case-specific routes
        run: node --test scripts/test-friday-emergency-hub.cjs
      - name: Verify SJDM map safety and facility contracts
        run: |
          node --test scripts/test-sjdm-live-map-contract.cjs
          node --test scripts/test-sjdm-facility-admin-contract.cjs
      - name: Typecheck app
        run: npx tsc --noEmit
      - name: Export production web bundle (NO DEPLOYMENT)
        run: npx expo export --platform web
