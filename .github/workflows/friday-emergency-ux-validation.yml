name: Friday Emergency UX Validation (No Deploy)

on:
  push:
    branches:
      - fix/friday-emergency-hub-navigation-20261028
      - fix/emergency-facility-authentic-cards-20261029
  pull_request:
    paths:
      - "app/(tabs)/**"
      - "components/**"
      - "scripts/test-friday-emergency-hub.cjs"
      - ".github/workflows/friday-emergency-ux-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friday-emergency-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, navigation contracts and web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify sourced facility cards
        run: node --test scripts/test-emergency-facility-cards.cjs
      - name: Verify emergency UI navigation and case-specific routes
        run: node --test scripts/test-friday-emergency-hub.cjs
      - name: Verify SJDM map safety and facility contracts
        run: |
          node --test scripts/test-sjdm-live-map-contract.cjs
          node --test scripts/test-sjdm-facility-admin-contract.cjs
      - name: Verify Community Events map and emergency integrations
        run: node scripts/test-event-map-route-ux.cjs
      - name: Install Java 21 for local Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test real Firestore rules and live facility listeners (synthetic emulator only)
        run: |
          npx firebase emulators:exec --only firestore --project demo-volunserve \
            "node scripts/test-live-emergency-map-rules.cjs && node scripts/test-sjdm-live-firebase-subscriptions.cjs"
      - name: Typecheck app
        run: npx tsc --noEmit
      - name: Export production web bundle (NO DEPLOYMENT)
        run: npx expo export --platform web
      - name: Check existing Friday preview (read-only; report revision mismatch)
        continue-on-error: true
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve-3aa5b--sjdm-friday-preview-o9qxt66d.web.app
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/check-live-hosting.cjs
