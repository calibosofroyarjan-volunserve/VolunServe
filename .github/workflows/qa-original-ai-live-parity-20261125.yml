name: QA original AI parity against deployed Render commits (NO DEPLOY)
on:
  push:
    branches:
      - qa/original-ai-live-parity-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Live Node identity routes and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Node application and identity files match deployed commit
        run: |
          git diff --exit-code d06aeb1e0a572bf8581a99d7064da0a8d2430ed4 HEAD -- backend/
      - name: Syntax and live API contract check
        run: |
          node --check backend/server.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const s = fs.readFileSync('backend/server.js', 'utf8');
          for (const route of [
            '/api/identity/document/precheck-with-evidence',
            '/api/identity/verify-with-evidence',
            '/api/admin/identity/reviews/:uid/decision',
          ]) assert.ok(s.includes(route), 'Missing protected identity route: ' + route);
          assert.ok(s.includes('requireFirebaseUser'), 'Missing Firebase auth gateway');
          assert.ok(s.includes('requireOperationalAdmin'), 'Missing restricted Admin gate');
          assert.ok(s.includes('identityAttemptOutcome'), 'Missing Admin-only completion guard');
          console.log('PASS: production source contains original identity routes and auth guards');
          NODE
      - name: Run original identity and unrelated attendance regressions from repository root
        run: |
          node --test \
            backend/test-identityPrivateEvidence.js \
            backend/test-identity-final-admin-only.js \
            backend/test-identity-three-attempt-review.js \
            backend/test-communityAttendanceGeofence.js
      - name: Run existing ID precheck classifier tests from their required working directory
        working-directory: backend
        run: node --test test-identityHybridPrecheckDecision.js
      - name: Verify live CORS allowlist and legacy alias without outdated single-string-route assumption
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const s = fs.readFileSync('backend/server.js','utf8');
          const pos = s.indexOf('app.use(\n  cors({');
          assert.ok(pos >= 0, 'Live CORS middleware is present');
          const block = s.slice(pos, s.indexOf('}),\n);', pos));
          const allowed = block.match(/allowedHeaders:\s*\[([\s\S]*?)\]/);
          assert.ok(allowed, 'CORS header allowlist exists');
          const headers = [...allowed[1].matchAll(/"([^"]+)"/g)].map(x => x[1].toLowerCase());
          for (const name of ['authorization','content-type','x-volunserve-document-precheck-consent'])
            assert.ok(headers.includes(name),'Missing consent or auth header: '+name);
          assert.ok(s.includes('["/api/identity/document/precheck", "/api/identity/document/precheck-with-evidence"]'), 'Current live dual-route alias missing');
          assert.ok(s.includes('request.headers["x-volunserve-document-precheck-consent"] !== "true"'), 'Consent check missing');
          console.log('PASS: actual live CORS and both precheck routes verified');
          NODE
  python:
    name: Live Python government ID and face source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve exact pinned live Python files through read-only GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner,repo} = context.repo;
            const ref = '319152e6a1cad5e54653c20e87bd1551a82b219e';
            const files = [
              'main.py', 'document_screening.py', 'profile_consistency.py',
              'test_document_screening.py', 'test_profile_consistency.py'
            ];
            const target = path.join(process.env.GITHUB_WORKSPACE,'live-ai','identity-ai');
            fs.mkdirSync(target,{recursive:true});
            for(const filename of files){
              const {data} = await github.rest.repos.getContent({
                owner,repo,path:'identity-ai/'+filename,ref
              });
              if(Array.isArray(data) || data.encoding !== 'base64')
                throw new Error('Live AI source response format changed: '+filename);
              fs.writeFileSync(path.join(target,filename),Buffer.from(data.content,'base64'));
              core.info('Read pinned live Python file: '+filename);
            }
            core.info('Read-only AI snapshot from exact production deploy commit '+ref);
      - name: Compile live AI and verify original 1-to-1 matcher and private precheck
        run: |
          python -m py_compile live-ai/identity-ai/main.py live-ai/identity-ai/document_screening.py live-ai/identity-ai/profile_consistency.py
          grep -Fq 'def run_face_verification(' live-ai/identity-ai/main.py
          grep -Fq '@app.post("/document/precheck")' live-ai/identity-ai/main.py
          grep -Fq 'school_id_not_supported' live-ai/identity-ai/document_screening.py
      - name: Execute synthetic ID screening / profile tests
        working-directory: live-ai/identity-ai
        run: |
          python -m unittest -v test_document_screening test_profile_consistency
# Source-only QA: does not set secrets, call deployed APIs, upload media,
# deploy services, access real users, or write to Firebase/Cloudinary.

  runtime:
    name: Original AI actual MediaPipe Tesseract synthetic HTTP smoke (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact current deployed Python AI files without checkout
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path=require('path');
            const {owner,repo}=context.repo;
            const ref='319152e6a1cad5e54653c20e87bd1551a82b219e';
            const files=[
              'main.py','document_screening.py','profile_consistency.py',
              'face_boxes.py','requirements.txt',
              'test_ai_runtime_smoke.py','test_synthetic_document_pipeline.py',
              'test_document_precheck.py','test_face_box_dedup.py'
            ];
            const target=path.join(process.env.GITHUB_WORKSPACE,'live-ai','identity-ai');
            fs.mkdirSync(target,{recursive:true});
            for(const filename of files){
              const {data}=await github.rest.repos.getContent({owner,repo,path:'identity-ai/'+filename,ref});
              if(Array.isArray(data)||data.encoding!=='base64') throw new Error('Unable to read deployed AI file '+filename);
              fs.writeFileSync(path.join(target,filename),Buffer.from(data.content,'base64'));
              core.info('Pinned live source: '+filename);
            }
      - name: Install runtime libraries and Tesseract in ephemeral runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr libgl1 libglib2.0-0 libgomp1
          python -m pip install --disable-pip-version-check -r live-ai/identity-ai/requirements.txt
      - name: Run actual MediaPipe face mesh plus synthetic image OCR and route tests
        working-directory: live-ai/identity-ai
        env:
          FIREBASE_AUTH_EMULATOR_HOST: ''
          FIRESTORE_EMULATOR_HOST: ''
          IDENTITY_AI_INTERNAL_KEY: local-qa-only-nonsecret
        run: |
          python -m unittest -v \
            test_ai_runtime_smoke \
            test_synthetic_document_pipeline \
            test_document_precheck \
            test_face_box_dedup
      - name: Test localhost HTTP precheck with synthetic demo cards and authorization
        working-directory: live-ai/identity-ai
        env:
          IDENTITY_AI_INTERNAL_KEY: local-qa-only-nonsecret
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request, urllib.error
          from test_synthetic_document_pipeline import synthetic_photo, NATIONAL_SAMPLE, BACK_SIDE_SAMPLE, SCHOOL_SAMPLE
          from io import BytesIO
          from PIL import Image

          base='http://127.0.0.1:18765'
          proc=subprocess.Popen([sys.executable,'-m','uvicorn','main:app','--host','127.0.0.1','--port','18765','--no-access-log'],
                                env=os.environ.copy(),stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
          def send(url, data=None, headers=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+url,data=data,headers=headers or {}),
                                              timeout=60) as resp:
                      return resp.status, json.loads(resp.read())
              except urllib.error.HTTPError as error:
                  raw=error.read()
                  try: parsed=json.loads(raw)
                  except ValueError: parsed={'detail':'nonjson'}
                  return error.code, parsed

          def payload(front,back):
              boundary='OriginalAiSyntheticNoRealIDs'
              parts=[]
              for field,value in [
                  ('idType','national_id'),
                  ('idDocument',front),
                  ('idBackDocument',back),
              ]:
                  is_file=isinstance(value,bytes)
                  header=('Content-Disposition: form-data; name="'+field+'"'
                          + ('; filename="synthetic-demo.png"\r\nContent-Type: image/png' if is_file else ''))
                  raw=value if is_file else value.encode()
                  parts.append(('--'+boundary+'\r\n'+header+'\r\n\r\n').encode()+raw+b'\r\n')
              return b''.join(parts)+('--'+boundary+'--\r\n').encode(),boundary

          try:
              for attempt in range(40):
                  try:
                      code,body=send('/health')
                      if code==200: break
                  except Exception:
                      time.sleep(0.5)
              else: raise AssertionError('QA localhost service never started')
              assert body.get('verificationEngineReady') is True, 'MediaPipe not loaded'
              assert body.get('documentOcrReady') is True, 'Tesseract not ready'
              code,body=send('/api/internal/auth-check')
              assert code==401, 'Private API must reject request without internal key'
              front,_=synthetic_photo(NATIONAL_SAMPLE)
              back,_=synthetic_photo(BACK_SIDE_SAMPLE)
              school,_=synthetic_photo(SCHOOL_SAMPLE)
              h={'X-VolunServe-User-Id':'synthetic-qa-user',
                 'X-VolunServe-Internal-Key':'local-qa-only-nonsecret',
                 'X-VolunServe-Profile-First-Name':'TEST',
                 'X-VolunServe-Profile-Last-Name':'SAMPLE'}
              body_bytes,boundary=payload(front,back)
              headers={**h,'Content-Type':'multipart/form-data; boundary='+boundary}
              code,body=send('/document/precheck',body_bytes,headers)
              assert code==200, ('synthetic precheck returned status', code)
              assert body.get('outcome')=='pass', 'Synthetic clear document failed ID-only precheck'
              assert body.get('authenticityVerified') is False
              assert body.get('livenessVerified') is False
              print('PASS: localhost synthetic ID OCR precheck, no auto verification')
              body_bytes,boundary=payload(school,back)
              headers={**h,'Content-Type':'multipart/form-data; boundary='+boundary}
              code,body=send('/document/precheck',body_bytes,headers)
              assert code==200, ('synthetic school ID returned status',code)
              assert body.get('outcome')!='pass', 'School ID was incorrectly accepted'
              assert 'school_id_not_supported' in body['documentScreening']['warningCodes']
              print('PASS: localhost synthetic school ID rejected')
              code,body=send('/document/precheck',body_bytes,{'Content-Type':'multipart/form-data; boundary='+boundary})
              assert code==401, 'Private precheck accepted anonymous request'
              print('PASS: private precheck rejects unauthenticated client')
          finally:
              proc.terminate()
              try: proc.wait(timeout=10)
              except subprocess.TimeoutExpired: proc.kill()
          PY
      - name: Retrieve deployed Node identity decision modules (read-only)
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path=require('path');
            const {owner,repo}=context.repo;
            const ref='d06aeb1e0a572bf8581a99d7064da0a8d2430ed4';
            const names=[
              'selectedIdPolicy.js',
              'identityHybridPrecheckDecision.js',
              'automaticIdentityApprovalPolicy.js',
              'identityAutoApprovalGateway.js',
            ];
            const target=path.join(process.env.GITHUB_WORKSPACE,'live-ai','backend');
            fs.mkdirSync(target,{recursive:true});
            for(const name of names) {
              const {data}=await github.rest.repos.getContent({
                owner,repo,path:'backend/'+name,ref
              });
              if(Array.isArray(data)||data.encoding!=='base64') throw Error('Missing deployed Node file '+name);
              fs.writeFileSync(path.join(target,name),Buffer.from(data.content,'base64'));
              core.info('Pinned deployed Node policy '+name);
            }
      - name: HTTP original face submit with fabricated image, then Node approval routing
        working-directory: live-ai/identity-ai
        env:
          IDENTITY_AI_INTERNAL_KEY: local-qa-only-nonsecret
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request, urllib.error
          from test_synthetic_document_pipeline import synthetic_photo, NATIONAL_SAMPLE, BACK_SIDE_SAMPLE, SCHOOL_SAMPLE
          from io import BytesIO
          from PIL import Image

          base='http://127.0.0.1:18766'
          proc=subprocess.Popen([sys.executable,'-m','uvicorn','main:app','--host','127.0.0.1','--port','18766','--no-access-log'],
                                env=os.environ.copy(),stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          def send(url, data, headers):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+url,data=data,headers=headers),timeout=65) as resp:
                      return resp.status,json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return e.code,json.loads(e.read())
          def form(front,back,selfie=None,id_type='national_id'):
              boundary='SyntheticOriginalAiPrivateOnly'
              parts=[]
              entries=[('idType',id_type),('idDocument',front),('idBackDocument',back)]
              if selfie is not None: entries.append(('selfie',selfie))
              for field,value in entries:
                  is_file=isinstance(value,bytes)
                  suffix='; filename="DEMO-NOT-A-REAL-ID.png"\r\nContent-Type: image/png' if is_file else ''
                  part=('Content-Disposition: form-data; name="'+field+'"'+suffix)
                  raw=value if is_file else value.encode()
                  parts.append(('--'+boundary+'\r\n'+part+'\r\n\r\n').encode()+raw+b'\r\n')
              return b''.join(parts)+('--'+boundary+'--\r\n').encode(),boundary
          headers={
            'X-VolunServe-User-Id':'synthetic-qa-user',
            'X-VolunServe-Internal-Key':'local-qa-only-nonsecret',
            'X-VolunServe-Profile-First-Name':'TEST',
            'X-VolunServe-Profile-Last-Name':'SAMPLE',
          }
          front,_=synthetic_photo(NATIONAL_SAMPLE)
          back,_=synthetic_photo(BACK_SIDE_SAMPLE)
          school,_=synthetic_photo(SCHOOL_SAMPLE)
          output=BytesIO()
          Image.new('RGB',(320,320),(239,240,241)).save(output,format='PNG')
          selfie=output.getvalue()
          try:
              for _ in range(40):
                  try:
                      with urllib.request.urlopen(base+'/health',timeout=3) as response:
                          if response.status==200: break
                  except Exception: time.sleep(.5)
              else: raise AssertionError('Isolated localhost FaceMesh service not started')
              data,boundary=form(front,back,selfie)
              h={**headers,'Content-Type':'multipart/form-data; boundary='+boundary}
              code,face=send('/verify',data,h)
              assert code==200,('Fabricated photo verification returned HTTP',code)
              assert face['status']=='failed',('Face-less fake documents must fail',face['status'])
              assert face.get('decision')=='failed'
              assert face.get('documentScreening',{}).get('detectedIdType')=='national_id'
              assert face.get('livenessImplemented') is False
              assert not face.get('authenticityVerified',False)
              assert 'id_face_not_detected' in face.get('warnings',[]), 'No face in fabricated ID was not rejected'
              print('PASS: actual /verify executes OCR then MediaPipe and rejects no-face synthetic image')
              with open('synthetic-face-result.json','w') as f:
                  json.dump({k:face.get(k) for k in ('status','decision','documentScreening','livenessImplemented','authenticityVerified')},f)
              data,boundary=form(school,back,selfie)
              code,body=send('/verify',data,{**headers,'Content-Type':'multipart/form-data; boundary='+boundary})
              assert code==200 and body.get('status')=='failed',('School ID not rejected',code)
              assert body.get('documentScreening',{}).get('status')=='unsupported'
              print('PASS: actual /verify rejects school ID before face comparison')
              data,boundary=form(front,back,front)
              code,body=send('/verify',data,{**headers,'Content-Type':'multipart/form-data; boundary='+boundary})
              assert code==400 and 'different images' in body.get('detail','')
              print('PASS: actual /verify rejects exact ID portrait reused as selfie')
              data,boundary=form(front,back,selfie)
              code,body=send('/verify',data,{'Content-Type':'multipart/form-data; boundary='+boundary})
              assert code==401,'Unauthorized caller reached private face engine'
              print('PASS: actual /verify rejects missing internal key')
          finally:
              proc.terminate()
              try:proc.wait(timeout=10)
              except subprocess.TimeoutExpired:proc.kill()
          PY
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const backend=path.resolve('../backend');
          const face=JSON.parse(fs.readFileSync('synthetic-face-result.json','utf8'));
          const {enforceSelectedIdDecision}=require(backend+'/selectedIdPolicy.js');
          const {classifyHybridDocumentPrecheck}=require(backend+'/identityHybridPrecheckDecision.js');
          const {assessAutomaticIdentityApproval}=require(backend+'/identityAutoApprovalGateway.js');
          (async()=>{
            const screened=face.documentScreening;
            assert.equal(enforceSelectedIdDecision(face.decision,screened,face.livenessImplemented),'failed');
            const ocr=classifyHybridDocumentPrecheck({screening:screened,aiOutcome:'pass'});
            assert.equal(ocr.outcome,'pass','Synthetic valid card should permit face scan only');
            assert.equal(ocr.decision,'ready_for_face_scan');
            assert.equal(enforceSelectedIdDecision('verified',screened,true),'manual_review',
              'Even a forged positive AI response cannot auto-promote Verified Resident');
            const approval=await assessAutomaticIdentityApproval({
              screening:screened,face:{result:'match',samePersonAssertion:true},
              attempt:{uid:'synthetic-qa-user',verificationId:'synthetic-attempt',freshCapture:true}
            });
            assert.equal(approval.eligible,false,'No independent issuer/PAD validators');
            assert.equal(approval.decision,'pending_admin_review');
            console.log('PASS: live Node policies safely consume real synthetic Python AI result, without Verified Resident elevation');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Exercise positive and negative landmark-matching decisions with artificial geometry
        working-directory: live-ai/identity-ai
        env:
          IDENTITY_AI_INTERNAL_KEY: local-qa-only-nonsecret
        run: |
          python - <<'PY'
          # Fabricated landmark arrays are NOT photos or human biometric data.
          # Stub only the detector output and quality check to exercise the
          # real production normalization, geometry score, threshold, and
          # review-routing code, while keeping actual images non-human.
          from io import BytesIO
          from unittest.mock import patch
          import json, math
          import numpy as np
          from PIL import Image
          import main

          def sample_bytes():
              out=BytesIO()
              Image.new('RGB',(320,320),(242,243,244)).save(out,format='PNG')
              return out.getvalue()

          rng=np.random.default_rng(20261125)
          first=rng.uniform(.2,.8,size=(468,2))
          first[33]=[.35,.4]
          first[263]=[.65,.4]
          rotation=math.radians(14)
          transform=np.array([
              [math.cos(rotation),-math.sin(rotation)],
              [math.sin(rotation),math.cos(rotation)]
          ])
          same=((first-.5)@transform.T)*.80+.5
          different=rng.uniform(.2,.8,size=(468,2))
          different[33]=[.35,.4]
          different[263]=[.65,.4]

          quality={'score':.96}
          meta={'faceCount':1,'reason':''}
          def exercise(id_landmarks,selfie_landmarks):
              with patch.object(main,'face_landmarks',side_effect=[
                  (id_landmarks,meta),(selfie_landmarks,meta)
              ]), patch.object(main,'image_quality',return_value=quality):
                  # Decode/image processing is real; face detector is replaced
                  # because these are mathematical point arrays, not faces.
                  return main.run_face_verification(
                      uid='synthetic-landmark-qa-only',
                      id_document_bytes=sample_bytes(),
                      selfie_bytes=sample_bytes()
                  )

          positive=exercise(first,same)
          assert positive['status']=='pending',positive
          assert positive['decision']=='manual_review'
          assert positive['matchScore']>=main.get_match_threshold()
          assert positive['livenessImplemented'] is False
          assert positive['livenessScore'] is None
          assert positive.get('identityVerified') is not True
          assert positive['engine']=='mediapipe-landmark-1to1-v1'
          print('PASS: actual shape geometry returns positive synthetic landmark comparison as PENDING ADMIN only')

          negative=exercise(first,different)
          assert negative['status']=='pending',negative
          assert negative['decision']=='manual_review'
          assert negative['matchScore'] < main.get_match_threshold(),negative
          assert negative['matchScore'] < positive['matchScore']
          assert 'face_match_uncertain_uncalibrated' in negative['warnings']
          assert negative['livenessImplemented'] is False
          assert negative.get('identityVerified') is not True
          print('PASS: differing artificial face-landmark geometry is NOT automatically approved')

          with open('artificial-positive-result.json','w') as out:
              json.dump({name:positive.get(name) for name in (
                'status','decision','matchScore','livenessScore',
                'livenessImplemented','identityVerified'
              )},out)
          PY
      - name: Send artificial positive face outcome to deployed Node Admin gate
        working-directory: live-ai/identity-ai
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const backend=path.resolve('../backend');
          const face=JSON.parse(fs.readFileSync('artificial-positive-result.json','utf8'));
          const {enforceSelectedIdDecision}=require(backend+'/selectedIdPolicy.js');
          const {assessAutomaticIdentityApproval}=require(backend+'/identityAutoApprovalGateway.js');
          const screening={
            status:'text_consistent_unverified',
            declaredIdType:'national_id',detectedIdType:'national_id',
            imageQualityStatus:'adequate',
            profileNameCheck:'possible_match',
            profileBirthDateCheck:'possible_match',
            backSideScreened:true,backSideProvided:true,
            warningCodes:[]
          };
          (async()=>{
            assert.equal(face.status,'pending');
            assert.equal(face.decision,'manual_review');
            assert.equal(face.livenessImplemented,false);
            assert.equal(enforceSelectedIdDecision(face.decision,screening,false),'manual_review');
            assert.equal(enforceSelectedIdDecision('verified',screening,true),'manual_review');
            const decision=await assessAutomaticIdentityApproval({
              screening,
              face:{result:'match',samePersonAssertion:true,
                verificationId:'synthetic-id-only'},
              attempt:{
                uid:'synthetic-user',verificationId:'synthetic-id-only',
                freshCapture:true,consentedEvidenceAvailable:true
              }
            });
            assert.equal(decision.eligible,false);
            assert.equal(decision.decision,'pending_admin_review');
            assert.equal(decision.reason,'independent_provider_validators_not_configured');
            console.log('PASS: artificial positive landmark match flows through real Node policy to Admin review, NOT Verified Resident');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
# Artificial MediaPipe landmark arrays are not genuine biometric samples.
# Only the QA workflow was edited, no application source or live data changed.
