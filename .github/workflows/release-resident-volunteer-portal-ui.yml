name: Release Resident and Volunteer Portal UI (Hosting Only)
on:
  push:
    branches:
      - release/resident-volunteer-portal-visual-flow-20261029
    paths:
      - .github/workflows/release-resident-volunteer-portal-ui.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve Resident and Volunteer workflows and all approved neighboring modules
        run: |
          node scripts/test-portal-resident-volunteer-ui-flow.cjs
          node scripts/test-resident-volunteer-sidebar.cjs
          node scripts/test-volunteer-donations-sidebar-removal.cjs
          node scripts/test-volunteer-profile-progress-shortcut.cjs
          node scripts/test-signup-email-first-middle-optional.cjs
          node scripts/test-superadmin-premium-restoration.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-clean-emergency-report-header.cjs
          node scripts/test-lgu-dashboard-inline-approvals-and-paging.cjs
          npx tsc --noEmit --pretty false
      - name: Produce approved production web bundle
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Require existing Hosting credential
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Hosting credentials; no production deployment attempted."
            exit 1
          fi
      - name: Deploy Firebase Hosting ONLY - no Firestore, Rules, Functions or Storage
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact Portal release on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Waiting for matching Portal UI revision attempt $attempt"
            sleep 10
          done
          echo "::error::Custom domain is not serving the expected Portal UI revision"
          exit 1
