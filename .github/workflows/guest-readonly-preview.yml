name: Guest Read-Only Workspace Preview

on:
  pull_request:
    paths:
      - "components/guest/**"
      - "app/public/**"
      - "scripts/test-guest-readonly-preview.cjs"
      - ".github/workflows/guest-readonly-preview.yml"
  push:
    branches:
      - "feat/guest-resident-volunteer-readonly-preview-20261030"

permissions:
  contents: read

jobs:
  verify-guest-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Read-only Guest route and permission contract
        run: node scripts/test-guest-readonly-preview.cjs
      - name: TypeScript compilation
        run: npx tsc --noEmit
