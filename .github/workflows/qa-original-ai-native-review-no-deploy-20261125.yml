name: Original AI Native Admin Review Regression (NO DEPLOY)
on:
  push:
    branches:
      - fix/original-ai-native-admin-review-hosting-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-identity:
    name: Native pending Admin review vs face stage
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate exact restored Hosting base and fetch allowlisted source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner,repo} = context.repo;
            const base='5af28d279618dacd5eab518e5e0d52259eae8844';
            const response=await github.rest.repos.compareCommits({owner,repo,base,head:context.sha});
            const approved=[
              'app/identity-verification.tsx',
              'scripts/test-original-ai-native-review-no-face-20261125.cjs',
              '.github/workflows/qa-original-ai-native-review-no-deploy-20261125.yml'
            ];
            if(response.data.behind_by!==0 || response.data.ahead_by<3)
              throw new Error('Candidate must be based on pinned restored Hosting source with additive QA/fix commits');
            const changed=(response.data.files||[]).map(f=>f.filename);
            if(changed.length!==3 || changed.some(name=>!approved.includes(name)))
              throw new Error('Unauthorized changes outside one native screen and two QA files: '+changed.join(','));
            for(const filename of [
              'app/identity-verification.tsx',
              'app/identity-verification.web.tsx',
              'lib/identityVerification.ts',
              'scripts/test-original-ai-native-review-no-face-20261125.cjs'
            ]){
              const {data}=await github.rest.repos.getContent({owner,repo,path:filename,ref:context.sha});
              if(Array.isArray(data)||data.encoding!=='base64')
                throw new Error('Could not safely read '+filename);
              const dst=path.join(process.env.GITHUB_WORKSPACE,filename);
              fs.mkdirSync(path.dirname(dst),{recursive:true});
              fs.writeFileSync(dst,Buffer.from(data.content,'base64'));
              core.info('Verified read-only file '+filename);
            }
            core.info('PASS: only native screen was modified; web, API client and backend unchanged');
      - name: Execute original native OCR decision branch with synthetic responses
        run: |
          node --check scripts/test-original-ai-native-review-no-face-20261125.cjs
          node --test scripts/test-original-ai-native-review-no-face-20261125.cjs
      - name: TypeScript JSX syntax smoke on changed native screen
        run: |
          mkdir -p .qa-ts-tools
          npm install --prefix .qa-ts-tools --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const ts = require('./.qa-ts-tools/node_modules/typescript');
          const path = 'app/identity-verification.tsx';
          const source = fs.readFileSync(path,'utf8');
          const r = ts.transpileModule(source,{
            fileName: path,
            compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.ESNext},
            reportDiagnostics:true
          });
          const errors=(r.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
          assert.equal(errors.length,0,errors.map(d=>ts.flattenDiagnosticMessageText(d.messageText,' ')).join('\n'));
          assert.ok(r.outputText.includes('ready_for_face_scan')||r.outputText.includes('precheckIdentityDocument'),'Native flow was not transpiled');
          console.log('PASS: native TypeScript/JSX compiles syntactically (not full project typecheck)');
          NODE
# Read-only checkout bypass protects malformed legacy gitlink; source fetched
# from GitHub API at the exact head commit. No production media, secrets,
# Firebase, Cloudinary, Render, hosting, deploy, or ID provider calls.
