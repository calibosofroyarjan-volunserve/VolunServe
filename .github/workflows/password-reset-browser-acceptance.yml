name: Forgot Password Popup Browser Acceptance (No Deploy)
on:
  push:
    branches:
      - feat/password-reset-modal-kohen-style-20261029
  pull_request:
    paths:
      - components/auth/PasswordResetModal.tsx
      - app/login.web.tsx
      - app/login.tsx
      - app/admin-login.tsx
      - scripts/test-password-reset-browser.cjs
      - .github/workflows/password-reset-browser-acceptance.yml
permissions:
  contents: read
concurrency:
  group: password-reset-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-reset-popup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install CI-only Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Build static login pages (NO DEPLOY)
        run: npx expo export --platform web
      - name: Open reset popups in actual browser (NO EMAIL SEND)
        run: node scripts/test-password-reset-browser.cjs
      - name: Upload popup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volunserve-password-reset-popup-screenshots
          path: evidence/password-reset-modal/
          if-no-files-found: ignore
          retention-days: 7
