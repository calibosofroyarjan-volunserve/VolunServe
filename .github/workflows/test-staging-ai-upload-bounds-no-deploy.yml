name: Staging AI Identity Upload Bounds (NO DEPLOY)
on:
  pull_request:
    branches:
      - integration/identity-full-staging-20261112
    paths:
      - 'identity-ai/main.py'
      - 'identity-ai/image_upload_bounds.py'
      - 'identity-ai/test_image_upload_bounds.py'
      - '.github/workflows/test-staging-ai-upload-bounds-no-deploy.yml'
permissions:
  contents: read
jobs:
  python-private-image-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Load immutable review source without submodule recursion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          curl -fLsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/$SOURCE_SHA" \
            -o /tmp/identity-ai-upload-bounds.zip
          mkdir -p "$RUNNER_TEMP/staging-ai-source"
          unzip -q /tmp/identity-ai-upload-bounds.zip -d "$RUNNER_TEMP/staging-ai-source"
          ROOT="$(find "$RUNNER_TEMP/staging-ai-source" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$ROOT/identity-ai/test_image_upload_bounds.py"
          cp -a "$ROOT/." "$GITHUB_WORKSPACE/"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile protected Python handler and enforce synthetic private image limits
        run: |
          python -m py_compile identity-ai/main.py identity-ai/image_upload_bounds.py
          python -m unittest discover -s identity-ai -p 'test_image_upload_bounds.py' -v
      - name: Confirm no service keys, real images or deployment
        run: echo 'NO_DEPLOY_NO_PRIVATE_MEDIA_NO_FIREBASE_OR_RENDER_CREDS'
