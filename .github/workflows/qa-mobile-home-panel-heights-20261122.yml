name: QA Mobile Home Activity Announcements Panel Heights (NO DEPLOY)
on:
  push:
    branches: [fix/mobile-home-activity-announcements-flex-20261122]
    paths:
      - 'components/home/Home.web.tsx'
      - 'scripts/qa-mobile-home-panels-20261122.cjs'
      - '.github/workflows/qa-mobile-home-panel-heights-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mobile-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Exact latest live source only, no auth or backend edits
        run: |
          set -euo pipefail
          BASE=c37a83eb96cac832b03dec9c0f8eea44056bee4c
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from subprocess import check_output
          changed=set(check_output(['git','diff','--name-only','c37a83eb96cac832b03dec9c0f8eea44056bee4c','HEAD'],text=True).splitlines())
          expected={
            'components/home/Home.web.tsx',
            'scripts/qa-mobile-home-panels-20261122.cjs',
            '.github/workflows/qa-mobile-home-panel-heights-20261122.yml',
          }
          assert changed==expected,(changed,expected)
          print('PASS current live derived 1 Home UI file + 2 QA files')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Browser geometry test using actual React Native Web styles
        run: |
          set -euo pipefail
          node scripts/qa-mobile-home-panels-20261122.cjs
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "::error::No headless Chrome"; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1300,850 --virtual-time-budget=5000 \
            --dump-dom "file:///tmp/volunserve-home-panels-qa.html" >/tmp/volunserve-home-panels-results.html 2>/tmp/home-chrome-errors || { tail -40 /tmp/home-chrome-errors; exit 1; }
          grep -o '<pre id="qa-result">[^<]*' /tmp/volunserve-home-panels-results.html || true
          grep -q 'PASS responsive Activity/Announcements panels geometry 320/360/390/430' /tmp/volunserve-home-panels-results.html
      - name: Verify production still at inspected latest revision, READ ONLY
        run: VOLUNSERVE_EXPECTED_SHA=c37a83eb96cac832b03dec9c0f8eea44056bee4c node scripts/check-live-hosting.cjs
      - name: TypeScript, login, member/profile and role regression
        run: |
          set -euo pipefail
          npx tsc --noEmit --incremental false
          node scripts/test-login-ui-release.cjs
          node scripts/test-profile-certificates-account-menu.cjs
          node scripts/test-guest-readonly-preview.cjs
          node --test scripts/test-admin-volunteer-authorization.cjs
          node --test scripts/test-embedded-emergency-map-navigation.cjs
      - name: Build full Expo web site (NO DEPLOY)
        run: npx expo export --platform web --clear
      - run: echo 'QA only: no backend changes or production publish'
