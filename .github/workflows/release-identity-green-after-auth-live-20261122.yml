# The only release controller for the user-approved National ID page.
# Runs from existing protected production branch; deploys an immutable site
# based on CURRENT published revision, never the unpublished protected backlog.
name: Guarded approved Green National ID UI (Hosting only)
on:
  push:
    branches: [live-protected]
    paths:
      - '.github/workflows/release-identity-green-after-auth-live-20261122.yml'
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  publish-approved-identity-ui:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/live-protected'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 70
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
      PROJECT: 'volunserve-3aa5b'
      EXPECTED_LIVE: '82f7c0c7c6ea255b8669cd1b6c6f58b192d29a85'
      SOURCE_SHA: '98bf9ef81d71a6e11363e7cd536b8d75a42880da'
      SOURCE_BRANCH: 'site/identity-green-national-id-from-live-82f7-20261122'
      BACKUP_CHANNEL: 'identity-green-before-20261122'

    steps:
      - name: Checkout only protected release controller
        uses: actions/checkout@v4
        with:
          path: controller
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Checkout exact approved site source from latest live
        uses: actions/checkout@v4
        with:
          path: site
          ref: '98bf9ef81d71a6e11363e7cd536b8d75a42880da'
          fetch-depth: 0
          submodules: false
      - name: FAIL CLOSED on stale production, changed branch, other modules, or controller
        working-directory: site
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict'),cp=require('node:child_process');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const base=process.env.EXPECTED_LIVE,source=process.env.SOURCE_SHA;
          const expectedController='.github/workflows/release-identity-green-after-auth-live-20261122.yml';
          (async()=>{
            assert.match(base,/^[0-9a-f]{40}$/); assert.match(source,/^[0-9a-f]{40}$/);
            assert.equal(git('rev-parse','HEAD'),source,'BLOCKED wrong site source');
            cp.execFileSync('git',['merge-base','--is-ancestor',base,source]);
            const branchHead=git('ls-remote','--heads','origin',process.env.SOURCE_BRANCH).split(/\s+/)[0];
            assert.equal(branchHead,source,'BLOCKED site source branch changed after testing');
            const protectedHead=git('ls-remote','--heads','origin','live-protected').split(/\s+/)[0];
            assert.equal(protectedHead,process.env.GITHUB_SHA,'BLOCKED protected release controller changed');
            const controllerChanges=cp.execFileSync('git',[
              '-C','../controller','diff','--name-status','--no-renames','HEAD^','HEAD'
            ],{encoding:'utf8'}).trim();
            assert.equal(controllerChanges,'M\t'+expectedController,
              'BLOCKED protected source contains unrelated, outdated or deleted modules');
            const changes=git('diff','--name-status','--no-renames',base,source).split('\n');
            assert.deepEqual(changes.sort(),[
              'A\t.github/workflows/qa-identity-green-live82f7-no-deploy-20261122.yml',
              'M\tapp/identity-verification.web.tsx'
            ].sort(),'BLOCKED unrelated changes in proposed production site');
            assert.equal(git('rev-parse',base+':app/identity-verification.web.tsx'),
              '8d0fc4159000657c72e6c44314cd236a713fb01e',
              'BLOCKED base identity UI source changed');
            assert.equal(git('rev-parse',source+':app/identity-verification.web.tsx'),
              'aa4a88ca1b1d55c8eb337e3988e2fc954b4030d0',
              'BLOCKED requested design source changed');
            const cfg=JSON.parse(require('node:fs').readFileSync('.firebaserc','utf8'));
            assert.equal(cfg.projects.default,process.env.PROJECT,'BLOCKED Firebase target changed');
            const r=await fetch('https://volunserve.com/volunserve-release.json?check='+Date.now(),
              {headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            assert(r.ok,'BLOCKED production marker not reachable');
            const marker=await r.json();
            assert.equal(marker.app,'VolunServe');
            assert.equal(marker.firebaseProject,process.env.PROJECT);
            assert.equal(marker.revision,base,'BLOCKED current live changed, do NOT overwrite newer VolunServe');
            console.log('PASS exact current live source; only requested National ID UI + offline QA');
            console.log('PASS protected controller changed only one approved release workflow');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Set up Node with existing dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned existing dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Type-check and preserve existing authentication routes
        working-directory: site
        run: |
          set -euo pipefail
          npx tsc --noEmit --incremental false
          node scripts/test-unified-login-routing.cjs
          node scripts/test-login-field-validation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-route-entrypoints.cjs
          node scripts/test-guest-readonly-preview.cjs
      - name: Build exact complete Hosting website without releasing yet
        working-directory: site
        run: |
          set -euo pipefail
          npx expo export --platform web --clear
          env -u GITHUB_SHA node scripts/verify-hosting-release.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict'),m=require('./dist/volunserve-release.json');
          assert.equal(m.revision,process.env.SOURCE_SHA,'BLOCKED artifact revision mismatch');
          assert.equal(m.firebaseProject,process.env.PROJECT);
          console.log('PASS current full website built from exact approved source');
          NODE
      - name: Recheck production marker and securely provide production Hosting credential
        id: validate
        working-directory: site
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SA" || { echo 'BLOCKED production environment credential unavailable'; exit 1; }
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          (async()=>{
            const key=JSON.parse(process.env.FIREBASE_SA);
            assert.equal(key.type,'service_account');
            assert.equal(key.project_id,process.env.PROJECT,'BLOCKED wrong production Firebase project');
            assert.ok(key.private_key && key.client_email);
            const r=await fetch('https://volunserve.com/volunserve-release.json?before='+Date.now(),
              {headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            assert(r.ok);const m=await r.json();
            assert.equal(m.revision,process.env.EXPECTED_LIVE,'BLOCKED production changed before backup');
            const dest=process.env.RUNNER_TEMP+'/identity-green-hosting-service-account.json';
            fs.writeFileSync(dest,process.env.FIREBASE_SA,{mode:0o600});
            console.log('PASS approved production credential and current Hosting revision');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/identity-green-hosting-service-account.json" >> "$GITHUB_ENV"
      - name: Back up CURRENT live Hosting before any publish
        id: backup
        working-directory: site
        run: |
          set -euo pipefail
          export VOLUNSERVE_HOSTING_URL='https://volunserve.com'
          export VOLUNSERVE_EXPECTED_SHA="$EXPECTED_LIVE"
          node scripts/check-live-hosting.cjs
          npx firebase-tools hosting:clone "$PROJECT:live" "$PROJECT:$BACKUP_CHANNEL" --project "$PROJECT" --non-interactive
          echo 'PASS live Hosting backed up; no Auth/Firestore/Render changes'
      - name: Publish EXACT reviewed site to Firebase Hosting ONLY
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
          entryPoint: ./site
      - name: Verify live Hosting serves exact new revision and existing public routes
        id: verify
        working-directory: site
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: '98bf9ef81d71a6e11363e7cd536b8d75a42880da'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then
              echo 'PASS exact approved National ID design is on volunserve.com'
              echo 'PASS no Firebase rules/functions/data, Auth, backend or Render deploy'
              exit 0
            fi
            sleep 10
          done
          echo 'BLOCKED postdeploy revision/route verification failed; rollback required'
          exit 1
      - name: Restore saved Hosting if deployment or postdeploy checks fail
        if: failure() && steps.backup.outcome == 'success' && steps.deploy.outcome != 'skipped'
        working-directory: site
        run: |
          npx firebase-tools hosting:clone "$PROJECT:$BACKUP_CHANNEL" "$PROJECT:live"             --project "$PROJECT" --non-interactive
          echo 'Restored previous Hosting release (no database changes)'
