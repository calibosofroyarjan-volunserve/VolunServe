name: Unified Original National ID Face-Only AI (NO DEPLOY)
on:
  push:
    branches:
      - qa/unified-original-face-only-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-and-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact approved source scope and ORIGINAL unchanged matcher
        uses: actions/github-script@v7
        with:
          script: |
            const assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const base='f98fd84756b003e6acb2f7d14420fc899b1c8fe5';
            const history='c1eae1817aa8';
            const hosting='5af28d279618dacd5eab518e5e0d52259eae8844';
            const {data}=await github.rest.repos.compareCommits({owner,repo,base,head:context.sha});
            assert.equal(data.behind_by,0,'Cannot roll back pinned Node candidate');
            assert.deepEqual((data.files||[]).map(f=>f.filename).sort(),[
              '.github/workflows/qa-unified-original-face-only-20261125.yml',
              'backend/server.js',
              'backend/test-original-face-only-integration-20261125.cjs',
              'identity-ai/main.py',
              'scripts/test-original-face-only-python-20261125.py',
              'app/identity-verification.web.tsx',
              'app/(admin)/identity-reviews.tsx',
              'lib/identityVerification.ts',
            ].sort(),'Only bounded original identity files changed; no live features/rules or deployments');
            core.info('PASS: strictly bounded source changes, all other Node service files preserved');
            const read=async(path,ref)=>{
              const r=await github.rest.repos.getContent({owner,repo,path,ref});
              assert.equal(r.data.encoding,'base64','Source unavailable');
              return Buffer.from(r.data.content,'base64').toString('utf8');
            };
            const [first,current,originalUI,currentUI]=await Promise.all([
              read('identity-ai/main.py',history),
              read('identity-ai/main.py',context.sha),
              read('app/identity-verification.web.tsx',hosting),
              read('app/identity-verification.web.tsx',context.sha)
            ]);
            const originalMatcher=s=>{
              const start=s.indexOf('def run_face_verification(');
              assert.ok(start>=0);
              const next=s.slice(start+1).search(/^(?:@app\.|@lru_cache|def |async def |class )/m);
              return next<0?s.slice(start).trimEnd():s.slice(start,start+1+next).trimEnd();
            };
            assert.equal(originalMatcher(first),originalMatcher(current),
              'Historical original face matcher must stay byte-for-byte identical');
            core.info('PASS: original Oct-23 1:1 face-matching function fully unchanged');
            const styles=s=>s.slice(s.lastIndexOf('const styles = StyleSheet.create('));
            assert.equal(styles(currentUI),styles(originalUI),'Published VolunServe design must stay unchanged');
            for(const label of ['Front of National ID','Back of National ID','Open Camera','Upload File','Government ID Details']){
              assert.ok(currentUI.includes(label),'Original UI item lost: '+label);
            }
            core.info('PASS: exact screenshot identity page design and BOTH front/back cards retained');
            core.info('NO DEPLOY: only synthetic/no-secret CI and source checks authorized');
  node-and-python-contract:
    needs: scope-and-history
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks (never load real Firebase or face model)
        run: |
          node --check backend/server.js
          node --check backend/identityAiReadiness.js
          node --check backend/identityPrivateEvidence.js
          node --check backend/test-original-face-only-qa-20261125.cjs
          node --check backend/test-original-face-only-integration-20261125.cjs
          python -m py_compile identity-ai/main.py scripts/test-original-face-only-python-20261125.py
      - name: Execute ORIGINAL matcher synthetic Python regression
        run: python scripts/test-original-face-only-python-20261125.py
      - name: Run secure evidence and live-key handshake simulators without secret access
        run: |
          node --test backend/test-original-face-only-qa-20261125.cjs
          node --test backend/test-original-face-only-integration-20261125.cjs
      - name: No live mutation marker
        run: |
          echo 'PASS: test-only local HTTP listener; zero production requests or image uploads'
          echo 'Not proof of real face accuracy, government issuer authenticity or PAD/liveness.'
  resident-admin-web:
    needs: scope-and-history
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original OCR and face-only routes remain separately gated
        run: |
          node - <<'JS'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const ui=fs.readFileSync('app/identity-verification.web.tsx','utf8');
          const admin=fs.readFileSync('app/(admin)/identity-reviews.tsx','utf8');
          const lib=fs.readFileSync('lib/identityVerification.ts','utf8');
          const server=fs.readFileSync('backend/server.js','utf8');
          assert.ok(ui.includes('EXPO_PUBLIC_VOLUNSERVE_ORIGINAL_FACE_ONLY === "true"'));
          assert.ok(ui.includes('...(idType === "passport" ? [] : ['));
          assert.ok(ui.includes('Optional for face comparison'));
          assert.ok(ui.includes('!faceOnlyMode && documentPrecheckScreening'));
          assert.ok(lib.includes('/api/identity/verify-face-only'));
          assert.ok(lib.includes('/api/identity/face-engine-health'));
          assert.ok(lib.includes('/api/identity/verify-with-evidence'));
          assert.ok(server.includes('VOLUNSERVE_FACE_ONLY_ENABLED'));
          assert.ok(admin.includes('item.aiDecision === "manual_review"'));
          assert.ok(admin.includes('item.evidenceAvailable === true'));
          assert.ok(admin.includes('issuerReviewAttested'));
          console.log('PASS: original face-only connected, OCR opt-in separated, Admin final approval protected');
          JS
      - name: TypeScript compilation and dependency reproducibility
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit --pretty false
      - name: No Firebase Hosting deployment marker
        run: |
          echo 'PASS NO DEPLOY: same screenshot UI, no Firebase Hosting or credentials used'
