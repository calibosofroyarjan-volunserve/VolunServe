name: Auto Volunteer Phase 9 Admin cancellation + local Auth E2E - NO DEPLOY
on:
  pull_request:
    branches:
      - qa/auto-volunteer-phase8-pending-wave-scheduler-20261119
    paths:
      - "backend/autoVolunteerPhase9SafeCancelEmulator.js"
      - "backend/autoVolunteerPhase9DueScanEmulator.js"
      - "backend/test-autoVolunteerPhase9AuthCancelEmulator.cjs"
      - "docs/emergency-volunteer/PHASE9_SAFE_CANCEL_AUTH_DUE_SCAN_20261119.md"
      - ".github/workflows/qa-auto-volunteer-phase9-auth-cancel-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-auth-firestore-emulator-cancellation-no-deploy:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-volunserve-auto-phase4
      GOOGLE_CLOUD_PROJECT: demo-volunserve-auto-phase4
      VOLUNSERVE_AUTO_VOLUNTEER_PHASE6_EMULATOR_WRITE: enabled
      VOLUNSERVE_AUTO_VOLUNTEER_DISPATCH: disabled
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict five-file Phase 9 diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin qa/auto-volunteer-phase8-pending-wave-scheduler-20261119
          git diff --name-only origin/qa/auto-volunteer-phase8-pending-wave-scheduler-20261119 HEAD > /tmp/phase9-files
          while IFS= read -r f; do
            case "$f" in
              "backend/autoVolunteerPhase9SafeCancelEmulator.js"|"backend/autoVolunteerPhase9DueScanEmulator.js"|"backend/test-autoVolunteerPhase9AuthCancelEmulator.cjs"|"docs/emergency-volunteer/PHASE9_SAFE_CANCEL_AUTH_DUE_SCAN_20261119.md"|".github/workflows/qa-auto-volunteer-phase9-auth-cancel-20261119.yml") ;;
              *) echo "BLOCKED: unexpected production/runtime file: $f"; exit 1 ;;
            esac
          done < /tmp/phase9-files
          echo "PASS: exactly five emulator/documentation/CI files allowed."
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Phase 9 source syntax and production server exclusion
        run: |
          node --check backend/autoVolunteerPhase9SafeCancelEmulator.js
          node --check backend/autoVolunteerPhase9DueScanEmulator.js
          node --check backend/test-autoVolunteerPhase9AuthCancelEmulator.cjs
          if grep -Eq 'autoVolunteerPhase9SafeCancelEmulator|autoVolunteerPhase9DueScanEmulator' backend/server.js; then
            echo "BLOCKED: Phase 9 emulator must NEVER mount to production server"
            exit 1
          fi
      - name: REAL DEMO Auth token verification + Firestore cancellation race E2E
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo "BLOCKED: no production credentials permitted"; exit 1; }
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" || { echo "BLOCKED: no service-account credentials permitted"; exit 1; }
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only auth,firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase9AuthCancelEmulator.cjs"
      - name: Phase 8 and Phase 7-5 Firestore emulator regressions
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase8PendingSchedulerEmulator.cjs backend/test-autoVolunteerPhase7WaveEmulator.cjs backend/test-autoVolunteerPhase6DecisionEmulator.cjs backend/test-autoVolunteerFirestoreEmulator.cjs backend/test-autoVolunteerPhase5CompatEmulator.cjs backend/test-autoVolunteerPhase5RulesEmulator.cjs"
      - name: Prior safe guards and current backend regressions
        run: |
          node --test backend/test-emergencyVolunteerWinnerGuard.cjs
          node --test backend/test-emergencyAutoVolunteerReadOnlyPlanner.cjs
          node --test backend/test-autoVolunteerAdminReadOnlyPreview.cjs
          node --test backend/test-autoVolunteerAtomicDecisionPolicy.cjs
          npm run check --prefix backend
      - name: Explicit no production scheduler or deployment authorization
        run: |
          echo "NO PRODUCTION Firebase, Render, Hosting, Cloud Tasks or Cloud Scheduler deploy."
          echo "EMULATOR-ONLY token verification is NOT production Auth validation."
          echo "A due-batch scan is NOT an autonomous 24/7 job trigger."
