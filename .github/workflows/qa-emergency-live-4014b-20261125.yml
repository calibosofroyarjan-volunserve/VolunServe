name: QA Emergency current-live 4014b (NO DEPLOY)
on:
  pull_request:
    branches:
      - snapshot/prod-hosting-4014b-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-qa:
    name: Validate live-derived manual Emergency Response
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Confirm exact Hosting-snapshot ancestry and no production config changes
        shell: bash
        run: |
          set -euo pipefail
          LIVE=4014b18329f3eb2cd366fcb21b1f93e0ab4b842e
          git merge-base --is-ancestor "$LIVE" HEAD
          git diff --exit-code "$LIVE" HEAD --             firestore.rules functions/index.js lib/firebase.ts firebase.json             backend/server.js package.json package-lock.json             storage.rules .firebaserc
          node <<'NODE'
          "use strict";
          const {execFileSync}=require("node:child_process");
          const assert=require("node:assert/strict");
          const changed=execFileSync("git",["diff","--name-only","--no-renames","4014b18329f3eb2cd366fcb21b1f93e0ab4b842e","HEAD"],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
          const allowed=new Set([
            "app/(admin)/admin-cases.tsx",
            "app/(tabs)/disaster-response.tsx",
            "app/(tabs)/my-cases.tsx",
            "app/(tabs)/volunteer.tsx",
            "app/(tabs)/volunteer.web.tsx",
            "components/admin/EmergencyFiveTabDesign.tsx",
            "components/admin/VolunteerEligibilityValidation.tsx",
            "components/tabs/MapTracking.native.tsx",
            "components/tabs/ResponseFlow.web.tsx",
            "lib/emergencyArrival.ts",
            "scripts/test-emergency-live-reconciled-20261125.cjs",
            "scripts/test-emergency-manual-flow-emulator-20261125.cjs",
            ".github/workflows/qa-emergency-live-4014b-20261125.yml"
          ]);
          for(const file of changed)assert(allowed.has(file),"BLOCKED unrelated live path "+file);
          // Preserve the exact latest Identity Verification updates on live.
          const immutableIdentity=[
            "app/(admin)/identity-reviews.tsx",
            "app/identity-verification.web.tsx",
            "lib/identityVerification.ts",
          ];
          for(const file of immutableIdentity){
            const result=require("node:child_process").spawnSync("git",[
              "diff","--quiet","4014b18329f3eb2cd366fcb21b1f93e0ab4b842e","HEAD","--",file
            ]);
            assert.equal(result.status,0,"BLOCKED current live AI identity code modified: "+file);
          }
          assert(changed.length>0,"No emergency changes detected");
          console.log("PASS unchanged production security/config/backend and "+changed.length+" scoped Emergency files");
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Emergency Response source and 100 m GPS contracts
        run: node --test scripts/test-emergency-live-reconciled-20261125.cjs
      - name: Verify TypeScript
        run: npx tsc --noEmit --pretty false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Refuse unverified deployed Rules replay fixtures (offline, no secrets)
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {spawnSync}=require('node:child_process');
          const script='scripts/test-emergency-manual-flow-emulator-20261125.cjs';
          const env={...process.env,
            FIRESTORE_EMULATOR_HOST:'127.0.0.1:8080',
            VOLUNSERVE_QA_FIRESTORE_RULES_FILE:'firebase.json',
            VOLUNSERVE_QA_EXPECTED_RULES_SHA256:'0'.repeat(64)};
          const wrongHash=spawnSync(process.execPath,[script],{env,encoding:'utf8',timeout:15000});
          assert.notEqual(wrongHash.status,0,'Bad hash must fail closed');
          assert.match(wrongHash.stderr,/Deployed rules fixture hash mismatch/);
          delete env.VOLUNSERVE_QA_EXPECTED_RULES_SHA256;
          const incomplete=spawnSync(process.execPath,[script],{env,encoding:'utf8',timeout:15000});
          assert.notEqual(incomplete.status,0,'Missing fingerprint must fail closed');
          assert.match(incomplete.stderr,/requires BOTH local file and expected SHA-256/);
          console.log('PASS: unverified and incomplete deployed-rules replay fixtures rejected without connecting to any Firebase service');
          NODE
      - name: Verify Residents, Admins, Volunteers and Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-volunserve-emergency-flow-qa-20261125 "node scripts/test-emergency-manual-flow-emulator-20261125.cjs"
      - name: Replay hash-pinned synthetic local Rules copy in isolated emulator
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$(mktemp -t volunserve-qa-rules-XXXXXX)"
          trap 'rm -f "$FIXTURE"' EXIT
          cp firestore.rules "$FIXTURE"
          SHA="$(sha256sum "$FIXTURE" | cut -d' ' -f1)"
          VOLUNSERVE_QA_FIRESTORE_RULES_FILE="$FIXTURE" \
          VOLUNSERVE_QA_EXPECTED_RULES_SHA256="$SHA" \
          npx firebase emulators:exec --only firestore --project demo-volunserve-emergency-flow-qa-20261125 "node scripts/test-emergency-manual-flow-emulator-20261125.cjs"
      - name: Export web bundle without deploying
        run: npx expo export --platform web --output-dir dist
      # This is deliberately LAST. Isolated tests still execute on a frozen
      # Draft candidate even when production moves, but the overall job FAILS.
      # Never use a test-only success as production release authorization.
      - name: Release BLOCKER — fail closed if Hosting revision changed
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const assert=require("node:assert/strict");
          (async()=>{
            const response=await fetch("https://volunserve.com/volunserve-release.json",{
              headers:{"Cache-Control":"no-cache"},
              signal:AbortSignal.timeout(15000)
            });
            assert.equal(response.status,200,"BLOCKED: live release marker unavailable");
            const marker=await response.json();
            assert.equal(marker.app,"VolunServe","BLOCKED: unexpected Hosting app");
            assert.equal(marker.firebaseProject,"volunserve-3aa5b","BLOCKED: unexpected Firebase project");
            assert.equal(marker.revision,"4014b18329f3eb2cd366fcb21b1f93e0ab4b842e",
              "BLOCKED: production Hosting changed since frozen snapshot");
            console.log("PASS: live Hosting still reports frozen 4014b snapshot");
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
