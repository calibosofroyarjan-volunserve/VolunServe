name: Auto Volunteer Phase 6 Secure Decision SERVER API - FIRESTORE EMULATOR ONLY
on:
  pull_request:
    branches:
      - fix/auto-volunteer-phase5-manual-winner-guard-20261119
    paths:
      - "backend/autoVolunteerPhase6EmulatorDecisionServer.js"
      - "backend/test-autoVolunteerPhase6DecisionEmulator.cjs"
      - "docs/emergency-volunteer/PHASE6_EMULATOR_SERVER_ACCEPT_DECLINE_20261119.md"
      - ".github/workflows/qa-auto-volunteer-phase6-server-emulator-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-automatic-decision-demo-firestore-only:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-volunserve-auto-phase4
      GOOGLE_CLOUD_PROJECT: demo-volunserve-auto-phase4
      VOLUNSERVE_AUTO_VOLUNTEER_PHASE6_EMULATOR_WRITE: enabled
      VOLUNSERVE_AUTO_VOLUNTEER_DISPATCH: disabled
      FIREBASE_CLI_DISABLE_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict four-file Phase 6 allowlist - no production runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/auto-volunteer-phase5-manual-winner-guard-20261119
          git diff --name-only origin/fix/auto-volunteer-phase5-manual-winner-guard-20261119 HEAD > /tmp/phase6-only-files
          while IFS= read -r file; do
            case "$file" in
              "backend/autoVolunteerPhase6EmulatorDecisionServer.js"|"backend/test-autoVolunteerPhase6DecisionEmulator.cjs"|"docs/emergency-volunteer/PHASE6_EMULATOR_SERVER_ACCEPT_DECLINE_20261119.md"|".github/workflows/qa-auto-volunteer-phase6-server-emulator-20261119.yml") ;;
              *) echo "BLOCKED: unrelated runtime change: $file"; exit 1 ;;
            esac
          done < /tmp/phase6-only-files
          echo "PASS: only four additive emulator review and test files."
      - name: Install repository-locked tooling without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Verify write gate, server API and test syntax
        run: |
          node --check backend/autoVolunteerPhase6EmulatorDecisionServer.js
          node --check backend/test-autoVolunteerPhase6DecisionEmulator.cjs
          if grep -Fq 'autoVolunteerPhase6EmulatorDecisionServer' backend/server.js; then
            echo "BLOCKED: Phase 6 emulator-only prototype was mounted into production"
            exit 1
          fi
      - name: Real local emulator server transactions and prior real client security tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo "BLOCKED: production credentials present"; exit 1; }
          ./node_modules/.bin/firebase emulators:exec --project demo-volunserve-auto-phase4 --only firestore "node --test --test-concurrency=1 backend/test-autoVolunteerPhase6DecisionEmulator.cjs backend/test-autoVolunteerFirestoreEmulator.cjs backend/test-autoVolunteerPhase5CompatEmulator.cjs backend/test-autoVolunteerPhase5RulesEmulator.cjs"
      - name: Existing shared guard, wave planner, Admin preview and policy checks
        run: |
          node --test backend/test-emergencyVolunteerWinnerGuard.cjs
          node --test backend/test-emergencyAutoVolunteerReadOnlyPlanner.cjs
          node --test backend/test-autoVolunteerAdminReadOnlyPreview.cjs
          node --test backend/test-autoVolunteerAtomicDecisionPolicy.cjs
      - name: Keep existing signup, identity and certificate regressions intact
        run: npm run check --prefix backend
      - name: No production deployment
        run: |
          echo "NO-GO production. No Render, Hosting, Firebase or Cloud Functions deploy."
          echo "A local emulated authenticated route prototype is NOT a deployed production API."
