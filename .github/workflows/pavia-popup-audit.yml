name: Pavia Whole-App Popup Audit (No Deploy)
on:
  push:
    branches:
      - fix/pavia-final-scope-revisions-20261028
  workflow_dispatch:
jobs:
  popup-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit native dialogs and pagination
        run: node --test scripts/test-pavia-pagination-email.cjs
