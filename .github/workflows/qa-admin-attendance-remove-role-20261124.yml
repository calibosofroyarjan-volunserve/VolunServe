name: QA Admin attendance role removal (NO DEPLOY)
on:
  push:
    branches: [fix/admin-attendance-remove-role-20261124]
  pull_request:
    branches: [fix/attendance-gps-retry-20261124]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract exact candidate
        run: |
          curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm role column removed and attendance controls retained
        run: |
          node <<'NODE'
          const a=require('node:assert/strict'),s=require('node:fs').readFileSync('app/(admin)/community-attendance.tsx','utf8');
          a(!/styles\.colRole|>Assigned Role<|Role not assigned|"Not assigned"/.test(s));
          for(const label of ['Time In','Time Out','Hours','Status','Actions','Not Checked In','Checked In','For Verification','Verified','Verify Attendance'])a(s.includes(label),label);
          a(s.includes('assignedRole?: string;'));
          a(s.includes('preferredRole?: string;'));
          console.log('PASS role display hidden; role fields and attendance controls retained');
          NODE
          node --experimental-strip-types --test scripts/test-attendance-gps-retry.cjs
      - run: npm ci --no-audit --no-fund
      - name: Verify frontend compatibility
        run: |
          npx tsc --noEmit --incremental false
          npx expo export --platform web --clear
      - run: echo 'No production writes or deploy.'
