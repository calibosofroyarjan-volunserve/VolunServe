name: Staging 002 automatic timer heartbeat (synthetic-only CI)
on:
  pull_request:
    branches:
      - feat/emergency-auto-dispatch-server-staging-20261115
    paths:
      - "backend/staging002SchedulerEvidence.js"
      - "backend/test-staging002SchedulerEvidence.cjs"
      - "backend/emergencyAutoDispatchStagingServer.js"
      - "backend/stagingAdminLogin.html"
      - ".github/workflows/qa-staging-002-scheduler-heartbeat-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timer-evidence-no-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked staging backend dependencies without scripts
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check backend/staging002SchedulerEvidence.js
          node --check backend/emergencyAutoDispatchStagingServer.js
      - name: Verify heartbeat claims, privacy and protected Admin UI
        run: node --test backend/test-staging002SchedulerEvidence.cjs
      - name: Existing wave-stop and accepted responder regression
        run: |
          node --test backend/test-staging002WaveStopVerification.cjs
          node --test backend/test-staging002BulkAcceptanceVerifier.cjs
          node --test backend/test-staging002ExpiredBulkRetry.cjs
      - name: No cloud writes or production deployment in CI
        run: echo "All tests mock-based. No staging or production deployment and no Firebase writes."
