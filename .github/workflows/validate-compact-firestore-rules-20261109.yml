name: Verify Compact Firestore Rules and Existing VolunServe Permissions (NO DEPLOY)
on:
  pull_request:
    branches: [live-protected]
    paths:
      - firestore.rules
      - scripts/test-firestore-rules-compact-allowlists.cjs
      - scripts/test-assistance-review-merged-gates.cjs
      - .github/workflows/validate-compact-firestore-rules-20261109.yml
  push:
    branches: [live-protected]
    paths:
      - firestore.rules
      - scripts/test-firestore-rules-compact-allowlists.cjs
      - scripts/test-assistance-review-merged-gates.cjs
      - .github/workflows/validate-compact-firestore-rules-20261109.yml
permissions:
  contents: read
jobs:
  compact-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exhaustive equivalent allowlist and authorization checks
        run: |
          node --check scripts/test-firestore-rules-compact-allowlists.cjs
          node scripts/test-firestore-rules-compact-allowlists.cjs
      - run: npm ci --no-audit --no-fund
      - name: Existing Auth/Resident/Superadmin/Guest permissions (emulator only)
        run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve-account-compatibility "node scripts/test-existing-account-compatibility.cjs"
      - name: Enforce direct-SDK Signup inputs and unverified denial (emulator only)
        run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve-verified-signup "node scripts/test-verified-community-registration-rules.cjs"
      - name: Ensure volunteer invitations still work (emulator only)
        run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve-preserve-volunteer-invitations "node scripts/test-preserved-volunteer-invitation-rules.cjs"
      - name: Preserve Assistance Review create/update/immutable restrictions (emulator only)
        run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve-review-gates "node scripts/test-assistance-review-merged-gates.cjs"
      - name: Offline only
        run: echo 'PASS - no Firestore Rules release, Hosting publish, or production data changes'
