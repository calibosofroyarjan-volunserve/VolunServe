name: Auto Volunteer Phase 14 OFF-by-default STAGING STARTUP - NO DEPLOY
on:
  pull_request:
    branches:
      - review/auto-volunteer-phase13-iam-readonly-bootstrap-20261119
    paths:
      - "backend/autoVolunteerPhase14StagingServer.cjs"
      - "backend/test-autoVolunteerPhase14StagingServer.cjs"
      - "docs/emergency-volunteer/PHASE14_NEW_STAGING_SERVICE_ENTRYPOINT_20261119.md"
      - ".github/workflows/qa-auto-volunteer-phase14-staging-entrypoint-20261119.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-offline-staging-listener-no-deploy:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      VOLUNSERVE_AUTO_VOLUNTEER_DISPATCH: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Strict Phase 14 FOUR NEW FILES ONLY
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin review/auto-volunteer-phase13-iam-readonly-bootstrap-20261119
          git diff --name-status origin/review/auto-volunteer-phase13-iam-readonly-bootstrap-20261119 HEAD > /tmp/phase14-changed
          while IFS="$(printf '\t')" read -r status filename; do
            test "$status" = A || { echo "BLOCKED: existing runtime file modified: $filename"; exit 1; }
            case "$filename" in
              "backend/autoVolunteerPhase14StagingServer.cjs"|"backend/test-autoVolunteerPhase14StagingServer.cjs"|"docs/emergency-volunteer/PHASE14_NEW_STAGING_SERVICE_ENTRYPOINT_20261119.md"|".github/workflows/qa-auto-volunteer-phase14-staging-entrypoint-20261119.yml") ;;
              *) echo "BLOCKED: unexpected file in Phase 14: $filename"; exit 1 ;;
            esac
          done < /tmp/phase14-changed
          echo "PASS: four additive review files, no backend/package.json or active service changes."
      - name: Confirm original live & historically accepted staging entrypoints untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./backend/package.json").scripts.start')" = "node server.js"
          if grep -Fq 'autoVolunteerPhase14StagingServer' backend/server.js; then
            echo "BLOCKED: new isolated staging launcher wired into production"
            exit 1
          fi
          git fetch --no-tags origin feat/emergency-auto-dispatch-server-staging-20261115
          git show origin/feat/emergency-auto-dispatch-server-staging-20261115:backend/emergencyAutoDispatchStagingServer.js > /tmp/phase14-accepted-staging-server.js
          test -s /tmp/phase14-accepted-staging-server.js
          if grep -Fq 'autoVolunteerPhase14StagingServer' /tmp/phase14-accepted-staging-server.js; then
            echo "BLOCKED: previous accepted responder staging server changed"
            exit 1
          fi
          echo "PASS: original production start and accepted staging server remain unmodified."
      - name: Install backend dependencies without lifecycle scripts or cloud credentials
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Syntax and localhost-only fake Firebase Admin HTTP startup tests
        run: |
          node --check backend/autoVolunteerPhase14StagingServer.cjs
          node --check backend/test-autoVolunteerPhase14StagingServer.cjs
          node --test --test-concurrency=1 backend/test-autoVolunteerPhase14StagingServer.cjs
      - name: Prior read-only IAM, Auth interface and source preview safety tests
        run: |
          node --test --test-concurrency=1 backend/test-autoVolunteerPhase13ReadOnlyCloudBootstrap.cjs
          node --test --test-concurrency=1 backend/test-autoVolunteerPhase12CloudPreviewAdapter.cjs
          node --test backend/test-autoVolunteerPhase11CloudIsolationGate.cjs
          node --test backend/test-autoVolunteerAdminReadOnlyPreview.cjs
          node --test backend/test-emergencyAutoVolunteerReadOnlyPlanner.cjs
          node --test backend/test-emergencyVolunteerWinnerGuard.cjs
      - name: Existing signup, identity and automatic certificate regression checks
        run: npm run check --prefix backend
      - name: Explicit NO CLOUD ACTIONS
        run: |
          echo "NO Firebase cloud Auth or database access, IAM grants, service account keys, or new Firebase project."
          echo "NO Render new service, update, deploy, Hosting, Cloud Tasks or Scheduler deployment."
          echo "Offline localhost mock tests do NOT verify effective cloud IAM or production ready state."
          echo "Production and accepted historical staging unchanged; dispatch remains OFF."
