name: Restore Volunteer Tracked Hours - Guarded Hosting ONLY
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-volunteer-attendance-hours-20261106.yml
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERIFIED_LIVE_BASE: 4a340c7fc31d35a4e44e0e09c0dd1f9c7656ee69
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard unchanged Login, Signup, Admin, Donations, Event Join and Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VERIFIED_LIVE_BASE" HEAD
          UNEXPECTED="$(git diff --name-only "$VERIFIED_LIVE_BASE" HEAD | grep -Ev '^(app/\(tabs\)/certificate\.tsx|components/volunteers/VolunteerAttendanceSummary\.tsx|\.github/workflows/release-volunteer-attendance-hours-20261106\.yml)$' || true)"
          if [ -n "$UNEXPECTED" ]; then echo "::error::Unexpected changes: $UNEXPECTED"; exit 1; fi
          git diff --exit-code "$VERIFIED_LIVE_BASE" HEAD -- 'app/(tabs)/community-events.tsx' 'app/login.tsx' 'app/login.web.tsx' 'app/signup.tsx' 'app/signup.web.tsx' 'app/(admin)' 'app/(superadmin)' 'components/donations' 'firestore.rules' 'firebase.json' 'backend'
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const screen=fs.readFileSync('app/(tabs)/certificate.tsx','utf8');
          const panel=fs.readFileSync('components/volunteers/VolunteerAttendanceSummary.tsx','utf8');
          assert(screen.includes('<VolunteerAttendanceSummary uid={user.uid} />'));
          assert(panel.includes('where("uid", "==", uid)'));
          assert(panel.includes('attendanceVerified === true'));
          assert(screen.includes('community_event_participation'));
          console.log('PASS private tracked hours and existing certificate issuance preserved');
          NODE
      - name: Verify source currently live before touching Hosting
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ env.VERIFIED_LIVE_BASE }}
        run: node scripts/check-live-hosting.cjs
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript and original web routes
        run: |
          npx tsc --noEmit --incremental false
          npx expo export --platform web --clear
          node scripts/verify-hosting-release.cjs
      - name: Require Firebase credentials and current live base
        shell: bash
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ env.VERIFIED_LIVE_BASE }}
        run: |
          test -n "$FIREBASE_SA" || { echo "::error::No production credentials"; exit 1; }
          node scripts/check-live-hosting.cjs
      - name: Deploy Firebase Hosting ONLY (never rules, Auth, data or backend)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Confirm current deployed revision on custom production domain
        shell: bash
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            sleep 10
          done
          echo "::error::Exact live Hosting revision could not be verified"; exit 1
