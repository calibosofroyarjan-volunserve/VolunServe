name: Emergency Reports Master Detail Preview - NO DEPLOY
on:
  pull_request:
    branches:
      - preview/current-hosting-baseline-20261118
    paths:
      - "app/(admin)/admin-cases.tsx"
      - "components/admin/EmergencyFiveTabDesign.tsx"
      - "scripts/test-admin-emergency-master-detail-20261118.cjs"
      - ".github/workflows/qa-admin-emergency-master-detail-20261118.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify master-detail layout and safe real-data binding
        run: node scripts/test-admin-emergency-master-detail-20261118.cjs
      - name: Validate Expo web export, without hosting deployment
        run: npx expo export --platform web --output-dir /tmp/volunserve-emergency-master-detail
      - name: Confirm no credentials or live deploy were used
        run: echo "NO FIREBASE DEPLOY; NO RENDER DEPLOY; NO DATABASE WRITES"
