name: Inspect Live LGU Approval Firestore Rules Before Safe Deployment
on:
  push:
    branches: [release/lgu-admin-decisions-live-20261105]
    paths: [.github/workflows/inspect-production-lgu-rules-20261105.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read exact live Firestore policy lines for applicant and approval, no data access
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,urllib.request,hashlib
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True).strip()
          def get(url):
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
            with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          prefix="https://firebaserules.googleapis.com/v1/"
          release=get(prefix+"projects/volunserve-3aa5b/releases/cloud.firestore")
          ruleset=release['rulesetName']
          rules=get(prefix+ruleset)
          txt=max((d.get('content','') for d in rules['source']['files']),key=len)
          lines=txt.splitlines()
          print("RULESET:",ruleset)
          print("LIVE_SHA256:",hashlib.sha256(txt.encode()).hexdigest())
          anchors=["function isAdmin()","function isSuperAdmin()","match /users/{uid}","match /lguAdminCredentialReviews/{uid}","match /adminLogs/{logId}","hasFreshLguCredentialReview","allow create: if isSuperAdmin()"]
          for term in anchors:
            found=[i for i,l in enumerate(lines) if term in l]
            print("\nANCHOR",term,"count",len(found),"line_numbers",[i+1 for i in found[:8]])
            for i in found[:2]:
              context=6 if term.startswith('function ') else 30
              for j in range(max(0,i-3),min(len(lines),i+context)):
                print(str(j+1)+": "+lines[j][:280])
          idx=next((i for i,l in enumerate(lines) if 'match /users/{uid}' in l),-1)
          if idx<0:raise SystemExit("Missing users rules")
          for a,b in [(idx+15,idx+95),(idx+380,idx+535)]:
            print("\nUSER_RULES",a+1,b)
            for i in range(a,min(b,len(lines))):print(str(i+1)+": "+lines[i][:280])
          print("READ_ONLY no Firebase or code changes")
          PY
