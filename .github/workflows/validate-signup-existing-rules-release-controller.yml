# Tests only. No credentials. No Firestore/Hosting changes.
name: Validate Signup Existing-Rules PATCH Release Controller (NO DEPLOY)
on:
  pull_request:
    branches: [live-protected]
    paths:
      - scripts/release-signup-production-preflight.cjs
      - .github/workflows/release-reviewed-site-derived-signup-20261109.yml
      - .github/workflows/validate-signup-existing-rules-release-controller.yml
permissions:
  contents: read
jobs:
  offline-release-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate controller syntax and exact Firebase Rules REST payloads, no production access
        run: |
          node --check scripts/release-signup-production-preflight.cjs
          node scripts/release-signup-production-preflight.cjs --self-test
      - name: Verify optimized Rules are tested and staged from protected branch before publish
        run: |
          node -e 'const fs=require("fs");const w=fs.readFileSync(".github/workflows/release-reviewed-site-derived-signup-20261109.yml","utf8");const ctl=fs.readFileSync("scripts/release-signup-production-preflight.cjs","utf8");const preserve=w.indexOf("node scripts/test-site-derived-signup-candidate.cjs"),copy=w.indexOf("cp ../controller/firestore.rules firestore.rules"),tests=w.indexOf("node scripts/test-signup-prod.cjs");if(!(preserve>=0&&copy>preserve&&tests>copy&&w.includes("--compile-rules")&&ctl.includes("testCases:[]")))process.exit(1);console.log("PASS: preserved site + protected compact Rules compiled and emulator-tested before guarded publish")'
      - name: Assert existing preview and backup are checked before any live Rules update
        run: |
          node -e 'const fs=require("fs");const s=fs.readFileSync(".github/workflows/release-reviewed-site-derived-signup-20261109.yml","utf8");if(!s.includes("--check-channels")||s.includes("firebase-tools hosting:channel:deploy")||s.includes("hosting:clone \"$PROJECT:live\" \"$PROJECT:$BACKUP_CHANNEL\""))process.exit(1);console.log("PASS: verified reuse of existing immutable Hosting backup and reviewed preview")'
      - name: Assert production workflow has required direct PATCH and original release restoration
        run: |
          node -e 'const fs=require("fs");const s=fs.readFileSync(".github/workflows/release-reviewed-site-derived-signup-20261109.yml","utf8"); if(!s.includes("scripts/release-signup-production-preflight.cjs --publish-rules")||!s.includes("scripts/release-signup-production-preflight.cjs --restore-rules")||s.includes("firebase-tools deploy --only firestore:rules")||!s.includes("environment: production"))process.exit(1); console.log("PASS: publish/restoration use explicit protected API mode, never fallback CLI create")'
