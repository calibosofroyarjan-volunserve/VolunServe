name: QA green/red National ID name status on latest Hosting (NO DEPLOY)

on:
  push:
    branches:
      - feature/identity-name-green-red-feedback-web-live-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-identity-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
      VOLUNSERVE_HOSTING_URL: https://volunserve.com
      VOLUNSERVE_EXPECTED_SHA: 98bf9ef81d71a6e11363e7cd536b8d75a42880da
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Fail on unrelated app or Firebase changes
        run: |
          set -euo pipefail
          BASE=98bf9ef81d71a6e11363e7cd536b8d75a42880da
          git diff --name-status --no-renames "$BASE" HEAD >/tmp/identity-ui-changes
          python - <<'PY'
          from pathlib import Path
          actual=sorted(Path('/tmp/identity-ui-changes').read_text().strip().splitlines())
          expected=sorted([
            'M\tapp/identity-verification.web.tsx',
            'M\tlib/identityVerification.ts',
            'M\tcomponents/identity/DocumentScreeningSummary.tsx',
            'A\t.github/workflows/qa-name-check-soft-feedback-web-20261122.yml',
          ])
          assert actual==expected,(actual,expected)
          print('PASS only focused OCR feedback UI and parser changes from current live')
          PY
          git diff --check "$BASE" HEAD
      - name: Confirm live Hosting unchanged, read-only
        run: node scripts/check-live-hosting.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current production dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and existing auth/route regressions
        run: |
          set -euo pipefail
          npx tsc --noEmit --incremental false
          node scripts/test-unified-login-routing.cjs
          node scripts/test-login-field-validation.cjs
          node scripts/test-login-ui-release.cjs
          node scripts/test-route-entrypoints.cjs
          node scripts/test-guest-readonly-preview.cjs
      - name: Complete web export without deploying
        run: |
          npx expo export --platform web --clear
          env -u GITHUB_SHA node scripts/verify-hosting-release.cjs
          node - <<'NODE'
          const m=require('./dist/volunserve-release.json'), assert=require('node:assert/strict');
          assert.equal(m.firebaseProject,'volunserve-3aa5b');
          assert.equal(m.revision,require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());
          console.log('PASS exact reviewed web revision');
          NODE
      - run: echo 'NO DEPLOY - no production Auth, Firestore, Hosting or Render writes'
