name: Read-only Assistance Release Baseline Audit (NO DEPLOY)
on:
  pull_request:
    branches: [live-protected]
    paths:
      - '.github/workflows/audit-assistance-production-marker-20261119.yml'
permissions:
  contents: read
jobs:
  identify-live-revision:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read production Hosting marker only
        shell: bash
        run: |
          node <<'NODE'
          const cp=require('node:child_process');
          async function main(){
            const response=await fetch('https://volunserve.com/volunserve-release.json',
              {headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(16000)});
            if(!response.ok)throw Error('Production marker unavailable HTTP '+response.status);
            const marker=await response.json();
            if(marker.app!=='VolunServe'||marker.firebaseProject!=='volunserve-3aa5b'||
              !/^[a-f0-9]{40}$/.test(marker.revision||'')){
              throw Error('Live marker is unexpected; blocked');
            }
            console.log('PRODUCTION_HOSTING_REVISION='+marker.revision);
            console.log('PRODUCTION_FIREBASE_PROJECT='+marker.firebaseProject);
            const branch=cp.execFileSync('git',['rev-parse','origin/live-protected'],
              {encoding:'utf8'}).trim();
            console.log('PROTECTED_SOURCE_REVISION='+branch);
            const exists=cp.spawnSync('git',['cat-file','-e',marker.revision+'^{commit}']);
            console.log('LIVE_REVISION_IN_REPO='+(exists.status===0?'yes':'no'));
            if(exists.status!==0)throw Error('Live revision missing from checked-out repo; cannot safely deploy');
            const ancestor=cp.spawnSync('git',['merge-base','--is-ancestor',marker.revision,branch]);
            console.log('LIVE_REVISION_ANCESTOR_OF_PROTECTED='+(ancestor.status===0?'yes':'no'));
            console.log('READ_ONLY: No deploys, mutations, secrets, or database connections.');
          }
          main().catch(e=>{console.error('SAFETY_BLOCK: '+e.message);process.exitCode=1});
          NODE
