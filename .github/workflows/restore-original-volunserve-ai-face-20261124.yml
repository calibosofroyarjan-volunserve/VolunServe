# One-time Hosting-only release. Fails closed on newer live revisions.
# Restores exact original live VolunServe AI verification without Didit. No database writes.
name: Restore original VolunServe AI Verification (Hosting only rollback)
on:
  push:
    branches: [live-protected]
    paths: ['.github/workflows/restore-original-volunserve-ai-face-20261124.yml']
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.ref == 'refs/heads/live-protected'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      SITE: volunserve-3aa5b
      BASE_SHA: a980a7497377cfa995dc82568467575aa89a0dae
      SOURCE_SHA: 5af28d279618dacd5eab518e5e0d52259eae8844
      EXPO_PUBLIC_DIDIT_PRESENTATION_ENABLED: 'false'
      EXPO_PUBLIC_VOLUNSERVE_ENV: production
      EXPO_PUBLIC_VOLUNSERVE_FIREBASE_TARGET: production
      EXPO_PUBLIC_IDENTITY_VERIFICATION_API_URL: https://volunserve.onrender.com
    steps:
      - name: Checkout exact release controller
        uses: actions/checkout@v4
        with:
          path: controller
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Checkout exact original pre-Didit production source
        uses: actions/checkout@v4
        with:
          path: site
          ref: 5af28d279618dacd5eab518e5e0d52259eae8844
          fetch-depth: 0
          submodules: false
      - name: Verify exact original AI-only source and currently published Didit revision
        working-directory: site
        run: |
          node <<'NODE'
          const a=require("node:assert/strict"),fs=require("node:fs"),cp=require("node:child_process");
          const git=(...parts)=>cp.execFileSync("git",parts,{encoding:"utf8"}).trim();
          async function main(){
            a.equal(git("rev-parse","HEAD"),process.env.SOURCE_SHA,"wrong original source revision");
            a.equal(JSON.parse(fs.readFileSync(".firebaserc","utf8")).projects.default,process.env.SITE);
            const livePage=fs.readFileSync("app/identity-verification.web.tsx","utf8");
            a(livePage.includes("<WizardProgress step={step} />"),"Original AI verification wizard missing");
            a(livePage.includes("documentPrecheckOutcome"),"Original ID document precheck missing");
            a(!livePage.includes("DiditSandboxInline"),"Didit still in original verification");
            a(!fs.existsSync("components/identity/DiditSandboxInline.web.tsx"),"Didit inline panel still in original source");
            a(!fs.existsSync("app/identity-didit-demo.tsx"),"Didit standalone demo still in original source");
            const diff=git("diff","--name-status","--no-renames",process.env.SOURCE_SHA,process.env.BASE_SHA)
              .split("\n").filter(Boolean).sort();
            a.deepEqual(diff,[
              "A\tapp/identity-didit-demo.tsx",
              "A\t.github/workflows/qa-didit-sandbox-video-exact-live-20261124.yml",
              "M\tapp/identity-verification.web.tsx",
              "A\tcomponents/identity/DiditSandboxInline.web.tsx",
              "A\t.github/workflows/verify-didit-inline-exact-live-20261124.yml",
            ].sort(),"The published site has additional edits: abort rather than remove unrelated changes");
            const controllerDiff=git("-C","../controller","diff","--name-status","HEAD^","HEAD")
              .split("\n").filter(Boolean);
            a.deepEqual(controllerDiff,["A\t.github/workflows/restore-original-volunserve-ai-face-20261124.yml"],"Release controller changed extra paths");
            a.equal(git("-C","../controller","ls-remote","--heads","origin","live-protected").split(/\s+/)[0],
              process.env.GITHUB_SHA,"Protected release controller branch moved");
            const r=await fetch("https://volunserve.com/volunserve-release.json?rollback_preflight="+Date.now(),{
              headers:{"Cache-Control":"no-cache"},signal:AbortSignal.timeout(15000)});
            a(r.ok,"Live Hosting revision marker unavailable");
            const marker=await r.json();
            a.equal(marker.firebaseProject,process.env.SITE);
            a.equal(marker.revision,process.env.BASE_SHA,"Production site changed since Didit release: abort");
            console.log("PASS: exact Didit-only changes; original AI wizard preserved; no Firebase DB or rules touched");
          }
          main().catch(e=>{console.error("BLOCKED "+e.message);process.exitCode=1});
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build original AI verification frontend (no production data writes)
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit --incremental false
          npx expo export --platform web --clear
          env -u GITHUB_SHA node scripts/verify-hosting-release.cjs
          node <<'NODE'
          const a=require("node:assert/strict"),fs=require("node:fs");
          const m=JSON.parse(fs.readFileSync("dist/volunserve-release.json","utf8"));
          a.equal(m.revision,process.env.SOURCE_SHA);
          a.equal(m.firebaseProject,process.env.SITE);
          a(fs.existsSync("dist/identity-verification.html"),"Original AI route not compiled");
          a(!fs.existsSync("dist/identity-didit-demo.html"),"Didit demo still in restored website");
          console.log("PASS original AI-only website build and release marker");
          NODE
      - name: Verify Hosting credential and live source before release
        working-directory: site
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SA" || { echo "::error::Production Hosting environment key unavailable"; exit 1; }
          node <<'NODE'
          const a=require("node:assert/strict"),fs=require("node:fs");
          (async()=>{
            const key=JSON.parse(process.env.FIREBASE_SA);
            a.equal(key.project_id,process.env.SITE);
            a.equal(key.type,"service_account");
            a(key.private_key&&key.client_email);
            const r=await fetch("https://volunserve.com/volunserve-release.json?didit_preupload="+Date.now(),{
              headers:{"Cache-Control":"no-cache"},signal:AbortSignal.timeout(15000)});
            a(r.ok);a.equal((await r.json()).revision,process.env.BASE_SHA,"newer live revision detected");
            fs.writeFileSync(process.env.RUNNER_TEMP+"/didit-hosting-snapshot-key.json",process.env.FIREBASE_SA,{mode:0o600});
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/didit-hosting-snapshot-key.json" >> "$GITHUB_ENV"
      - name: Snapshot exact current Hosting version (rollback)
        id: backup
        working-directory: site
        run: node ../controller/.github/scripts/hosting-live-release-snapshot-20261122.cjs snapshot
      - name: Publish ONLY Firebase Hosting static site; no database/rules/functions
        id: publish
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.VOLUNSERVE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
          entryPoint: ./site
      - name: Confirm new live marker and route (safe Node retry)
        working-directory: site
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: 5af28d279618dacd5eab518e5e0d52259eae8844
        run: |
          node <<'NODE'
          const cp=require("node:child_process"),assert=require("node:assert/strict");
          (async()=>{
            let lastError;
            for(let attempt=0;attempt<8;attempt++){
              try{
                cp.execFileSync(process.execPath,["scripts/check-live-hosting.cjs"],{
                  env:process.env,stdio:"inherit",
                });
                const r=await fetch("https://volunserve.com/identity-verification?restored="+Date.now(),{
                  headers:{"Cache-Control":"no-cache"},signal:AbortSignal.timeout(15000)});
                assert(r.ok,"original Resident Identity Verification URL not accessible");
                assert((r.headers.get("content-type")||"").includes("html"),"demo URL must serve HTML");
                console.log("PASS restored live original AI verification and exact release marker confirmed");
                return;
              }catch(err){
                lastError=err;
                console.error("Verification retry "+(attempt+1)+": "+(err&&err.message||String(err)));
                if(attempt<7)await new Promise(resolve=>setTimeout(resolve,8000));
              }
            }
            throw lastError;
          })().catch(err=>{console.error("BLOCKED post-deploy verification:",err&&err.message||String(err));process.exitCode=1});
          NODE
      - name: Restore previous immutable Hosting if release failed
        if: failure() && steps.backup.outcome == 'success' && steps.publish.outcome != 'skipped'
        working-directory: site
        run: node ../controller/.github/scripts/hosting-live-release-snapshot-20261122.cjs restore
      - name: Remove temporary Hosting credential
        if: always()
        run: rm -f "$RUNNER_TEMP/didit-hosting-snapshot-key.json"
