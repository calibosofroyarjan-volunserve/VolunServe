name: Private Offline Face Accuracy Evaluator (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'identity-ai/qa_offline_match.py'
      - 'identity-ai/test_qa_offline_match.py'
      - '.github/workflows/identity-offline-accuracy-evaluator-no-deploy-20261112.yml'
permissions:
  contents: read
jobs:
  synthetic-privacy-and-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check offline CLI Python syntax
        run: python -m py_compile identity-ai/qa_offline_match.py identity-ai/test_qa_offline_match.py
      - name: Test FMR, FNMR and failure-to-acquire with synthetic scores only
        run: python -m unittest discover -s identity-ai -p test_qa_offline_match.py -v
      - name: Never use live services, real images or user credentials
        run: echo 'NO DEPLOY, NO REAL MEDIA, NO REMOTE AI OR FIREBASE REQUESTS'
