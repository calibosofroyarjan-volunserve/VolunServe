name: Private Offline Face Accuracy Evaluator (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'identity-ai/qa_offline_match.py'
      - 'identity-ai/test_qa_offline_match.py'
      - '.github/workflows/identity-offline-accuracy-evaluator-no-deploy-20261112.yml'
permissions:
  contents: read
jobs:
  synthetic-privacy-and-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check offline CLI Python syntax
        run: python -m py_compile identity-ai/qa_offline_match.py identity-ai/test_qa_offline_match.py
      - name: Test FMR, FNMR and failure-to-acquire with synthetic scores only
        run: python -m unittest discover -s identity-ai -p test_qa_offline_match.py -v
      - name: Syntax-check private Windows runner (never run Docker or read images)
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'identity-ai/Run-Private-Face-QA.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Private Windows QA runner contains a PowerShell parsing error' }
          $script = Get-Content 'identity-ai/Run-Private-Face-QA.ps1' -Raw
          foreach ($guard in @('--network none','--read-only','readonly','PRIVATE_IMAGE_FOLDER_CANNOT_BE_INSIDE_REPOSITORY')) {
            if (-not $script.Contains($guard)) { throw 'Required private QA isolation guard missing' }
          }
      - name: Never use live services, real images or user credentials
        run: echo 'NO DEPLOY, NO REAL MEDIA, NO REMOTE AI OR FIREBASE REQUESTS'
