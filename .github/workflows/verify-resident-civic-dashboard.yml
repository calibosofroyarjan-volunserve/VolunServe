name: Verify Resident Civic Dashboard
on:
  push:
    branches:
      - feature/final-resident-civic-dashboard-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Expo web export
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo export --platform web --clear --max-workers 1
      - name: Verify production HTML
        run: test -f dist/index.html
