name: Read-Only VolunServe Announcements Index Status Once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-announcements-index-once.yml"

permissions:
  contents: read

jobs:
  inspect-index:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.event.head_commit.message == 'Read-only check of Firestore announcements index status'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Firebase service account is for VolunServe only
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const account = JSON.parse(process.env.FIREBASE_SA || '{}');
          assert.equal(account.type, 'service_account');
          assert.equal(account.project_id, 'volunserve-3aa5b');
          console.log('Verified Firebase project credentials.');
          NODE
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: volunserve-3aa5b
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect exact index state (read-only)
        run: |
          gcloud firestore indexes composite list \
            --project=volunserve-3aa5b \
            --database='(default)' \
            --format=json > "$RUNNER_TEMP/indexes.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/indexes.json','utf8'));
          const matching = data.filter(index => {
            const group = index.collectionGroup || String(index.name || '').match(/\/collectionGroups\/([^/]+)\/indexes\//)?.[1];
            const fields = (index.fields || []).filter(f=>f.fieldPath!=='__name__');
            return group === 'announcements' && index.queryScope === 'COLLECTION' &&
              fields.length===2 && fields[0].fieldPath==='audience' && fields[0].order==='ASCENDING' &&
              fields[1].fieldPath==='publishAt' && fields[1].order==='DESCENDING';
          });
          console.log('Matching announcements indexes: '+matching.length);
          console.log('Status: '+(matching[0]?.state||'MISSING'));
          if(matching.length!==1 || matching[0].state!=='READY'){
            console.error('RELEASE NOT APPROVED: the index must be READY.');
            process.exitCode=1;
          }
          NODE
