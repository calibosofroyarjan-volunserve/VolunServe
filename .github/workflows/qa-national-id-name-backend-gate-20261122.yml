name: QA National ID account-name backend gate (NO DEPLOY)

on:
  push:
    branches: [fix/national-id-profile-name-feedback-backend-20261122]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  backend-name-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch only current Node backend without outdated gitlinks
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${REPO}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none --no-recurse-submodules origin "${SHA}"
          git sparse-checkout init --cone
          git sparse-checkout set backend
          git checkout --force FETCH_HEAD
      - name: Strict deployed backend diff scope
        run: |
          set -euo pipefail
          BASE=6f4c36b5878b0b9ba54e171e90bbb819c8f84899
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none --no-recurse-submodules origin "$BASE"
          git diff --name-status "$BASE" HEAD > /tmp/changes
          python - <<'PY'
          from pathlib import Path
          actual=sorted(Path('/tmp/changes').read_text().strip().splitlines())
          expected=sorted([
            'M\tbackend/server.js',
            'A\tbackend/test-identityNationalNamePrecheckGate.js',
            'A\t.github/workflows/qa-national-id-name-backend-gate-20261122.yml',
          ])
          assert actual==expected,(actual,expected)
          print('PASS only the existing identity document precheck and regression test changed')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and identity precheck/name/auth safety tests
        run: |
          set -euo pipefail
          node --check backend/server.js
          node --test backend/test-identityNationalNamePrecheckGate.js
          node --test backend/test-selectedIdPolicy.js
          node --test backend/test-identityPrecheckCors.js
          node --test backend/test-identityPrecheckTimeoutOnly.js
          node --test backend/test-identityOcrRescanHints.js
          node --test backend/test-identityAiReadiness.js
          node --test backend/test-identity-final-admin-only.js
          node --test backend/test-identity-three-attempt-review.js
      - run: echo 'NO DEPLOY, NO Firebase writes, no real ID or selfie used.'
