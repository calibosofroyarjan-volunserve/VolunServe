name: Validate retired LGU Operations without deployment
on:
  push:
    branches:
      - fix/retire-lgu-operations-admin-volunteer-dispatch-20261115

permissions:
  contents: read

jobs:
  navigation-and-emergency:
    name: Navigation, Volunteer offers, typecheck and web build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Navigation and dispatch policy tests (no Firebase credentials)
        run: |
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-defense-unified-lgu-volunteer-dispatch.cjs
          node scripts/test-unified-admin-dashboard-and-emergency-pagination.cjs
          node scripts/test-admin-compact-workspace-ux.cjs
          node scripts/test-lgu-admin-navigation-groups.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          node scripts/test-final-admin-scope.cjs
          node scripts/test-admin-response-workspace-ux.cjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript compiler
        run: npx tsc --noEmit --incremental false
      - name: Expo web export (build only, never deploy)
        run: npx expo export --platform web --clear
