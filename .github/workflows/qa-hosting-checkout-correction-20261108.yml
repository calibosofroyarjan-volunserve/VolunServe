name: QA Hosting Checkout Correction (No Deploy)
on:
  push:
    branches: [fix/auto-hosting-checkout-20261108]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exactly as production auto-workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check pinned auto-workflow policy and frozen guards
        run: |
          node --check scripts/guard-live-protected-release.cjs
          node scripts/guard-live-protected-release.cjs --self-test
      - name: Verify remote branch is accessible with checkout credentials
        run: |
          git ls-remote --heads origin live-protected
      - name: Validate production web app
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit --incremental false
          node scripts/test-admin-navigation-contract.cjs
          node scripts/test-lgu-admin-global-ui-pagination.cjs
          npx expo export --platform web --clear
          node scripts/verify-hosting-release.cjs
