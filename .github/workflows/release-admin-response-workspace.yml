name: Publish Verified LGU Admin Response Workspace (Hosting Only)
on:
  push:
    branches:
      - release/admin-response-workspace-20261029
    paths:
      - .github/workflows/release-admin-response-workspace.yml
permissions:
  contents: read
concurrency:
  group: volunserve-production-hosting-release
  cancel-in-progress: false
jobs:
  publish-admin-response-ui:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm release changes are workflow-only on approved main
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "2faa170a5563985cf42fc3934eca80d40b9457a7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/release-admin-response-workspace.yml"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Admin response, existing approvals and map navigation
        run: |
          node scripts/test-admin-response-workspace-ux.cjs
          node scripts/test-admin-people-verification-premium-ui.cjs
          node scripts/test-lgu-dashboard-inline-approvals-and-paging.cjs
          node scripts/test-embedded-emergency-map-navigation.cjs
          node scripts/test-pavia-admin-pagination-announcements.cjs
          npx tsc --noEmit --pretty false
      - name: Produce verified static Expo Hosting artifact
        run: |
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Refuse to deploy without Firebase Hosting credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing Hosting service account; production unchanged."
            exit 1
          fi
      - name: Deploy Firebase Hosting only - no database, functions or rules
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: live
      - name: Verify exact release SHA and public pages on volunserve.com
        env:
          VOLUNSERVE_HOSTING_URL: https://volunserve.com
          VOLUNSERVE_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-live-hosting.cjs; then exit 0; fi
            echo "Release propagation check $attempt"
            sleep 10
          done
          echo "::error::Expected release revision not verified on custom domain."
          exit 1
