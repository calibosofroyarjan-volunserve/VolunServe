name: Validate Disposable Email and Guest Signup Guards (NO DEPLOY)
on:
  push:
    branches:
      - fix/signup-disposable-guest-guards-20261108
  pull_request:
    paths:
      - 'lib/registrationEmailPolicy.ts'
      - 'lib/signupRegistration.ts'
      - 'lib/firebaseAuth.ts'
      - 'app/_layout.tsx'
      - 'functions/index.js'
      - 'functions/registrationBlocking.js'
      - 'functions/registrationEmailScreening.js'
      - 'functions/disposable-email-domains.txt'
      - 'functions/test-registration-email-screening.js'
      - 'scripts/test-verified-community-registration-rules.cjs'
      - 'app/public/_layout.tsx'
      - 'components/guest/GuestWorkspace.tsx'
      - 'scripts/test-guest-auth-route-isolation.cjs'
      - 'components/auth/EmailFirstSignup.tsx'
      - 'app/login.web.tsx'
      - 'app/login.tsx'
      - 'firestore.rules'
      - 'scripts/test-signup-prod.cjs'
      - '.github/workflows/validate-auth-guest-20261108.yml'
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: node --test functions/test-registration-email-screening.js
      - run: node --check functions/index.js && node --check functions/registrationBlocking.js
      - run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve-verified-signup "node scripts/test-verified-community-registration-rules.cjs"
      - run: node scripts/test-signup-prod.cjs
      - run: node scripts/test-guest-readonly-preview.cjs
      - run: node scripts/test-guest-auth-route-isolation.cjs
      - run: npx tsc --noEmit --incremental false
      - run: npx expo export --platform web --clear
# Only the disposable local emulator is used. No production credentials, Firebase deploy or Render calls.
