name: Validate Disposable Email and Guest Signup Guards (NO DEPLOY)
on:
  push:
    branches:
      - security/live-verified-email-guest-20261108
  pull_request:
    paths:
      - 'lib/registrationEmailPolicy.ts'
      - 'lib/signupRegistration.ts'
      - 'lib/firebaseAuth.ts'
      - 'app/_layout.tsx'
      - 'functions/index.js'
      - 'functions/registrationBlocking.js'
      - 'functions/registrationIpRateLimiter.js'
      - 'lib/verificationCooldown.ts'
      - 'lib/firebase.ts'
      - 'scripts/test-staging-firebase-isolation.cjs'
      - 'scripts/test-existing-account-compatibility.cjs'
      - 'scripts/test-signup-abuse-controls.cjs'
      - 'functions/verifiedCallableEmail.js'
      - 'functions/test-verified-callable-email.js'
      - 'scripts/test-identity-blocking-opt-in.cjs'
      - 'functions/registrationEmailScreening.js'
      - 'functions/providerTypoDomains.json'
      - 'functions/disposable-email-domains.txt'
      - 'functions/test-registration-email-screening.js'
      - 'scripts/test-verified-community-registration-rules.cjs'
      - 'app/public/_layout.tsx'
      - 'app/admin-request.tsx'
      - 'backend/server.js'
      - 'backend/verifiedFirebaseToken.js'
      - 'backend/tests/verifiedFirebaseToken.test.js'
      - 'storage.rules'
      - 'scripts/test-verified-storage-rules.cjs'
      - 'components/guest/GuestWorkspace.tsx'
      - 'scripts/test-guest-auth-route-isolation.cjs'
      - 'components/auth/EmailFirstSignup.tsx'
      - 'app/login.web.tsx'
      - 'app/login.tsx'
      - 'firestore.rules'
      - 'scripts/test-signup-prod.cjs'
      - 'scripts/test-resident-field-validation.cjs'
      - '.github/workflows/validate-auth-guest-20261108.yml'
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: node --test functions/test-registration-email-screening.js
      - run: node --test scripts/test-signup-abuse-controls.cjs
      - run: node --test scripts/test-staging-firebase-isolation.cjs
      - run: node --test scripts/test-identity-blocking-opt-in.cjs
      - run: node --test functions/test-verified-callable-email.js
      - run: node --test backend/tests/verifiedFirebaseToken.test.js
      - run: node --check backend/server.js
      - run: node --check functions/index.js && node --check functions/registrationBlocking.js && node --check functions/registrationIpRateLimiter.js
      - run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve-verified-signup "node scripts/test-verified-community-registration-rules.cjs"
      - run: npx firebase-tools emulators:exec --only firestore --project demo-volunserve-account-compatibility "node scripts/test-existing-account-compatibility.cjs"
      - run: npx firebase-tools emulators:exec --only firestore,storage --project demo-volunserve-storage-verified "node scripts/test-verified-storage-rules.cjs"
      - run: node scripts/test-signup-prod.cjs
      - run: node --test scripts/test-resident-field-validation.cjs
      - run: node scripts/test-guest-readonly-preview.cjs
      - run: node scripts/test-guest-auth-route-isolation.cjs
      - run: npx tsc --noEmit --incremental false
      - run: npx expo export --platform web --clear
      # Compile the separate staging target with a synthetic public API key.
      # This is a NO-DEPLOY build and never contacts live or staging Firebase.
      - name: Compile isolated full-staging web signup (NO DEPLOY)
        env:
          EXPO_PUBLIC_VOLUNSERVE_FIREBASE_TARGET: staging
          EXPO_PUBLIC_VOLUNSERVE_STAGING_FIREBASE_API_KEY: AIzaSySyntheticStagingWebKeyNotUsableForRequests
          EXPO_PUBLIC_VOLUNSERVE_STAGING_FIREBASE_AUTH_DOMAIN: volunserve-full-staging.firebaseapp.com
          EXPO_PUBLIC_VOLUNSERVE_STAGING_FIREBASE_PROJECT_ID: volunserve-full-staging
          EXPO_PUBLIC_VOLUNSERVE_STAGING_FIREBASE_STORAGE_BUCKET: volunserve-full-staging.firebasestorage.app
          EXPO_PUBLIC_VOLUNSERVE_STAGING_FIREBASE_MESSAGING_SENDER_ID: '429213950126'
          EXPO_PUBLIC_VOLUNSERVE_STAGING_FIREBASE_APP_ID: '1:429213950126:web:955dbf575697826b674d3f'
        run: npx expo export --platform web --clear
# Only the disposable local emulator is used. No production credentials, Firebase deploy or Render calls.
