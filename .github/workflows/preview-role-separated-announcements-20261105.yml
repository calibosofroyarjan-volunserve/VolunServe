name: Preview Super Admin System Updates and Barangay Announcements (NO LIVE)
on:
  push:
    branches: [feature/role-separated-system-barangay-announcements-20261105]
    paths: [".github/workflows/preview-role-separated-announcements-20261105.yml"]
permissions:
  contents: read
jobs:
  preview-only:
    if: github.repository == 'calibosofroyarjan-volunserve/VolunServe' && github.event.head_commit.message == 'One-shot preview System Updates and Barangay Announcements on exact latest live source'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify exact latest production version and no unrelated source edits
        env:
          LIVE_BASE: 8cf5141d6fc51b29e443878efb8619fb7186b086
        run: |
          git merge-base --is-ancestor "$LIVE_BASE" HEAD
          git diff --name-only "$LIVE_BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          node - <<'NODE'
          const fs=require('node:fs');
          const changed=fs.readFileSync(process.env.RUNNER_TEMP+'/changed.txt','utf8').split('\n').filter(Boolean);
          const allowed=new Set([
            'app/(admin)/create-announcement.tsx',
            'app/(superadmin)/_layout.tsx',
            'app/(superadmin)/system-updates.tsx',
            'app/(tabs)/notifications.tsx',
            'app/(tabs)/announcements.tsx',
            'components/home/Home.web.tsx','components/home/Home.native.tsx',
            'lib/useCommunityAnnouncements.ts',
            'scripts/test-system-updates-firebase-roles.cjs',
            'scripts/prepare-system-updates-live-rules.py',
            '.github/workflows/validate-role-separated-announcements-20261105.yml',
            '.github/workflows/stage-role-separated-announcements-rules-inactive.yml',
            '.github/workflows/preview-role-separated-announcements-20261105.yml'
          ]);
          const unauthorized=changed.filter(x=>!allowed.has(x));
          if(unauthorized.length)throw Error('Protected live source changed: '+unauthorized.join(','));
          console.log('PASS exact latest live parent and protected Login/Signup/Auth/other modules preserved');
          NODE
          node - <<'NODE'
          (async()=>{
            const response=await fetch('https://volunserve.com/volunserve-release.json?guard='+Date.now(),{headers:{'cache-control':'no-cache'}});
            if(!response.ok)throw Error('Live Hosting revision read failed');
            const j=await response.json();
            if(j.revision!==process.env.LIVE_BASE)throw Error('Live Hosting changed from reviewed source; do not preview outdated source');
            console.log('PASS actual live revision still '+j.revision);
          })().catch(e=>{console.error(e.message);process.exit(1);});
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile TypeScript and export updated web
        run: |
          npx tsc --noEmit --pretty false
          npx expo export --platform web
          node scripts/verify-hosting-release.cjs
      - name: Stamp preview traceability
        env:
          LIVE_BASE: 8cf5141d6fc51b29e443878efb8619fb7186b086
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('dist/volunserve-preview.json',JSON.stringify({
            revision:process.env.GITHUB_SHA,
            basedOnLive:process.env.LIVE_BASE,
            scope:'superadmin-system-updates-and-barangay-announcements',
            noProductionRulesChanges:true
          }));
          NODE
      - name: Deploy TEMPORARY Firebase Hosting PREVIEW CHANNEL ONLY
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLUNSERVE_3AA5B || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volunserve-3aa5b
          channelId: announcements-livebased-20261105
          expires: 1d
      - name: Confirm that this workflow never deploys live Hosting or Firebase rules
        run: echo 'Only temporary preview Hosting changed. LIVE Hosting, Rules release, Auth, Functions, Firebase documents unchanged.'
